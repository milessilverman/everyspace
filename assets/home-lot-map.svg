<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 412" width="512" height="412">
  <style>
    :root {
      --sheet: #e4f5f2;
      --dots: #a7dfd6;
      --neighbor: #9dd9d0;
      --ink: #08776e;
      --lot: #fcfdfd;
      --lawn: #e2f4f0;
      --roof: #b5e2db;
      --roof-shade: #a7d9d1;
      --road: #eff3f4;
      --road-line: #c7d1d5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sheet: #142b2e;
        --dots: #285654;
        --neighbor: #3d716d;
        --ink: #79ddd0;
        --lot: #213c3e;
        --lawn: #193739;
        --roof: #315e5e;
        --roof-shade: #275252;
        --road: #1b2932;
        --road-line: #50646b;
      }
    }
    text { fill: var(--ink); font: 700 14px system-ui, sans-serif; }
    @media (max-width: 400px) { text { font-size: 16px; } }
  </style>
  <defs>
    <pattern id="lot-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="2" r=".85" fill="var(--dots)"/>
    </pattern>
    <path id="tree-canopy" d="M3 14C1 8 5 2 11 3c3-4 11-4 14 2 6 1 9 9 4 14-1 6-9 8-13 5-6 2-13-3-13-10Z"/>
    <g id="tree" stroke="var(--ink)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <use href="#tree-canopy" fill="var(--lawn)"/>
      <path d="m16 22 0-8 6-6m-6 6-4-3" fill="none"/>
    </g>
  </defs>

  <rect width="512" height="412" fill="var(--sheet)"/>
  <rect width="512" height="338" fill="url(#lot-grid)"/>
  <path d="M29 33h65v282H29zM419 33h64v282h-64z" fill="none" stroke="var(--neighbor)" stroke-dasharray="4 5"/>

  <rect x="115" y="33" width="283" height="282" fill="var(--lot)"/>
  <path d="M123 42h267v101H123zM123 225h267v82H123z" fill="var(--lawn)"/>
  <rect x="115" y="33" width="283" height="282" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="6 4"/>
  <g fill="var(--lot)" stroke="var(--ink)" stroke-width="1.3">
    <rect x="111" y="29" width="8" height="8" rx="1"/>
    <rect x="394" y="29" width="8" height="8" rx="1"/>
    <rect x="111" y="311" width="8" height="8" rx="1"/>
    <rect x="394" y="311" width="8" height="8" rx="1"/>
  </g>

  <g fill="none" stroke="var(--road-line)">
    <path d="M146 148h166v88H146z"/>
    <path d="M376 218h11v102h-11" stroke-dasharray="4 5"/>
  </g>
  <path d="M153 130h136v26h32v74h-65v18h-70v-18h-33Z" fill="var(--roof)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M153 130l47 51h83l38-25m-32-26-32 51m-57 0v17l-14 32m14-32h83v-17m0 17 38 32m-65-32v50" fill="none" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M186 230h70v18h-70z" fill="var(--roof-shade)" stroke="var(--ink)" stroke-width="1.4"/>

  <use href="#tree" transform="translate(144 50) scale(1.35)"/>
  <use href="#tree" transform="translate(126 250) scale(1.28)"/>
  <use href="#tree" transform="translate(275 258) scale(.94)"/>
  <rect x="291" y="61" width="65" height="55" rx="14" fill="none" stroke="var(--dots)"/>
  <rect x="298" y="68" width="51" height="41" rx="11" fill="var(--lawn)" stroke="var(--ink)" stroke-width="1.4"/>
  <path d="M312 75v14m7-14v14m-7-10h7m-7 5h7m-11 15q6-6 12 0t12 0q4-4 8-1" fill="none" stroke="var(--ink)" stroke-width="1.1" stroke-linecap="round"/>

  <path d="M0 338h512v74H0z" fill="var(--road)"/>
  <path d="M0 352h512M0 394h512" fill="none" stroke="var(--road-line)" opacity=".55"/>
  <path d="M0 373h512" fill="none" stroke="var(--road-line)" stroke-width="1.4" stroke-dasharray="12 9"/>
  <rect x="328" y="210" width="49" height="128" fill="var(--road)" stroke="var(--ink)" stroke-width="1.3"/>
  <path d="M369 220v109" fill="none" stroke="var(--road-line)" stroke-dasharray="4 4"/>
  <rect x="342" y="250" width="21" height="26" rx="4" fill="var(--lot)" stroke="var(--ink)" stroke-width="1.15"/>
  <path d="M342 258h21m-21 10h21" fill="none" stroke="var(--ink)" stroke-width="1.1"/>

  <g fill="none" stroke="var(--ink)" stroke-width="1">
    <path d="M86 90h29M355 87h61M321 181h81M377 294h39"/>
  </g>
  <text x="48" y="94">Lot</text>
  <text x="210" y="98">Backyard</text>
  <text x="423" y="91">Pool</text>
  <text x="408" y="185">Home</text>
  <text x="199" y="286">Front yard</text>
  <text x="423" y="298">Driveway</text>
</svg>
