const SPEC_HTML = "<h1 id=\"everyspace-product-spec-working-name\">Everyspace: product spec (working name)<\/h1>\n<p>Everyspace is a marketplace for renting out <strong>any part of a property<\/strong> for <strong>any length of time<\/strong>. You could rent out a backyard for one night, a driveway spot for fair weekend, a garage corner for a month, a whole house like a vacation rental, a front yard for a garden, or a roof for 20 years to someone who pays for solar panels on it.<\/p>\n<p>It also handles <strong>multi-unit buildings<\/strong>. A renter can take just an apartment, or an apartment plus two parking spaces and a storage locker, under rules the owner sets.<\/p>\n<p>The app has <strong>two sides<\/strong>. The <strong>everyday app<\/strong> is for people renting from people: parking, storage, yards, rooms, homes, kitchens, docks. <strong>Everyspace for Business<\/strong> is a separate side where companies lease roofs, pads, road frontage, walls and lots on multi-year agreements. Someone scrolling for a place to park never sees a rooftop solar lease, and a solar installer doesn't wade through backyard parties (§1b).<\/p>\n<p>This document covers what can be rented and how renting works. It comes before the build. The prototype in <code>src/<\/code> implements the core rules described here.<\/p>\n<hr>\n<h2 id=\"1-what-can-be-rented\">1. What can be rented<\/h2>\n<p>Every listing is a <strong>space<\/strong>, and every space has a <strong>category<\/strong>. The category sets which rental lengths are allowed, how the space is measured and priced, the default booking mode, and the checklist a host has to complete before going live.<\/p>\n<p>Rental lengths (terms):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Term<\/th><th>Unit<\/th><th>Typical use<\/th><\/tr><\/thead><tbody><tr><td>Hourly<\/td><td>hour<\/td><td>Backyard party, pool, studio session, EV charging<\/td><\/tr><tr><td>Nightly / daily<\/td><td>day<\/td><td>Vacation stay, event-day parking, overnight camping<\/td><\/tr><tr><td>Weekly<\/td><td>week<\/td><td>Longer stay, temporary storage<\/td><\/tr><tr><td>Month-to-month<\/td><td>month<\/td><td>Parking, storage, garden plot, room<\/td><\/tr><tr><td>Fixed lease<\/td><td>month, 6–24 mo<\/td><td>Apartment, ADU, long-term parking<\/td><\/tr><tr><td>Infrastructure agreement<\/td><td>year, 5–25 yr<\/td><td>Rooftop solar, battery, charger, antenna<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"catalog\">Catalog<\/h3>\n<p><strong>Living<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Entire home<\/td><td>daily, weekly, monthly, lease<\/td><td>whole<\/td><td>Works like Airbnb. Needs a short-term-rental permit and occupancy tax where the city requires them.<\/td><\/tr><tr><td>Apartment / unit<\/td><td>daily, monthly, lease<\/td><td>whole<\/td><td>A unit in a multi-unit building. It can anchor add-ons (§3).<\/td><\/tr><tr><td>ADU / guest house<\/td><td>daily, weekly, monthly, lease<\/td><td>whole<\/td><td><\/td><\/tr><tr><td>Private room<\/td><td>daily, weekly, monthly, lease<\/td><td>whole<\/td><td>Shared common areas are listed in the house rules.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Outdoor and activity<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Backyard<\/td><td>hourly, daily<\/td><td>whole<\/td><td>Parties, gatherings, dog play, photo shoots. Noise curfew and guest cap are required.<\/td><\/tr><tr><td>Yard campsite<\/td><td>daily, weekly<\/td><td>site<\/td><td>Tent or small RV overnight. Requires restroom access.<\/td><\/tr><tr><td>Pool<\/td><td>hourly<\/td><td>whole<\/td><td>Lifeguard and waiver rules. Host must confirm insurance.<\/td><\/tr><tr><td>Workspace / studio / workshop<\/td><td>hourly, daily, monthly<\/td><td>whole<\/td><td>Home office, music room, wood shop.<\/td><\/tr><tr><td>Filming / photo location<\/td><td>hourly, daily<\/td><td>whole<\/td><td>Always request-to-book. City film permit may be needed.<\/td><\/tr><tr><td>Kitchen<\/td><td>hourly, daily, monthly<\/td><td>whole<\/td><td>Cottage-food bakers, meal prep, cooking classes. Food-handler rules and allergen disclosure.<\/td><\/tr><tr><td>Sport court<\/td><td>hourly<\/td><td>whole<\/td><td>Pickleball, tennis, basketball. Lighting hours and waiver.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Parking<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Parking spot<\/td><td>hourly, daily, weekly, monthly, lease<\/td><td>spot (quantity)<\/td><td>Driveway, garage, or carport. <strong>Event pricing<\/strong> covers fair, stadium, and parade days.<\/td><\/tr><tr><td>RV / boat / trailer parking<\/td><td>weekly, monthly, lease<\/td><td>spot<\/td><td>Length limit and HOA check.<\/td><\/tr><tr><td>EV charging<\/td><td>hourly, daily, monthly<\/td><td>charger<\/td><td>Host's own charger. Price covers time and electricity.<\/td><\/tr><tr><td>Boat dock / slip<\/td><td>daily, weekly, monthly, lease<\/td><td>slip<\/td><td>Max boat length and draft, dock condition and insurance.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Storage<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Garage storage<\/td><td>weekly, monthly, lease<\/td><td>sq ft (quantity of bays)<\/td><td>Hazardous materials are not allowed. Host sets access hours.<\/td><\/tr><tr><td>Attic storage<\/td><td>monthly, lease<\/td><td>sq ft<\/td><td>Weight limit and ladder access must be disclosed.<\/td><\/tr><tr><td>Basement / closet / shed<\/td><td>weekly, monthly, lease<\/td><td>sq ft<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Land and growing<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Garden plot<\/td><td>monthly, lease<\/td><td>sq ft (quantity of plots)<\/td><td>Front or back yard. Water access, HOA front-yard rules, and chemical policy.<\/td><\/tr><tr><td>Beehive / small-ag site<\/td><td>monthly, lease<\/td><td>site<\/td><td>Local apiary rules apply.<\/td><\/tr><tr><td>Pasture / paddock<\/td><td>monthly, lease<\/td><td>acre<\/td><td>Horses, goats, grazing. Fencing, water and livestock zoning.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"business-side-leased-to-companies-only\">Business side (leased to companies only)<\/h3>\n<p>These never appear in the everyday app. They're listed on <strong>Everyspace for Business<\/strong>, and only verified business accounts can send proposals on them (§1b).<\/p>\n<p><strong>Energy and infrastructure.<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Rooftop solar<\/td><td>infrastructure, 10–25 yr<\/td><td>sq ft of roof<\/td><td>A third party pays for, owns, and maintains the panels and pays the owner rent or a share of the power. Requires a roof-age and structural check, utility interconnection (net metering, community solar, or virtual net metering), a removal and re-roof clause, and a recorded lease or easement.<\/td><\/tr><tr><td>Battery site<\/td><td>infrastructure, 5–20 yr<\/td><td>site<\/td><td>Garage wall, side yard, or pad. Requires fire code setbacks (NFPA 855), a utility or virtual-power-plant program, and permits.<\/td><\/tr><tr><td>Public EV charger site<\/td><td>infrastructure, 5–15 yr<\/td><td>site<\/td><td>A third party installs a charger in a driveway or curb cut.<\/td><\/tr><tr><td>Telecom / sensor site<\/td><td>infrastructure, 5–25 yr<\/td><td>site<\/td><td>Small-cell antenna, mesh node, or weather station.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Commercial and fleet.<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Fleet &amp; van parking<\/td><td>monthly, lease<\/td><td>spot<\/td><td>Overnight lots for delivery and service fleets. Zoning must allow commercial vehicles; lighting and neighbor notice.<\/td><\/tr><tr><td>Sign / billboard site<\/td><td>lease, 5–25 yr<\/td><td>site<\/td><td>Road frontage. Local sign ordinance permit, structural/wind review, illumination hours.<\/td><\/tr><tr><td>Parcel locker host<\/td><td>lease, 5–25 yr<\/td><td>site<\/td><td>A lobby or exterior wall with power for a carrier's locker bank.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Later:<\/strong> laundry time, music/practice rooms by the hour, farmland leases, drone landing pads, cell-on-wheels event sites.<\/p>\n<p><strong>Not allowed:<\/strong> public streets and curbs, shared HOA common areas the host doesn't control, and any space whose required permit the host can't show.<\/p>\n<hr>\n<h2 id=\"1b-two-sides-everyday-and-business\">1b. Two sides: everyday and business<\/h2>\n<p>Each category has an <strong>audience<\/strong>:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><\/th><th>Everyday app<\/th><th>Everyspace for Business<\/th><\/tr><\/thead><tbody><tr><td>Who rents<\/td><td>People<\/td><td>Verified companies (solar installers, charging networks, telecoms, parcel-locker networks, fleets, sign companies)<\/td><\/tr><tr><td>What's listed<\/td><td>Stays, activities, parking and docks, storage, land<\/td><td>Energy &amp; infrastructure, commercial &amp; fleet<\/td><\/tr><tr><td>Typical length<\/td><td>An hour to two years<\/td><td>Monthly fleet leases to 25-year agreements<\/td><\/tr><tr><td>How it's booked<\/td><td>Instant or request to book<\/td><td>Proposal → site assessment → contract → installation<\/td><\/tr><tr><td>What renters see<\/td><td>Photos, reviews, availability calendar<\/td><td>Site facts: roof size and age, electrical service, traffic counts, access<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Rules:<\/p>\n<ul><li>Everyday search never returns business categories. Business search returns only business categories, and bundles don't apply there.<\/li><li>Only accounts verified as businesses can quote or propose on business sites. People see a landing page explaining the business side instead.<\/li><li>Owners list both kinds from the same hosting mode. The listing flow asks first: <strong>Rent to people<\/strong> or <strong>Lease to companies<\/strong>. Business listings skip the add-on step and ask for site facts.<\/li><li>Business accounts get their own tabs: <strong>Sites<\/strong> (list or map, filtered by site type) and <strong>Pipeline<\/strong> (proposals by stage, with active rent per year).<\/li><\/ul>\n<h2 id=\"1c-transparent-prices\">1c. Transparent prices and lower fees<\/h2>\n<p><strong>All-in, always.<\/strong> Every price a renter sees, from search cards to the listing page to checkout, already includes the 10% service fee. Listing pages split it out: the owner's price, the service fee, and a \"where your money goes\" bar (owner 97%, owner fee 3%, service fee +10%). There are no cleaning fees or surprise fees at checkout.<\/p>\n<p><strong>Same space elsewhere.<\/strong> If the owner also lists the space on another site, the listing shows a <strong>Price check<\/strong>: our all-in price next to each other site's estimated all-in price for one unit (their price plus their renter fee and any cleaning or booking fee), with the date we last checked it.<\/p>\n<ul><li>Where the data comes from: links <strong>owners add themselves<\/strong> in Manage listing. We don't scrape other sites (their terms usually forbid it). We re-verify linked listings on a schedule.<\/li><li>Other sites' fees come from one table of estimates, labeled \"estimate\" until verified (RESEARCH.md §1).<\/li><\/ul>\n<p><strong>Lower fees, both ways (no price matching).<\/strong> If the owner takes home the same on every site, the renter pays less here. If the renter pays the same on every site, the owner takes home more here. We never discount from the owner’s payout and never run price-match claims.<\/p>\n<h2 id=\"1d-owner-friendly-by-default\">1d. Owner-friendly by default<\/h2>\n<ul><li><strong>Keep 97%.<\/strong> One flat 3% owner fee, shown on every booking as \"you get $X\".<\/li><li><strong>Manage listing<\/strong> for every space:<ul><li>Go live or pause with one switch. A paused listing leaves search immediately; existing bookings stay.<\/li><li>Edit prices with <strong>nearby price ranges<\/strong> (min–max and median of similar listings) and a live \"renter pays $X · you get $Y\" line.<\/li><li>Block dates on a calendar, with a reason (using it yourself, booked elsewhere).<\/li><li>Link the same listing on other sites. If it's cheaper elsewhere, the owner sees a friendly heads-up with a one-tap fix.<\/li><\/ul><\/li><li><strong>You earn the same everywhere.<\/strong> For each linked listing, Manage listing shows the owner's take-home per unit there (after that site's owner fee) and here. It suggests the price here that pays them exactly the same; because our fees are lower, renters then pay less here. One tap applies it.<\/li><li><strong>Instant book or approve each request<\/strong>, chosen per listing.<\/li><li><strong>Earnings spreadsheet:<\/strong> download every booking with what the renter paid, what Everyspace earned and the owner's payout.<\/li><li><strong>Quick replies in chat<\/strong> for common answers.<\/li><li><strong>Pricing help when listing:<\/strong> typical local prices plus the live range of similar listings, and the payout shown as they type.<\/li><li><strong>No surprises:<\/strong> access details are only shared after confirmation, a deposit is held for higher-risk spaces, and conversations are tied to each booking.<\/li><\/ul>\n<h2 id=\"1e-growth-features\">1e. Growth features<\/h2>\n<ul><li><strong>Earnings estimator.<\/strong> Anyone can tap \"Earn from your place\" and say what they have: driveway spots, garage bays, backyard hours, spare-room nights, roof area, a wall or frontage. It shows estimated monthly and yearly income, split into money from people and money from companies, using typical local prices and realistic occupancy. One tap starts a listing for any of those things.<\/li><li><strong>Saved.<\/strong> A heart on every card saves it to a Saved tab.<\/li><li><strong>Guest favorites.<\/strong> Spaces rated 4.8 or higher with at least two reviews get a badge and their own row in Explore.<\/li><li><strong>Ideas.<\/strong> One-tap starting points in Explore, like \"Park for the game\", \"Throw a party\", \"Store your stuff\", \"Dock your boat\".<\/li><\/ul>\n<hr>\n<h2 id=\"2-how-it-works\">2. How it works<\/h2>\n<h3 id=\"properties-and-spaces\">Properties and spaces<\/h3>\n<pre><code>Host ─┬─ Property (address, type, rules, HOA y/n, insurance)\n      └─ Space (category, quantity, rates per term, availability, parent?)\n            └─ Space (child) ...<\/code><\/pre>\n<ul><li><strong>Quantity.<\/strong> One listing can stand for several identical units, such as 4 driveway spots, 3 garage bays, or 8 storage lockers. Bookings use up quantity, and the listing stays available until all units are taken.<\/li><li><strong>Hierarchy (parent/child).<\/strong> A space can sit inside another one. For example, a garage bay is inside the garage, a room is inside the house, and an apartment is inside the building.<ul><li>Booking a parent blocks all of its children. If the whole house is booked, its rooms and backyard are not.<\/li><li>Booking any child blocks the parent as a whole. Rooms 1 and 2 can be rented separately, but then the whole house can't be.<\/li><li>Structural containers such as a building or a garage can be marked <strong>not rentable<\/strong>. They organize the listing and never block anything.<\/li><\/ul><\/li><li><strong>Explicit conflicts.<\/strong> Some spaces overlap without one sitting inside the other, such as \"driveway parking\" and \"RV parking\" in the same driveway. A host can mark them as conflicting.<\/li><li><strong>Independent spaces.<\/strong> A roof leased for solar does not conflict with the house being rented nightly. It isn't a child of the house, so the two never block each other.<\/li><\/ul>\n<h3 id=\"pricing\">Pricing<\/h3>\n<ul><li>There is one rate per allowed term, such as $12/hour, $45/day, or $180/month. Weekly stays use the weekly rate plus extra days at the daily rate. Partial months are prorated at the monthly rate divided by 30.<\/li><li><strong>Event pricing.<\/strong> Hosts can set date-range overrides, for example \"County Fair, Aug 14–17, $40/day\" for a driveway spot. When a booking covers those dates, the override replaces the daily rate for those days.<\/li><li><strong>Add-on price.<\/strong> A space can cost less when it is attached to an anchor rental (§3).<\/li><li><strong>Packages<\/strong> have their own price, either a fixed amount per period or a % discount (§3).<\/li><li><strong>Fees (prototype values).<\/strong> Renters pay a 10% service fee, and hosts pay 3%. Long and infrastructure agreements are charged per period rather than all at once.<\/li><li><strong>Deposits<\/strong> are set by category, such as a whole home or storage, and are held, not charged.<\/li><\/ul>\n<h3 id=\"booking-modes\">Booking modes<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Mode<\/th><th>When<\/th><th>Flow<\/th><\/tr><\/thead><tbody><tr><td>Instant<\/td><td>Short, low-risk rentals: parking, storage, hourly yard<\/td><td>Pay, then <strong>confirmed<\/strong><\/td><\/tr><tr><td>Request<\/td><td>Whole homes, filming, leases, anything the host flags<\/td><td><strong>pending<\/strong> (dates held 24h), then host approves (<strong>confirmed<\/strong>) or declines<\/td><\/tr><tr><td>Proposal<\/td><td>Infrastructure agreements<\/td><td><strong>proposed<\/strong>, then <strong>site assessment<\/strong>, then <strong>contract<\/strong>, then <strong>confirmed<\/strong>. Rent starts when the system is commissioned.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A cart with several items uses its strictest mode. For example, instant parking plus a request-to-book apartment becomes a request.<\/p>\n<p>States: <code>pending | proposed | site_assessment | contract | confirmed | active | completed | declined | cancelled<\/code>. Pending and proposal-stage bookings hold the space, so nobody can double-book while the host decides.<\/p>\n<h3 id=\"payments-schedule\">Payments schedule<\/h3>\n<ul><li><strong>Hourly, daily, or weekly:<\/strong> the full amount is charged at booking. The host is paid out 24h after check-in.<\/li><li><strong>Month-to-month or lease:<\/strong> the first period plus the deposit is charged at booking, then autopay each period. Month-to-month ends with 30 days' notice.<\/li><li><strong>Infrastructure:<\/strong> annual (or monthly) rent paid by the company. The platform takes its fee on each payment.<\/li><\/ul>\n<h3 id=\"access-and-handoff\">Access and handoff<\/h3>\n<p>Each space has access instructions that are revealed after confirmation, such as a gate code, a lockbox, or a smart-lock code generated per booking. It also has access hours (storage 7am–9pm, for example) and a check-in/out photo log, which is used for disputes about storage contents and yard condition.<\/p>\n<hr>\n<h2 id=\"3-multi-unit-buildings-add-ons-and-packages\">3. Multi-unit buildings, add-ons, and packages<\/h2>\n<p>The owner of an apartment building lists the <strong>building<\/strong> as a non-rentable container. Inside it go the <strong>units<\/strong>, a <strong>parking pool<\/strong> (for example 12 spots), a <strong>storage locker pool<\/strong>, and maybe EV chargers. The owner then decides how each one can be rented:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Rental policy<\/th><th>Meaning<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><code>standalone<\/code><\/td><td>Anyone can rent it alone<\/td><td>Apartment 2A, EV charger by the hour<\/td><\/tr><tr><td><code>addon<\/code><\/td><td>Can be rented only with an anchor<\/td><td>Garage parking only for building tenants<\/td><\/tr><tr><td><code>both<\/code><\/td><td>Rentable alone, with a lower price as an add-on<\/td><td>Storage locker: $90/mo alone or $60/mo with a unit<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Add-on rules<\/strong> are set on the add-on space:<\/p>\n<ul><li><code>anchors<\/code>: which spaces can carry this add-on, such as \"any unit in this building\" (by category) or specific unit IDs.<\/li><li><code>maxPerAnchor<\/code>: the most of this add-on one anchor can carry, such as 2 parking spaces per apartment.<\/li><li>The anchor can be in the <strong>same cart<\/strong> or be an <strong>existing booking<\/strong> of the same renter that covers the whole add-on period. A tenant who signed a lease in March can add a second parking spot in June.<\/li><li>The add-on can't outlast the anchor. If the lease ends, the add-on has to end with it.<\/li><\/ul>\n<p><strong>Packages<\/strong> are bundles defined by the host, like \"Unit 1A + 2 parking\" at $2,650/mo fixed or \"Any unit + locker\" at 10% off. A package is listed as one item in search results. When booked, it becomes the underlying spaces, so availability and conflicts are still checked for each space.<\/p>\n<p>That gives a renter these choices:<\/p>\n<ol><li>Apartment only.<\/li><li>Apartment plus 1 or 2 parking spaces (add-ons, capped at 2).<\/li><li>A package, such as Apartment 1A plus 2 parking at a fixed price.<\/li><li>Later, add a locker to their existing lease.<\/li><li>A non-tenant can rent a locker alone at the standalone price, but cannot rent parking, which is add-on only.<\/li><\/ol>\n<p>The same model works for a single house. For example, an owner can rent the ADU and offer the driveway spot only to whoever rents the ADU.<\/p>\n<hr>\n<h2 id=\"4-trust-safety-and-legal\">4. Trust, safety, and legal<\/h2>\n<ul><li><strong>Host checklist per category<\/strong> must be complete before a listing goes live: permits, HOA approval, insurance, and safety items such as smoke/CO detectors, pool fencing, NFPA 855, and roof assessment.<\/li><li><strong>Identity verification<\/strong> is required for both sides. Leases and infrastructure agreements also need a business or credit check.<\/li><li><strong>Agreements.<\/strong> Short rentals use platform terms of service. Leases use a state-specific lease template. Infrastructure uses a recorded lease or easement with removal, insurance, and indemnity clauses.<\/li><li><strong>Insurance.<\/strong> A host protection policy for short rentals. Infrastructure partners must name the owner as additional insured.<\/li><li><strong>Reviews<\/strong> in both directions, plus disputes backed by the check-in/out photos.<\/li><li><strong>Local rules engine (later).<\/strong> Look up the address to see short-term-rental caps, parking ordinances, and garden and front-yard rules, then turn off terms that aren't allowed.<\/li><\/ul>\n<hr>\n<h2 id=\"5-build-plan\">5. Build plan<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Phase<\/th><th>Scope<\/th><\/tr><\/thead><tbody><tr><td><strong>0: rules prototype (done)<\/strong><\/td><td>Catalog, data model, availability with quantity, hierarchy, and conflicts, add-on and package rules, pricing with event rates, booking modes and states, JSON API, tests<\/td><\/tr><tr><td><strong>0.5: app prototype (done)<\/strong><\/td><td>Installable mobile-first app. Renters: explore with map, events and bundles, listing pages with availability calendar and reviews, checkout for every rental length, trips with access details, messaging, reviews. Hosts: today dashboard, approve or decline in chat, listings tree, earnings by month, step-by-step listing wizard with the required checklist. Works offline as a single HTML file.<\/td><\/tr><tr><td><strong>0.75: two sides + polish (done)<\/strong><\/td><td>Everyspace for Business (Sites, Pipeline, landing page, business-only rule), new categories (kitchen, sport court, boat dock, pasture, fleet parking, signage, parcel lockers), earnings estimator, Saved, guest favorites, ideas row, desktop listing layout with a booking card and gallery, refreshed visual design.<\/td><\/tr><tr><td><strong>0.9: transparency + owner tools (done)<\/strong><\/td><td>All-in prices everywhere, money breakdown, price check against owners' cross-listings, How pricing works page; Manage listing (pause, prices with nearby ranges and payout preview, block dates, cross-listings, \"cheaper elsewhere\" warning). Open research in RESEARCH.md.<\/td><\/tr><tr><td><strong>0.95: owner tools (done)<\/strong><\/td><td>\"Everyspace earns\" on every quote and receipt; owner take-home comparison with one-tap \"same take-home\" price; instant-book toggle; earnings CSV; chat quick replies.<\/td><\/tr><tr><td>1: MVP<\/td><td>Real auth, Postgres, Stripe Connect payouts, photo uploads, map search, messaging, notifications<\/td><\/tr><tr><td>2: Trust<\/td><td>ID verification, reviews, check-in/out photo log, disputes, insurance partner<\/td><\/tr><tr><td>3: Long-term<\/td><td>Lease templates and e-sign, autopay, move-in/out, maintenance requests<\/td><\/tr><tr><td>4: Infrastructure marketplace<\/td><td>Solar, battery, and charger partner portal, roof and site assessment scheduling, rent from commissioning, revenue share<\/td><\/tr><tr><td>5: Local rules engine<\/td><td>Permit and ordinance lookup by address, automatic term limits<\/td><\/tr><\/tbody><\/table><\/div>";

window.everyspaceApi = async (path, body) => {

// Confetti Particle Explosion
function triggerConfetti() {
  playSound('success');
  const canvas = $('#confetti-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#10b981', '#f59e0b', '#3b82f6', '#ec4899', '#8b5cf6', '#ef4444', '#14b8a6'];
  const particles = Array.from({ length: 90 }, () => ({
    x: canvas.width / 2,
    y: canvas.height * 0.45,
    w: Math.random() * 8 + 6,
    h: Math.random() * 6 + 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - 0.5) * 16,
    vy: (Math.random() - 0.7) * 18,
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 12,
    alpha: 1,
  }));

  let frame;
  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.42; // gravity
      p.vx *= 0.98; // air drag
      p.rot += p.vrot;
      p.alpha -= 0.012;
      if (p.alpha > 0) {
        alive = true;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
    }
    if (alive) frame = requestAnimationFrame(update);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  update();
}

// Download .ics Calendar Invite
function downloadICS(booking) {
  const icsText = (v) => String(v ?? '').replace(/\\/g, '\\\\').replace(/[,;]/g, (m) => `\\${m}`).replace(/\r?\n/g, '\\n');
  const sDate = (booking.start || '').replace(/[-:]/g, '').slice(0, 8);
  const eDate = (booking.end || '').replace(/[-:]/g, '').slice(0, 8);
  const icsData = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Everyspace//Booking Confirmation//EN',
    'BEGIN:VEVENT',
    `UID:bk_${booking.id}@everyspace.local`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    ...(booking.term === 'hourly' || (booking.start || '').length > 10
      ? [`DTSTART:${new Date(booking.start).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '')}`, `DTEND:${new Date(booking.end).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '')}`]
      : [`DTSTART;VALUE=DATE:${sDate}`, `DTEND;VALUE=DATE:${eDate}`]),
    `SUMMARY:${icsText(`Everyspace: ${booking.itemsLabel || 'Space rental'}`)}`,
    `DESCRIPTION:${icsText(`Your booking${booking.property?.title ? ` at ${booking.property.title}` : ''}.${booking.hostName ? ` Host: ${booking.hostName}.` : ''} Access details are in your trip pass.`)}`,
    ...(booking.property?.title ? [`LOCATION:${icsText(`${booking.property.title}${booking.property.city ? `, ${booking.property.city}` : ''}`)}`] : []),
    'STATUS:CONFIRMED',
    'END:VEVENT',
    'END:VCALENDAR',
  ].join('\r\n');

  const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `everyspace-${booking.id}.ics`;
  document.body.append(a); a.click(); a.remove();
  toast('Calendar event (.ics) downloaded 📅');
}

(() => {
// Enhanced month calendar showing free units per day with range picking, sounds, and night count.
const { $$, api, today, playSound } = __m['core'];

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

// spaceIds: for a bundle, a day is only as free as its busiest space.
function calendarPicker(el, { spaceId, spaceIds, mode = 'view', start = '', end = '', onChange = () => {} }) {
  const ids = spaceIds?.length ? spaceIds : [spaceId];
  let anchor = (start || today()).slice(0, 7); // YYYY-MM shown first
  let sel = { start: start.slice(0, 10), end: end.slice(0, 10) };

  async function draw() {
    const first = `${anchor}-01`;
    let days = [];
    try {
      const all = await Promise.all(ids.map((id) => api(`spaces/${id}/calendar?from=${first}&days=62`)));
      days = all[0].map((d, i) => {
        const others = all.map((cal) => cal[i]).filter(Boolean);
        const worst = others.reduce((w, x) => ((x.free / (x.total || 1)) < (w.free / (w.total || 1)) ? x : w), d);
        return { ...worst, date: d.date };
      });
    } catch {
      days = [];
    }
    const byDate = Object.fromEntries(days.map((d) => [d.date, d]));
    const t = today();
    const month = (ym) => {
      const [y, m] = ym.split('-').map(Number);
      const lead = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
      const count = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const cells = Array(lead).fill('<span class="day-empty"></span>');
      for (let d = 1; d <= count; d++) {
        const date = `${ym}-${String(d).padStart(2, '0')}`;
        const info = byDate[date];
        const past = date < t;
        const full = info && info.free === 0 && !info.gap;
        const partial = info && ((info.free > 0 && info.free < info.total) || (info.free === 0 && info.gap));
        const isStart = date === sel.start;
        const isEnd = date === sel.end;
        const inRange = sel.start && sel.end && date > sel.start && date < sel.end;
        const cls = [
          past && 'past',
          full && 'full',
          partial && 'partial',
          (isStart || isEnd) && 'sel',
          isStart && 'range-start',
          isEnd && 'range-end',
          inRange && 'range'
        ].filter(Boolean).join(' ');
        cells.push(`<button type="button" class="day ${cls}" data-date="${date}" ${past || mode === 'view' ? 'disabled' : ''}
          title="${info ? (info.gap ? `Booked, but open ${info.gap} for short bookings (cleaning gap)` : `${info.free} of ${info.total} free`) : ''}">${d}</button>`);
      }
      return `<div class="cal-month"><div class="cal-title">${MONTHS[m - 1]} ${y}</div>
        <div class="cal-grid">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((x) => `<span class="dow">${x}</span>`).join('')}${cells.join('')}</div></div>`;
    };
    const next = nextMonth(anchor);
    const rangeInfo = sel.start && sel.end
      ? `<span class="cal-stay-tag">🌙 ${nights(sel.start, sel.end)} night${nights(sel.start, sel.end) === 1 ? '' : 's'}</span>`
      : sel.start
        ? `<span class="cal-stay-tag muted">Select checkout</span>`
        : '';
    el.innerHTML = `<div class="cal">
      <div class="cal-header-row">
        <div class="cal-nav">
          <button type="button" class="icon-btn" data-nav="-1" ${anchor <= t.slice(0, 7) ? 'disabled' : ''} aria-label="Previous month">‹</button>
          <button type="button" class="icon-btn" data-nav="1" aria-label="Next month">›</button>
        </div>
        ${rangeInfo}
      </div>
      <div class="cal-months">${month(anchor)}${month(next)}</div>
      <div class="cal-legend">
        <span><i class="free"></i>Open</span>
        <span><i class="partial"></i>Some left or open part of the day</span>
        <span><i class="full"></i>Booked</span>
      </div>
    </div>`;
    for (const b of $$('[data-nav]', el)) {
      b.onclick = () => {
        playSound('click');
        anchor = b.dataset.nav === '1' ? next : prevMonth(anchor);
        draw();
      };
    }
    for (const b of $$('.day[data-date]', el)) {
      b.onclick = () => pick(b.dataset.date);
    }
  }

  function pick(date) {
    playSound('click');
    if (mode === 'single') {
      sel = { start: date, end: '' };
    } else if (!sel.start || sel.end || date <= sel.start) {
      sel = { start: date, end: '' };
    } else {
      sel = { start: sel.start, end: date };
    }
    onChange({ ...sel });
    draw();
  }

  draw();
  return { set(s, e) { sel = { start: s, end: e }; draw(); } };
}

function nextMonth(ym) { const [y, m] = ym.split('-').map(Number); return m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`; }
function prevMonth(ym) { const [y, m] = ym.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`; }
const nights = (s, e) => Math.max(1, Math.round((Date.parse(e) - Date.parse(s)) / 864e5));

__m['calendar'] = { calendarPicker, nights };
})();

  // A plan narrows results to spaces that actually suit it (e.g. driveways with day rates for vacation car storage).
  const plan = f.plan && IDEAS.find((p) => p.key === f.plan);
  if (plan?.fits) spaces = spaces.filter(plan.fits);

  if (state.view === 'map') {
    renderMap(body, spaces, spaceCard, { full: true });
    return;
  }

  if (state.view === 'split') {
    renderSplitView(body, spaces, filtered);
    return;
  }

  // Standard Grid view
  const sections = [];
  if (!filtered) {
    sections.push(`<div class="ideas">${IDEAS.map((i, n) => `<button class="idea tone-${i.tone}" data-idea="${n}"><span>${i.emoji}</span>${esc(i.label)}</button>`).join('')}</div>`);
    sections.push(eventsSection(spaces));
    const loved = spaces.filter((s) => isFavorite(s.rating)).sort((a, b) => b.rating.avg - a.rating.avg || b.rating.count - a.rating.count);
    if (loved.length) sections.push(`<h2 class="section-title">Guest favorites <span class="badge ok">Top 5% verified</span></h2><div class="hscroll">${loved.map(spaceCard).join('')}</div>`);
  }
  const visiblePkgs = packages.filter(() => !f.category && (!f.group || f.group === 'living' || f.group === 'parking'));
  if (visiblePkgs.length) sections.push(`<h2 class="section-title">Bundles <span class="muted small">A place + parking or storage, combined discount</span></h2><div class="hscroll">${visiblePkgs.map(packageCard).join('')}</div>`);
  if (!filtered) {
    sections.push(`<a class="host-cta" href="#/earn"><div><strong>Your driveway could pay your phone bill.</strong>
      <span>See what your parking, garage, yard or spare room could earn.</span></div><span class="cta-btn">Estimate</span></a>`);
  }
  if (plan) sections.push(`<div class="plan-banner"><span class="plan-emoji">${plan.emoji}</span><div><strong>${esc(plan.label)}</strong>
      <span class="muted small">${esc(plan.blurb ?? 'Showing spaces that suit this plan.')}${plan.askDates && !f.start ? ' Add your dates to see what is free.' : ''}</span></div>
      ${plan.askDates ? `<button class="btn small ghost" data-plan-dates>${icon.calendar} ${f.start ? 'Change dates' : 'Add dates'}</button>` : ''}<button class="icon-btn" data-plan-clear aria-label="Clear plan">${icon.close}</button></div>`);
  sections.push(`<h2 class="section-title">${filtered ? `${spaces.length} space${spaces.length === 1 ? '' : 's'} found` : 'Everything nearby'}</h2>
    ${spaces.length ? `<div class="grid">${spaces.map(spaceCard).join('')}</div>` : '<div class="empty"><div class="empty-icon">🔍</div>Nothing matches. Try adjusting your filters or price range.</div>'}`);
  if (!filtered) {
    sections.push(`<a class="biz-footer" href="#/biz"><span class="biz-badge">${icon.briefcase}</span><div><strong>Everyspace for Business</strong>
      <span>Solar installers, charging networks, telecoms and fleets lease roofs, lots and walls on our business side.</span></div>${icon.chevron}</a>`);
  }
  body.innerHTML = sections.join('');
  const pd = $('[data-plan-dates]', body); if (pd) pd.onclick = () => datesSheet(() => renderExplore($('#view')));
  const pc = $('[data-plan-clear]', body); if (pc) pc.onclick = () => { playSound('click'); Object.keys(f).forEach((k) => { f[k] = ''; }); renderExplore($('#view')); };
  for (const b of $$('[data-idea]', body)) b.onclick = () => {
    playSound('click');
    Object.keys(f).forEach((k) => { f[k] = ''; });
    const plan = IDEAS[+b.dataset.idea];
    Object.assign(f, plan.set);
    f.plan = plan.key;
    renderExplore(view ?? $('#view'));
    if (plan.askDates) setTimeout(() => datesSheet(() => renderExplore(view ?? $('#view'))), 150);
  };
}

function renderSplitView(body, spaces, filtered) {
  body.innerHTML = `
    <div class="split-container">
      <div class="split-cards">
        <div class="split-header">
          <strong>${spaces.length} space${spaces.length === 1 ? '' : 's'}</strong>
          <span class="muted small">Hover card to see location</span>
        </div>
        ${spaces.length ? `<div class="grid split-grid">${spaces.map(spaceCard).join('')}</div>` : '<div class="empty"><div class="empty-icon">🔍</div>No spaces found</div>'}
      </div>
      <div class="split-map-pane" id="split-map-mount"></div>
    </div>
  `;
  const mount = $('#split-map-mount');
  if (mount) {
    renderMap(mount, spaces, spaceCard, { split: true });
  }
}

// Long-term rentals: months and leases, browsed on their own with move-in dates, length and budget.
async function renderLongTerm(view, _params, query) {
  const lt = state.lt ??= { type: '', moveIn: '', months: 3, lease: 'any', max: '', pets: false, sort: 'price_asc', q: '' };
  if (query?.has('type')) lt.type = LT_TYPES.some(([k]) => k === query.get('type')) ? query.get('type') : '';
  const type = LT_TYPES.find(([k]) => k === lt.type) ?? LT_TYPES[0];
  const stays = ['homes', 'rooms'].includes(lt.type);
  view.innerHTML = `${topbar('Long-term rentals', { back: true })}
    <div class="page">
      <div class="lt-head">
        <h1 class="page-title">${type[2]} ${lt.type ? esc(type[1]) : 'Long-term rentals'}</h1>
        <p class="muted">Month-to-month and fixed leases. Pick a move-in date and how long you need it; prices are per month with fees included.</p>
      </div>
      <div class="chips scroll lt-types" id="lt-types">${LT_TYPES.map(([k, label, emoji]) => `<button class="chip small ${lt.type === k ? 'on' : ''}" data-type="${k}">${emoji} ${esc(label)}</button>`).join('')}</div>
      <div class="lt-filters card pad">
        <label>Move in<input type="date" id="lt-move" value="${esc(lt.moveIn)}" min="${today()}"></label>
        <label>For<select id="lt-months">${[1, 2, 3, 6, 9, 12, 18, 24].map((m) => `<option value="${m}" ${lt.months === m ? 'selected' : ''}>${m} month${m === 1 ? '' : 's'}</option>`).join('')}</select></label>
        <label>Type<select id="lt-lease"><option value="any" ${lt.lease === 'any' ? 'selected' : ''}>Any</option><option value="monthly" ${lt.lease === 'monthly' ? 'selected' : ''}>Month-to-month</option><option value="lease" ${lt.lease === 'lease' ? 'selected' : ''}>Fixed lease (6–24 mo)</option></select></label>
        <label>Up to<span class="money-input">$<input type="number" id="lt-max" min="0" value="${esc(lt.max)}" placeholder="any"><span>/mo</span></span></label>
        <label>Sort<select id="lt-sort">${[['price_asc', 'Price: low to high'], ['price_desc', 'Price: high to low'], ['rating', 'Top rated'], ['newest', 'Newest']].map(([v, l]) => `<option value="${v}" ${lt.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        ${stays ? `<label class="check-line"><input type="checkbox" id="lt-pets" ${lt.pets ? 'checked' : ''}> Pets allowed</label>` : ''}
      </div>
      ${lt.lease === 'lease' && lt.months < 6 ? '<p class="notice warn small">Fixed leases run 6 to 24 months. Showing spaces with a lease price; choose 6+ months to check availability.</p>' : ''}
      <div id="lt-results"><div class="skeleton-grid">${'<div class="skeleton"></div>'.repeat(4)}</div></div>
      <p class="muted small fine">Looking for a few hours, nights or weeks? <a class="link-text" href="#/explore">Browse short-term spaces</a></p>
    </div>`;
  bindBack(view);
  const reload = () => renderLongTerm(view, _params, new URLSearchParams());
  $('#lt-types', view).onclick = (e) => { const b = e.target.closest('[data-type]'); if (!b) return; playSound('tab'); lt.type = b.dataset.type; history.replaceState(null, '', `#/long-term${lt.type ? `?type=${lt.type}` : ''}`); reload(); };
  $('#lt-move', view).onchange = (e) => { lt.moveIn = e.target.value; reload(); };
  $('#lt-months', view).onchange = (e) => { lt.months = Number(e.target.value); reload(); };
  $('#lt-lease', view).onchange = (e) => { lt.lease = e.target.value; reload(); };
  $('#lt-max', view).oninput = debounce((e) => { lt.max = e.target.value; loadLong(); }, 300);
  $('#lt-sort', view).onchange = (e) => { lt.sort = e.target.value; loadLong(); };
  if ($('#lt-pets', view)) $('#lt-pets', view).onchange = (e) => { lt.pets = e.target.checked; loadLong(); };

  async function loadLong() {
    const params = new URLSearchParams({ userId: state.user, horizon: 'long', sort: lt.sort });
    if (type[3]) params.set('categories', type[3].join(','));
    if (lt.lease !== 'any') params.set('term', lt.lease);
    if (lt.max) params.set('maxMonthly', lt.max);
    if (lt.pets && stays) params.set('features', 'pets');
    const canCheck = lt.moveIn && !(lt.lease === 'lease' && lt.months < 6);
    const end = lt.moveIn ? addMonths(lt.moveIn, lt.months) : '';
    if (canCheck) { params.set('start', lt.moveIn); params.set('end', end); params.set('availableOnly', 'true'); }
    const { spaces } = await api(`search?${params}`);
    const el = $('#lt-results', view);
    if (!el) return;
    const NOUN = { homes: ['home or apartment', 'homes & apartments'], rooms: ['room', 'rooms'], parking: ['parking space', 'parking spaces'], storage: ['storage space', 'storage spaces'],
      rv: ['RV, boat or trailer spot', 'RV, boat & trailer spots'], docks: ['boat slip', 'boat slips'], land: ['garden or land listing', 'gardens & land'], work: ['workshop or kitchen', 'workshops & kitchens'] };
    const noun = (NOUN[lt.type] ?? ['long-term rental', 'long-term rentals'])[spaces.length === 1 ? 0 : 1];
    el.innerHTML = `<h2 class="section-title">${spaces.length} ${noun}${canCheck ? ` free from ${fmtDate(lt.moveIn, { year: true })} to ${fmtDate(end, { year: true })}` : ''}</h2>
      ${spaces.length ? `<div class="grid lt-grid">${spaces.map((sp) => longCard(sp, canCheck ? lt.months : null)).join('')}</div>`
        : `<div class="empty"><div class="empty-icon">🗓️</div>Nothing matches yet. Try a later move-in date, a higher budget or another type.</div>`}`;
    for (const a of $$('[data-lt]', el)) a.onclick = () => {
      const sp = spaces.find((x) => x.id === a.dataset.lt);
      const t = lt.lease !== 'any' ? lt.lease : sp.rates?.monthly != null ? 'monthly' : 'lease';
      state.bookPrefill = { spaceId: sp.id, term: t, start: lt.moveIn || '', months: lt.months };
    };
  }
  await loadLong();
}

function longCard(s, months) {
  const c = state.catalog.categories[s.category];
  const allIn = s.allIn;
  const lease = s.rates?.lease;
  const feats = (s.features ?? []).map((f) => c.features?.find((x) => x.key === f)?.label).filter(Boolean).slice(0, 3);
  return `<a class="card space-card lt-card" href="#/space/${s.id}" data-lt="${s.id}">
    <div class="thumb">${art(s)}${saveBtn(s.id, s.saved)}<span class="thumb-chip category-chip">${s.icon} ${esc(s.categoryLabel)}</span></div>
    <div class="card-body">
      <div class="row-between"><strong class="title">${esc(s.title)}</strong>${stars(s.rating)}</div>
      <div class="muted small card-meta">${esc(s.property.title)} · ${esc(s.property.city)} ${ownerChip(s.property.ownerType, { short: true })}</div>
      <div class="price">${money(allIn)}<span>/month all-in</span></div>
      ${lease != null && s.fromPrice?.term === 'monthly' ? `<div class="small muted">Lease (6–24 mo): ${money(Math.round(lease * 1.1 * 100) / 100)}/month</div>` : s.fromPrice?.term === 'lease' ? '<div class="small muted">Fixed lease, 6–24 months</div>' : ''}
      ${months ? `<div class="small"><strong>≈ ${money(Math.round(allIn * months))}</strong> for ${months} month${months === 1 ? '' : 's'} · <span class="avail ok">${(s.quantity ?? 1) > 1 ? `${s.unitsFree} of ${s.quantity} free` : 'Available'}</span></div>` : ''}
      ${feats.length ? `<div class="badges">${feats.map((x) => `<span class="badge">${esc(x)}</span>`).join('')}</div>` : ''}
    </div></a>`;
}

function spaceCard(s) {
  const r = cheapestRate(s);
  const datesSet = state.filters.start && state.filters.end;
  const fav = isFavorite(s.rating);
  const badges = [
    s.policy === 'addon' ? '<span class="badge warn">Add-on only</span>' : '',
    s.policy === 'both' ? '<span class="badge">Tenant discount</span>' : '',
    datesSet && s.unitsFree === 0 ? '<span class="badge bad">Booked</span>' : '',
    datesSet && s.unitsFree > 0 && (s.quantity ?? 1) > 1 ? `<span class="badge ok">${s.unitsFree} left</span>` : '',
    s.eventRates?.some((e) => e.end >= today()) ? '<span class="badge event">Event pricing</span>' : '',
  ].join('');
  return `<a class="card space-card" href="#/space/${s.id}" data-space-id="${s.id}">
    <div class="thumb">
      ${art(s)}
      ${fav ? '<span class="fav-tag">★ Guest favorite</span>' : ''}
      ${saveBtn(s.id, s.saved)}
      <span class="thumb-chip category-chip">${s.icon} ${esc(s.categoryLabel)}</span>
    </div>
    <div class="card-body">
      <div class="row-between">
        <strong class="title">${esc(s.title)}</strong>
        ${stars(s.rating)}
      </div>
      <div class="muted small card-meta">${esc(s.property.title)} · ${esc(s.property.city)} ${ownerChip(s.property.ownerType, { short: true })}</div>
      <div class="price-row">
        ${r ? `<div class="price">from ${priceTag({ ...r, amount: s.allIn ?? r.amount })} <span class="all-in" title="${FEES.s} service fee already included in this price">all-in</span></div>` : ''}
      </div>
      ${s.compare?.cheaperHere && s.compare.theirs - s.compare.ours >= 0.5 ? `<div class="cmp-line ok">✓ ${money(s.compare.theirs - s.compare.ours)} less than on ${esc(s.compare.vs)}</div>` : ''}
      ${badges ? `<div class="badges">${badges}</div>` : ''}
    </div></a>`;
}

function packageCard(p) {
  const price = p.pricing.type === 'fixed'
    ? `${money(p.pricing.rates.monthly ?? Object.values(p.pricing.rates)[0])}<span>/month</span>` : `<span>Save ${p.pricing.percent}%</span>`;
  return `<a class="card pkg-card" href="#/book/pkg/${p.id}">
    <div class="pkg-art n${Math.min(3, p.items.length)}">${p.items.slice(0, 3).map((i) => `<div>${art({ id: i.spaceId, category: i.category })}</div>`).join('')}</div>
    <div class="card-body"><span class="badge event">Bundle</span><strong class="title">${esc(p.name)}</strong>
    <div class="muted small">${esc(p.property.title)}</div><div class="price">${price}</div></div></a>`;
}

function eventsSection(spaces) {
  const events = new Map();
  for (const s of spaces) for (const e of s.eventRates ?? []) {
    if (e.end < today()) continue;
    const key = `${e.name}|${e.start}`;
    if (!events.has(key)) events.set(key, { ...e, spaces: [] });
    events.get(key).spaces.push(s);
  }
  const list = [...events.values()].sort((a, b) => (a.start < b.start ? -1 : 1)).slice(0, 4);
  if (!list.length) return '';
  return `<h2 class="section-title">Coming up nearby</h2><div class="hscroll">${list.map((e) => `<a class="card event-card" href="#/space/${e.spaces[0].id}">
      <div class="event-date"><span>${fmtDate(e.start).split(' ')[0]}</span><b>${e.start.slice(8)}${e.end !== e.start ? `–${e.end.slice(8)}` : ''}</b></div>
      <div><strong>${esc(e.name)}</strong><div class="muted small">${e.spaces.map((s) => esc(s.title)).join(' · ')}</div>
      <div class="small event-text">${e.daily ? `${money(e.daily)}/day` : ''}${e.daily && e.hourly ? ' · ' : ''}${e.hourly ? `${money(e.hourly)}/hr` : ''}</div></div></a>`).join('')}</div>`;
}

// ---------- Enhanced Interactive Vector Map ----------
function renderMap(body, spaces, card = spaceCard, options = {}) {
  const byProp = new Map();
  for (const s of spaces) {
    if (!byProp.has(s.property.id)) byProp.set(s.property.id, { prop: s.property, spaces: [] });
    byProp.get(s.property.id).spaces.push(s);
  }
  const pts = [...byProp.values()];
  if (!pts.length) {
    body.innerHTML = '<div class="empty"><div class="empty-icon">🗺️</div>Nothing to show on the map.</div>';
    return;
  }
  const lats = pts.map((p) => p.prop.lat), lngs = pts.map((p) => p.prop.lng);
  const pad = 0.008;
  const [minLat, maxLat] = [Math.min(...lats) - pad, Math.max(...lats) + pad];
  const [minLng, maxLng] = [Math.min(...lngs) - pad, Math.max(...lngs) + pad];
  const W = 600, H = 550;
  const x = (lng) => ((lng - minLng) / (maxLng - minLng || 1)) * W;
  const y = (lat) => H - ((lat - minLat) / (maxLat - minLat || 1)) * H;

  const streets = [];
  for (let i = 0; i < 11; i++) streets.push(`<path d="M0 ${30 + i * 50} L${W} ${15 + i * 52}" class="street ${i % 3 === 1 ? 'major' : ''}"/>`);
  for (let i = 0; i < 10; i++) streets.push(`<path d="M${25 + i * 58} 0 L${45 + i * 56} ${H}" class="street ${i % 3 === 2 ? 'major' : ''}"/>`);

  const label = (p) => {
    const rates = p.spaces.map(cheapestRate).filter(Boolean).sort((a, b) => a.amount - b.amount);
    return rates[0] ? money(rates[0].amount) : '—';
  };

  body.innerHTML = `
    <div class="map-wrap ${options.split ? 'split-map' : 'full-map'}">
      <div class="map-controls">
        <button class="map-ctrl-btn" id="map-zoom-in" title="Zoom in">+</button>
        <button class="map-ctrl-btn" id="map-zoom-out" title="Zoom out">−</button>
        <button class="map-ctrl-btn" id="map-center" title="Center map">⌖</button>
      </div>
      <svg class="map" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" id="map-svg">
        <defs>
          <filter id="pin-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.25"/>
          </filter>
        </defs>
        <rect width="${W}" height="${H}" class="land"/>
        <path d="M-20 420 Q180 370 300 440 T620 400 V560 H-20 Z" class="water"/>
        <rect x="360" y="80" width="130" height="90" rx="16" class="park"/>
        <rect x="60" y="240" width="110" height="80" rx="14" class="park"/>
        ${streets.join('')}
        <text x="420" y="130" class="map-label">City Park & Fair</text>
        <text x="90" y="285" class="map-label">Riverside Commons</text>
        <text x="210" y="490" class="map-label">Riverfront Promenade</text>
        ${pts.map((p, i) => `<g class="pin" data-pin="${i}" transform="translate(${x(p.prop.lng)} ${y(p.prop.lat)})" tabindex="0" role="button" aria-label="${esc(p.prop.title)}" filter="url(#pin-shadow)">
            <rect x="-34" y="-38" width="68" height="28" rx="14"/>
            <text y="-20">${label(p)}</text>
            <path d="M-6 -10 L0 -2 L6 -10 Z"/>
            ${p.spaces.length > 1 ? `<circle class="pin-count" cx="30" cy="-36" r="10"/><text class="pin-count-text" x="30" y="-32">${p.spaces.length}</text>` : ''}
          </g>`).join('')}
      </svg>
      <div class="map-panel" id="map-panel">
        <div class="muted">Tap any price pin to view available spaces.</div>
      </div>
    </div>`;

  const show = (i) => {
    const p = pts[i];
    playSound('click');
    for (const g of $$('.pin', body)) g.classList.toggle('on', g.dataset.pin === String(i));
    $('#map-panel').innerHTML = `
      <div class="map-panel-header">
        <div>
          <strong>${esc(p.prop.title)}</strong>
          <span class="muted small block">${p.spaces.length} space${p.spaces.length > 1 ? 's' : ''} at this property</span>
        </div>
        <button class="icon-btn mini" id="close-map-panel">✕</button>
      </div>
      <div class="hscroll map-hscroll">${p.spaces.map(card).join('')}</div>`;
    $('#close-map-panel').onclick = () => {
      $('#map-panel').innerHTML = '<div class="muted">Tap any price pin to view spaces.</div>';
      for (const g of $$('.pin', body)) g.classList.remove('on');
    };
  };

  for (const g of $$('.pin', body)) {
    g.onclick = () => show(+g.dataset.pin);
    g.onkeydown = (e) => { if (e.key === 'Enter') show(+g.dataset.pin); };
  }

  // Cross-hover sync between cards and pins in split view
  if (options.split) {
    const cardElements = $$('.split-cards .space-card');
    for (const el of cardElements) {
      const spaceId = el.dataset.spaceId;
      el.addEventListener('mouseenter', () => {
        const pinIdx = pts.findIndex((p) => p.spaces.some((s) => s.id === spaceId));
        if (pinIdx !== -1) {
          const pin = $(`[data-pin="${pinIdx}"]`, body);
          if (pin) pin.classList.add('hover-pulse');
        }
      });
      el.addEventListener('mouseleave', () => {
        for (const pin of $$('.pin', body)) pin.classList.remove('hover-pulse');
      });
    }
  }

  // Map controls
  let zoomLevel = 1;
  const svg = $('#map-svg', body);
  $('#map-zoom-in').onclick = () => {
    playSound('click');
    zoomLevel = Math.min(2.0, zoomLevel + 0.2);
    if (svg) svg.style.transform = `scale(${zoomLevel})`;
  };
  $('#map-zoom-out').onclick = () => {
    playSound('click');
    zoomLevel = Math.max(0.8, zoomLevel - 0.2);
    if (svg) svg.style.transform = `scale(${zoomLevel})`;
  };
  $('#map-center').onclick = () => {
    playSound('click');
    zoomLevel = 1;
    if (svg) svg.style.transform = 'scale(1)';
    show(0);
  };

  if (!options.split && pts.length > 0) show(0);
}

// ---------- Filter sheets ----------
function datesSheet(done) {
  const f = state.filters;
  const body = openSheet(`<div class="form">
      <div class="two">
        <label>Check-in date<input type="date" id="s-start" value="${f.start}" min="${today()}"></label>
        <label>Checkout date<input type="date" id="s-end" value="${f.end}" min="${today()}"></label>
      </div>
      <div class="quick chips">
        ${[['Tonight', 0, 1], ['This weekend', null, null], ['Next 7 days', 0, 7], ['Next month', 0, 30]].map(([l, a, b]) => `<button class="chip small" data-q="${l}" data-a="${a}" data-b="${b}">${l}</button>`).join('')}
      </div>
      <div class="sheet-actions">
        <button class="btn ghost" id="s-clear">Any dates</button>
        <button class="btn" id="s-apply">Apply dates</button>
      </div>
    </div>`, { title: 'When?' });

  const iso = (ms) => new Date(ms).toISOString().slice(0, 10);
  for (const b of $$('[data-q]', body)) b.onclick = () => {
    playSound('click');
    const t = Date.parse(`${today()}T00:00:00Z`);
    if (b.dataset.q === 'This weekend') {
      const toSat = (6 - new Date(t).getUTCDay() + 7) % 7;
      $('#s-start').value = iso(t + toSat * 864e5);
      $('#s-end').value = iso(t + (toSat + 2) * 864e5);
    } else {
      $('#s-start').value = iso(t + b.dataset.a * 864e5);

            <span class="muted small">${p.pricing.type === 'fixed' ? Object.entries(p.pricing.rates).map(([t, v]) => `${money(v)}/${term(t).unit} ${t === 'lease' ? 'lease' : ''}`).join(' · ') : `${p.pricing.percent}% off together`}</span></button>`).join('')}

        <div id="addons">${space.addons.map((a) => `<div class="list-row">${art(a, { className: 'art mini' })}<div><strong>${esc(a.title)}</strong>

    for (const x of $$('#choices [data-choice]', view)) x.classList.toggle('on', x === btn);
    $('#addons').hidden = b.choice !== 'solo';
    refresh();
  };

  bindSteppers(view.querySelector('.page'), (name, v) => {
    if (name === 'qty') b.qty = v;

      q$.innerHTML = `${q.lines.map((l) => `<div class="qline"><div>${l.qty > 1 ? `${l.qty} × ` : ''}${esc(l.title)}${l.asAddon ? ' <span class="badge ok">tenant price</span>' : ''}

        ${q.packageDiscount ? `<div class="qline ok"><span>Bundle discount</span><span>−${money(q.packageDiscount)}</span></div>` : ''}

        ${q.comparison ? `<div class="compare mini"><div class="muted small">Same space elsewhere, same ${q.comparison.basis === 'total' ? 'dates, total' : q.comparison.basis.replace('per ', 'price per ')} incl. their fees (estimate):</div>

          <div class="compare-row ours"><span><strong>You pay here</strong></span><strong>${money(q.schedule.recurring && q.comparison.basis !== 'total' ? q.schedule.recurring : q.total)}</strong></div></div>` : ''}
        ${q.availability.ok ? '<div class="avail ok">✓ Available for your requested dates</div>' : `<div class="error">Not available for these dates<ul>${q.availability.conflicts.map((c) => `<li>${esc(c.reason)}</li>`).join('')}</ul></div>`}`;

      btn.disabled = !q.availability.ok;
      btn.textContent = BUTTON[q.mode];

      q$.innerHTML = errorBox(e);

      btn.disabled = true;
      btn.textContent = BUTTON[lastMode];

  const doCheckout = async () => {
    const btn = $('#confirm');

    try {
      const booking = await api('bookings', cart());
      playSound('success');
      triggerConfetti();
      success(view, booking, title);
    } catch (e) {
      $('#quote').insertAdjacentHTML('afterbegin', errorBox(e));
      btn.disabled = false;
    }
  };

  $('#confirm').onclick = doCheckout;
  $('#apple-pay-btn').onclick = doCheckout;

  drawWhen();
  refresh();
}

    const full = (await api(`bookings?userId=${state.user}`).catch(() => [])).find((x) => x.id === b.id);

async function renderChat(view, [bookingId]) {

    <div class="chat" id="chat">
      ${msgs.map((m) => bubble(m, b)).join('')}
      <div class="typing-indicator" id="typing-ind" hidden>
        <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        <em class="small muted">${esc(other?.name)} is typing…</em>
      </div>
    </div>
    <form class="composer" id="composer">
      <div class="quick-replies">${isHost ? '<button type="button" class="chip small tpl-chip" id="tpl-btn">📋 Templates</button>' : ''}${(isHost ? HOST_REPLIES : RENTER_REPLIES).map((r) => `<button type="button" class="chip small" data-reply="${esc(r)}">${esc(r)}</button>`).join('')}</div>
      <div class="composer-row">

        <button class="icon-btn send" aria-label="Send">${icon.send}</button>
      </div>
    </form>`;

  for (const q of $$('[data-reply]', view)) {
    q.onclick = () => {
      playSound('click');
      $('#text').value = q.dataset.reply;
      $('#text').focus();
    };
  }
  if ($('#tpl-btn')) $('#tpl-btn').onclick = async () => {
    const tpls = await api(`host/templates?hostId=${state.user}`);
    const body = openSheet(`<div class="tpl-pick">${tpls.map((t, i) => `<button class="option" data-tpl="${i}"><strong>${esc(t.name)}</strong><span class="muted small">${esc(fillTemplate(t.text, b, state.me.name).slice(0, 140))}…</span></button>`).join('')}
      <a class="link-text" href="#/host/team">Edit templates ${icon.chevron}</a></div>`, { title: 'Insert a template' });
    for (const x of $$('[data-tpl]', body)) x.onclick = () => { $('#text').value = fillTemplate(tpls[+x.dataset.tpl].text, b, state.me.name); closeSheet(); $('#text').focus(); };
    for (const a of $$('a', body)) a.onclick = () => closeSheet();
  };

  bindBack(view);
  const chat = $('#chat');
  chat.scrollTop = chat.scrollHeight;

  $('#composer').onsubmit = async (e) => {
    e.preventDefault();
    const text = $('#text').value.trim();
    if (!text) return;
    playSound('click');
    try {
      const m = await api(`bookings/${bookingId}/messages`, { from: state.user, text });
      $('#text').value = '';
      chat.insertAdjacentHTML('beforeend', bubble(m, b));

      // Simulate typing indicator & read receipt response after 1.5s
      setTimeout(() => {
        const ind = $('#typing-ind');
        if (ind) {
          ind.hidden = false;
          chat.scrollTop = chat.scrollHeight;
          setTimeout(() => {
            ind.hidden = true;
          }, 2000);
        }

    } catch (err) { toast(err.message); }
  };

  for (const btn of $$('[data-act]', view)) btn.onclick = async () => {
    playSound('click');
    if (btn.dataset.act === 'decline' && !confirm('Decline this request?')) return;
    try { await api(`bookings/${bookingId}/${btn.dataset.act}`, { actorId: state.user }); toast('Updated'); renderChat(view, [bookingId]); }
    catch (err) { chat.insertAdjacentHTML('beforeend', errorBox(err)); }
  };
}

}

// Fill a template for a booking.
function fillTemplate(text, b, hostName) {
  const access = (b.access ?? []).map((a) => `${a.title}: ${a.text}`).join(' ') || '[access details are shared once the booking is confirmed]';
  const dates = b.term === 'hourly' ? `${fmtDate(b.start)}, ${fmtTime(b.start)}–${fmtTime(b.end)}` : `${fmtDate(b.start)} to ${fmtDate(b.end)}`;
  return text.replace(/\{guest\}/g, b.renter?.name ?? 'there').replace(/\{listing\}/g, b.packageName ?? b.itemsLabel ?? 'the space')
    .replace(/\{dates\}/g, dates).replace(/\{access\}/g, access).replace(/\{host\}/g, hostName ?? '');
}

// ---------- Calendar: every listing, every site ----------
async function renderHostCalendar(view, _params, query) {
  const days = [14, 30, 60].includes(Number(query?.get('days'))) ? Number(query.get('days')) : 30;
  const from = /^\d{4}-\d{2}-\d{2}$/.test(query?.get('from') ?? '') ? addDays(query.get('from'), -2) : addDays(today(), -1);
  const onlyBooked = query?.get('only') === '1';
  const t = await api(`host/timeline?hostId=${state.user}&from=${from}&days=${days}`);
  const startMs = Date.parse(`${t.from}T00:00:00Z`);
  const span = t.days * 864e5;
  const pos = (v) => ((Date.parse(String(v).length === 10 ? `${v}T00:00:00Z` : v) - startMs) / span) * 100;
  const rows = onlyBooked ? t.rows.filter((r) => r.items.length) : t.rows;
  const used = [...new Set(t.rows.flatMap((r) => r.items.map((i) => i.platform)))];
  const dayList = Array.from({ length: t.days }, (_, i) => addDays(t.from, i));
  const nav = (f, d = days, only = onlyBooked) => `#/host/calendar?from=${addDays(f, 2)}&days=${d}${only ? '&only=1' : ''}`;
  const todayPct = pos(today());

  view.innerHTML = `${topbar('Calendar', { back: false, right: `<button class="icon-btn" id="add-xb" aria-label="Add a booking from another site">${icon.plus}</button>` })}
    <div class="page wide-page">
      <div class="cal-toolbar">
        <div class="btn-row">
          <a class="btn small ghost" href="${nav(addDays(t.from, -Math.round(days / 2)))}" aria-label="Earlier">${icon.back}</a>
          <a class="btn small ghost" href="${nav(addDays(today(), -1))}">Today</a>
          <a class="btn small ghost" href="${nav(addDays(t.from, Math.round(days / 2)))}" aria-label="Later"><span class="flip">${icon.back}</span></a>
          <strong class="cal-range">${fmtDate(t.from)} – ${fmtDate(addDays(t.to, -1), { year: true })}</strong>
        </div>
        <div class="btn-row">
          <div class="seg-links">${[14, 30, 60].map((d) => `<a class="${d === days ? 'on' : ''}" href="${nav(t.from, d)}">${d} days</a>`).join('')}</div>
          <a class="chip small ${onlyBooked ? 'on' : ''}" href="${nav(t.from, days, !onlyBooked)}">Only booked</a>
          <button class="btn small ghost" id="sync-all">↻ Sync all</button>
          <button class="btn small" id="add-xb-2">${icon.plus} Add booking</button>
        </div>
      </div>
      <div class="cal-legend chan-legend">${used.length ? used.map((k) => `<span>${chanDot(k)}${esc(chan(k).name)}</span>`).join('') : '<span class="muted">No bookings in this window.</span>'}<span><i class="chan-dot hatch"></i>Blocked</span></div>
      ${rows.length ? `<div class="tl-grid" style="--days:${t.days}">
        <div class="tl-row tl-head">
          <div class="tl-label"></div>
          <div class="tl-track">${dayList.map((d) => { const dt = new Date(`${d}T00:00:00Z`); const wk = [0, 6].includes(dt.getUTCDay());
            return `<span class="tl-day ${wk ? 'wkend' : ''} ${d === today() ? 'now' : ''}">${dt.getUTCDate() === 1 || d === t.from ? `<b>${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][dt.getUTCMonth()]}</b>` : ''}${'SMTWTFS'[dt.getUTCDay()]}<br>${dt.getUTCDate()}</span>`; }).join('')}</div>
        </div>
        ${rows.map((r) => `<div class="tl-row" data-space="${r.id}">
          <a class="tl-label" href="#/host/space/${r.id}" title="${esc(r.title)}"><strong>${esc(r.title)}</strong><span class="muted small">${r.quantity > 1 ? `${r.quantity} units · ` : ''}${LISTING_STATUS[r.status][0]}</span></a>
          <div class="tl-track" data-from="${t.from}">
            ${todayPct >= 0 && todayPct <= 100 ? `<i class="tl-now" style="left:${todayPct}%"></i>` : ''}
            ${r.items.map((x, i) => { const l = Math.max(0, pos(x.start)); const w = Math.max(0.9, Math.min(100, pos(x.end)) - l);
              return `<button class="tl-bar ${x.kind}" data-i="${i}" style="left:${l}%;width:${w}%;--c:${esc(chan(x.platform).color)}" title="${esc(`${chan(x.platform).name}: ${x.label}, ${fmtSpan(x)}`)}"><span>${esc(x.kind === 'block' ? (x.platform === 'owner' ? x.label : `${chan(x.platform).name} block`) : x.label)}</span></button>`; }).join('')}
          </div>
        </div>`).join('')}
      </div>` : `<div class="empty"><div class="empty-icon">📅</div>${t.rows.length ? 'No bookings in this window.' : 'No listings yet.'}<a class="btn" href="${t.rows.length ? nav(t.from, days, false) : '#/host/import'}">${t.rows.length ? 'Show all listings' : 'Import a listing'}</a></div>`}
      <p class="muted small fine">Tap an empty day to record a booking from another site. Everything here blocks the same dates on Everyspace and in your calendar feeds, so nothing gets double-booked.</p>
    </div>`;

  const refresh = () => renderHostCalendar(view, _params, query);
  const add = (o = {}) => openAddReservation({ ...o, done: refresh });
  $('#add-xb').onclick = () => add();
  $('#add-xb-2').onclick = () => add();
  $('#sync-all').onclick = async () => {
    playSound('click');
    const hub = await api(`host/hub?hostId=${state.user}`);
    const withFeeds = hub.listings.filter((l) => l.feeds);
    if (!withFeeds.length) { toast('No calendar feeds yet. Add one from a listing’s Manage page.'); return; }
    for (const l of withFeeds) await api(`spaces/${l.id}/sync`, { actorId: state.user });
    toast(`Synced ${withFeeds.length} calendar feed${withFeeds.length === 1 ? '' : 's'}`);
    refresh();
  };
  for (const tr of $$('.tl-row[data-space]', view)) {
    const r = t.rows.find((x) => x.id === tr.dataset.space);
    for (const b of $$('.tl-bar', tr)) b.onclick = (e) => { e.stopPropagation(); openItemSheet(r.items[+b.dataset.i], r, refresh); };
    $('.tl-track', tr).onclick = (e) => {
      const box = e.currentTarget.getBoundingClientRect();
      const d = addDays(t.from, Math.floor(((e.clientX - box.left) / box.width) * t.days));
      add({ spaceId: r.id, start: d, end: addDays(d, 1) });
    };
  }
  const tl = $('.tl-grid', view);
  if (tl && todayPct > 0) tl.scrollLeft = 0;
}

  const tree = (spaces) => {
    const out = [];
    const walk = (pid, d) => spaces.filter((s) => (s.parentId ?? null) === pid).forEach((s) => { out.push([s, d]); walk(s.id, d + 1); });

      </div>
      <a class="promise-strip" href="#/promise">🤝 <span><strong>List anywhere, manage here.</strong> No exclusivity, no ranking penalties, and managing is free. <u>Our host promise</u></span></a>
      ${props.length ? props.map((p) => `<section class="property">
        <div class="row-between">
          <div><h2>${esc(p.title)}</h2><div class="muted small card-meta">${ownerChip(p.ownerType)} ${esc(p.city)} · ${esc(([...state.catalog.propertyTypes.home, ...state.catalog.propertyTypes.business].find(([v]) => v === p.type) ?? [0, p.type.replace('_', ' ')])[1])}${p.hoa ? ' · HOA' : ''}</div></div>
          <a class="btn small ghost" href="#/host/new?property=${p.id}">${icon.plus} Add space</a>
        </div>
        ${tree(p.spaces).map(([s, d]) => {
          if (s.rentable === false) return `<div class="container-row" style="--d:${d}">🏗️ <strong>${esc(s.title)}</strong> <span class="muted small">groups the spaces below</span></div>`;
          const l = info[s.id];
          return `<a class="list-row link listing-row" style="--d:${d}" href="#/host/space/${s.id}">${art(s, { className: 'art mini' })}
            <div class="listing-main"><strong>${esc(s.title)}</strong><div class="muted small">${cat(s.category).icon} ${esc(cat(s.category).label)}${(s.quantity ?? 1) > 1 ? ` · ×${s.quantity}` : ''} · ${stars(s.rating)}</div>
            <div class="small">${TERM_ORDER.filter((t) => s.rates?.[t] != null).map((t) => `${money(s.rates[t])}/${term(t).unit}${t === 'lease' ? ' lease' : ''}`).join(' · ')}</div>
            <div class="chan-row">${l ? statusChip(l.status) : ''}${(l?.channels ?? []).map((k) => chanBadge(k)).join('')}
              ${l?.parity.length ? '<span class="badge warn">⚖️ Price above another site</span>' : ''}${l?.conflicts.length ? '<span class="badge bad">⚠️ Double-booked</span>' : ''}
              ${s.addonNote ? `<span class="badge">${esc(s.addonNote)}</span>` : ''}</div></div>${icon.chevron}</a>`;
        }).join('')}
        ${p.packages.length ? `<div class="pkgs">${p.packages.map((k) => `<span class="badge">📦 ${esc(k.name)}</span>`).join('')}</div>` : ''}

// ---------- Earnings ----------
async function renderHostEarnings(view) {
  const [s, hub, pr, props] = await Promise.all([api(`host/summary?hostId=${state.user}`), api(`host/hub?hostId=${state.user}`), api(`host/profit?hostId=${state.user}`), api(`properties?hostId=${state.user}`)]);
  const mySpaces = props.flatMap((p) => p.spaces.filter((x) => x.rentable !== false));
  const e = s.earnings;
  const thisMonth = hostMonthKey();
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const months = e.byMonth.map((m) => {
    const other = hub.otherEarnings.byMonth[m.month] ?? {};
    const parts = [['everyspace', m.amount], ...Object.entries(other)].filter(([, v]) => v > 0);
    return { month: m.month, parts, total: parts.reduce((x, [, v]) => x + v, 0) };
  });
  const max = Math.max(1, ...months.map((m) => m.total));
  const next6 = months.filter((m) => m.month > thisMonth).slice(0, 6).reduce((x, m) => x + m.total, 0);
  const used = [...new Set(months.flatMap((m) => m.parts.map(([k]) => k)))];
  const r2 = (n) => Math.round(n * 100) / 100;
  // Same window as the chart, for every site, so the numbers line up.
  const totals = {};
  for (const m of months) for (const [k, v] of m.parts) totals[k] = (totals[k] ?? 0) + v;
  const rows = Object.entries(totals).sort((a, b) => b[1] - a[1]).map(([k, v]) => {
    const fee = chan(k).hostFeePct;
    return { platform: k, payout: r2(v), ours: k === 'everyspace', fees: fee == null || fee >= 1 ? null : r2((v * fee) / (1 - fee)) };
  });
  const windowLabel = `${MON[+months[0].month.slice(5) - 1]} ${months[0].month.slice(0, 4)} – ${MON[+months.at(-1).month.slice(5) - 1]} ${months.at(-1).month.slice(0, 4)}`;

  view.innerHTML = `${topbar('Money', { back: false })}
    <div class="page">
      <div class="profit-cards">
        <div class="stat-card"><span class="stat-label">Income, last 12 months</span><strong class="stat-val">${money(Math.round(pr.total.income))}</strong><span class="stat-sub">Every site, after their fees</span></div>
        <div class="stat-card"><span class="stat-label">Expenses</span><strong class="stat-val">${money(Math.round(pr.total.expenses))}</strong><span class="stat-sub">${pr.byCategory[0] ? `Most on ${esc(pr.byCategory[0].label.toLowerCase())}` : 'None logged yet'}</span></div>
        <div class="stat-card ${pr.total.profit >= 0 ? 'good' : 'bad'}"><span class="stat-label">Profit</span><strong class="stat-val">${money(Math.round(pr.total.profit))}</strong><span class="stat-sub">${pr.total.income ? `${Math.round((pr.total.profit / pr.total.income) * 100)}% margin` : '—'}</span></div>
      </div>
      <div class="earn-hero">
        <span>Booked for the next 6 months, every site</span>
        <strong>${money(r2(next6))}</strong>
        <div class="small">Everyspace payouts after our ${FEES.h} host fee, plus what other sites pay you · All-time on Everyspace: ${money(e.allTime)}</div>
      </div>
      <div class="cal-legend chan-legend">${used.map((k) => `<span>${chanDot(k)}${esc(chan(k).name)}</span>`).join('')}</div>
      <div class="bars stacked" role="img" aria-label="Payouts by month across all sites">
        ${months.map((m) => `<div class="bar ${m.month === thisMonth ? 'now' : m.month < thisMonth ? 'past' : ''}" title="${esc(m.parts.map(([k, v]) => `${chan(k).name}: ${money(r2(v))}`).join('\n') || 'No payouts')}">
          <span class="bar-val">${m.total ? money(Math.round(m.total)) : ''}</span>
          <div class="bar-stack" style="height:${Math.max(2, (m.total / max) * 100)}%">${m.parts.map(([k, v]) => `<i style="flex:${v};--c:${esc(chan(k).color)}"></i>`).join('')}</div>
          <span>${MON[+m.month.slice(5) - 1]}</span>
        </div>`).join('')}
      </div>

      <h2 class="section-title">By site <span class="muted small">${windowLabel}</span></h2>
      ${rows.length ? `<div class="table-wrap"><table class="earn-table">
        <thead><tr><th>Site</th><th>Your payouts</th><th>Fees that site kept <span class="muted">(est.)</span></th></tr></thead>
        <tbody>${rows.map((r) => `<tr><td>${chanBadge(r.platform)}</td><td><strong>${money(r.payout)}</strong></td>
          <td>${r.fees == null ? '<span class="muted">unknown</span>' : `${money(r.fees)}${r.ours ? ` <span class="muted">(${FEES.h})</span>` : ''}`}</td></tr>`).join('')}</tbody>
      </table></div>` : '<div class="muted-block">No payouts in this window yet. Add bookings from other sites on the Calendar to see them here.</div>'}
      ${hub.otherEarnings.feesThere > 0 ? `<div class="notice ok">💡 <div><strong>Other sites kept about ${money(hub.otherEarnings.feesThere)} of your bookings.</strong>
        At Everyspace's ${FEES.h} host fee, the same bookings would have paid you about ${money(hub.otherEarnings.wouldKeep)} more. Keep listing wherever you like; this is just so you can see it.
        Fee rates are our estimates of each site's published host fees.</div></div>` : ''}

      <div class="row-between section-head"><h2 class="section-title">Expenses</h2><button class="btn small" id="add-exp">${icon.plus} Add expense</button></div>
      ${pr.recent.length ? `<div class="table-wrap"><table class="earn-table">
        <thead><tr><th>Date</th><th>What</th><th>Listing</th><th>Amount</th><th></th></tr></thead>

        <div id="exp-msg"></div><button class="btn wide" type="submit">Save expense</button></form>`, { title: 'Add an expense' });
    const f = $('#exp-form', body);
    f.onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('host/expenses', { hostId: state.user, amount: f.amount.value, date: f.date.value, category: f.category.value, spaceId: f.spaceId.value, note: f.note.value, recurring: f.recurring.checked ? 'monthly' : null });
        closeSheet(); playSound('success'); toast('Expense saved'); renderHostEarnings(view);
      } catch (err) { $('#exp-msg', body).innerHTML = errorBox(err); }
    };
  };

  $('#csv').onclick = async () => {
    playSound('click');
    const mine = (await api(`bookings?userId=${state.user}`)).filter((b) => b.role === 'host' && b.quote);
    const props = await api(`properties?hostId=${state.user}`);
    const spaces = props.flatMap((p) => p.spaces);
    const ext = [];
    for (const sp of spaces.filter((x) => x.rentable !== false)) {
      const r = await api(`spaces/${sp.id}/reservations?userId=${state.user}`);
      for (const x of r.items.filter((i) => i.kind === 'external')) ext.push({ ...x, title: sp.title });
    }
    const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const header = ['Type', 'Site', 'Booking', 'Booked on', 'Listing', 'Guest', 'Length', 'Start', 'End', 'Status', 'Guest paid (Everyspace)', 'Everyspace fee', 'Amount'];
    const expLines = pr.recent.map((x) => ['Expense', x.label, x.id, x.date, x.spaceTitle ?? 'Whole property', x.note, x.recurring ? 'monthly' : '', x.date, '', '', '', '', -x.amount]);
    const lines = [
      ...mine.map((b) => ['Income', 'Everyspace', b.id, b.createdAt.slice(0, 10), b.packageName ?? b.itemsLabel, b.renterName, term(b.term).label, b.start, b.end, b.effective,
        b.quote.total, b.quote.ourCut ?? '', b.quote.hostPayout]),
      ...ext.map((x) => ['Income', chan(x.platform).name, x.id, '', x.title, x.label, '', x.start, x.end, 'confirmed', '', '', x.payout ?? '']),
      ...expLines,
    ].map((r) => r.map(cell).join(','));
    download(`everyspace-all-bookings-${state.me.name.toLowerCase()}.csv`, [header.map(cell).join(','), ...lines].join('\n'), 'text/csv');
    toast(`Exported ${lines.length} booking${lines.length === 1 ? '' : 's'}`);
  };
}

function kitSheet(r, spaceId, done) {
  const domain = { swimply: 'swimply.com', peerspace: 'peerspace.com', neighbor: 'neighbor.com', spothero: 'spothero.com', sniffspot: 'sniffspot.com', hipcamp: 'hipcamp.com',

  const field = (label, text, id) => `<div class="kit-field"><div class="row-between"><strong class="small">${label}</strong><button class="btn small ghost" data-copy-kit="${id}">${icon.copy} Copy</button></div><div class="kit-text" id="${id}">${esc(text)}</div></div>`;
  const body = openSheet(`<div class="form">
      <p>We wrote your ${esc(r.name)} listing. Paste these in once, then tell us it's live. From then on its bookings and calendar show up here.</p>
      ${field('Title', r.kit.title, 'kit-title')}${field('Description', r.kit.description, 'kit-desc')}${field('Price', `${r.kit.ratesText} (pays you the same as your Everyspace price)`, 'kit-price')}

      <div id="kit-msg"></div>
      <button class="btn wide" id="kit-done">It's live on ${esc(r.name)}</button>
      <button class="btn link" id="kit-later">I'll do it later</button></div>`, { title: `Post on ${r.name}` });
  for (const b of $$('[data-copy-kit]', body)) b.onclick = async () => { try { await navigator.clipboard.writeText($(`#${b.dataset.copyKit}`, body).textContent); toast('Copied'); } catch { toast('Select the text to copy it'); } };
  $('#kit-done', body).onclick = async () => {
