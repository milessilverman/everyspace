// Publish one listing to one site, handling connect-first and paste-once sites.
async function publishTo(spaceId, site, done) {
  if (site.connect === 'direct' && !site.connected) {
    const d = await api(`host/distribution?hostId=${state.user}`);
    accountChoice(site.platform, d.connections[site.platform], () => publishTo(spaceId, { ...site, connected: true }, done));
    return;
  }
  try {
    const r = await api('host/publish', { hostId: state.user, spaceId, platform: site.platform });
    if (r.status === 'pending') kitSheet(r, spaceId, done);
    else { playSound('success'); toast(`Live on ${r.name} at ${r.kit.ratesText}. You take home the same.`); done(); }
  } catch (e) { toast(e.message); }
}

function siteChip(l, x) {
  const label = esc(x.name);
  if (x.status === 'live') return `<button class="site-chip live" data-site="${x.platform}" data-space="${l.spaceId}" title="Live on ${label}">✓ ${label}</button>`;
  if (x.status === 'pending') return `<button class="site-chip pending" data-site="${x.platform}" data-space="${l.spaceId}" title="Waiting for you to post it">⏳ ${label}</button>`;
  if (x.status === 'posting') return `<button class="site-chip pending posting" data-site="${x.platform}" data-space="${l.spaceId}" title="Our listing team is posting it for you">🛠️ ${label}</button>`;
  if (x.status === 'needs_price') return `<span class="site-chip off" title="${esc(x.needs)}">${label}</span>`;
  return `<button class="site-chip add ${x.top ? 'top' : ''}" data-site="${x.platform}" data-space="${l.spaceId}" title="${esc(x.reason)}">+ ${label}</button>`;
}

            ${ANCHOR_CATS.map((a) => `<label class="check-line"><input type="checkbox" data-anchorcat="${a}" ${it.anchorCats.includes(a) ? 'checked' : ''}> Anyone renting a ${esc(cat(a).label.toLowerCase())} here</label>`).join('')}
            ${others.map((s) => `<label class="check-line"><input type="checkbox" data-anchorid="${s.id}" ${it.anchorIds.includes(s.id) ? 'checked' : ''}> Only guests of ${esc(s.title)}</label>`).join('')}
            <div class="field row-between"><span>Max per rental</span>${stepper(`max:${k}`, it.maxPerAnchor, { min: 1, max: 10 })}</div>
            ${it.policy === 'both' && c.terms.includes('monthly') ? `<label>Monthly price for people renting here<input type="number" data-f="addonMonthly" value="${esc(it.addonMonthly)}"></label>` : ''}
          </div>` : ''}` : ''}
        ${eventy ? `<div class="anchor-box"><strong class="small">Event pricing (optional)</strong>
          <label>Event name<input data-ev="name" value="${esc(it.event.name)}" placeholder="Harvest Festival"></label>
          <div class="two"><label>Starts<input type="date" data-ev="start" value="${esc(it.event.start)}"></label><label>Ends<input type="date" data-ev="end" value="${esc(it.event.end)}"></label></div>
          <div class="two">${c.terms.includes('daily') ? `<label>Event day rate<input type="number" data-ev="daily" value="${esc(it.event.daily)}"></label>` : ''}${c.terms.includes('hourly') ? `<label>Event hourly rate<input type="number" data-ev="hourly" value="${esc(it.event.hourly)}"></label>` : ''}</div></div>` : ''}
      </div>
    </details>
    ${!container && !priced.length ? '<p class="small bad-text">Turn on at least one price.</p>' : ''}
  </section>`;
}

function draw(view, props) {
  const d = draft;
  const pos = d.step;
  const prop = props.find((p) => p.id === d.propertyId);
  let body = '';

  if (d.step === 0) {
    body = `<h1 class="page-title">Who's renting it out?</h1>
      <p class="muted">This decides what you can list. Homeowners and businesses each get the spaces that make sense for them.</p>
      <div class="owner-pick">${Object.entries(OWNER_INFO).map(([k, o]) => `<button type="button" class="owner-card ${d.owner === k ? 'on' : ''}" data-owner="${k}">
        <span class="owner-icon">${o.icon}</span><strong>${o.title}</strong><span class="muted">${o.text}</span></button>`).join('')}</div>`;
  } else if (d.step === 1) {
    const cats = Object.entries(state.catalog.categories).filter(([, x]) => x.owners.includes(d.owner) && x.group !== 'container');
    const section = (aud) => {
      const list = cats.filter(([, x]) => x.audience === aud);
      const groups = Object.entries(state.catalog.groups).filter(([g]) => list.some(([, x]) => x.group === g));
      return groups.map(([g, label]) => `<h3 class="tile-group">${state.catalog.groupIcons[g]} ${esc(label)}</h3>
        <div class="tiles">${list.filter(([, x]) => x.group === g).map(([k, x]) => tile(k, x)).join('')}</div>`).join('');
    };
    body = `<h1 class="page-title">What do you want to rent out?</h1>
      <p class="muted">Pick as many as you like. You'll price each one on the next steps.</p>
      <h2 class="section-title">Rent to people nearby</h2>
      <p class="muted small">Neighbors and visitors book by the hour, night, month or lease.</p>
      ${section('consumer')}
      <h2 class="section-title">Lease to companies <span class="badge ok">Nothing to set up</span></h2>
      <p class="muted small">Solar, battery, EV-charging${d.owner !== 'home' ? ', sign, locker and fleet' : ' and telecom'} companies sign multi-year leases and pay for everything: equipment, permits, installation, insurance and upkeep. You only provide the space.</p>
      ${section('business')}
      ${d.owner === 'home' ? '<p class="muted small fine">Own a business or run an organization? Parking-lot EV chargers, signs, parcel lockers, fleet parking and meeting rooms are listed by business owners. <a class="link-text" href="#/host/new?fresh=1&owner=business">Switch to business owner</a></p>' : ''}
      <details class="more"><summary>Organize: add a building or garage that holds other spaces</summary>
        <div class="tiles">${tile('building', cat('building'))}</div></details>`;
  } else if (d.step === 2) {
    const items = d.picked.filter(rentable);
    body = `<h1 class="page-title">What each one needs</h1>
      <p class="muted">Check that your property has these before you list. Missing something? We'll tell you what to do, or you can drop it for now.</p>
      ${items.map((k) => { const c = cat(k); const it = d.items[k]; const done = reqDone(k);
        return `<section class="item-card req-card ${done ? 'ready' : ''}" data-item="${k}">
          <div class="item-head"><span class="tile-icon">${c.icon}</span><div><strong>${esc(c.label)}</strong><div class="muted small">Rented by ${esc(c.renters.toLowerCase())}</div></div>
            ${done ? '<span class="badge ok">Ready</span>' : `<button type="button" class="btn small ghost" data-remove="${k}">Remove</button>`}</div>
          <div class="req-title small"><strong>This requires:</strong></div>
          <div class="req-list">${c.requires.map((r, i) => `<label class="req ${it.req.includes(i) ? 'on' : ''}"><input type="checkbox" data-req="${i}" ${it.req.includes(i) ? 'checked' : ''}>
            <span><strong>${esc(r.text)}</strong>${!it.req.includes(i) && r.help ? `<span class="muted small">${esc(r.help)}</span>` : ''}</span></label>`).join('')}</div>
          <div class="who-does ${c.turnkey ? 'turnkey' : ''}"><div><span class="label">You provide</span>${esc(c.provide)}</div><div><span class="label">${c.audience === 'business' ? 'The company handles' : 'Renters handle'}</span>${esc(c.handled)}</div></div>
        </section>`; }).join('') || '<p class="muted">Nothing to check for a building group. Continue.</p>'}`;
  } else if (d.step === 3) {
    const mine = ownerProps(props);
    const hidden = props.length - mine.length;
    const types = state.catalog.propertyTypes[d.owner];
    if (!d.newProp.type || !types.some(([v]) => v === d.newProp.type)) d.newProp.type = types[0][0];
    if (!d.propertyId || (d.propertyId !== 'new' && !mine.some((p) => p.id === d.propertyId))) d.propertyId = mine[0]?.id ?? 'new';
    body = `<h1 class="page-title">Where is it?</h1>
      <div class="option-list">${mine.map((p) => `<button type="button" class="option ${d.propertyId === p.id ? 'on' : ''}" data-prop="${p.id}"><strong>${esc(p.title)}</strong>
        <span class="muted small">${esc(p.city)} · ${esc(typeLabel(p))} · ${p.spaces.length} space${p.spaces.length === 1 ? '' : 's'}</span></button>`).join('')}
        <button type="button" class="option ${d.propertyId === 'new' ? 'on' : ''}" data-prop="new"><strong>${icon.plus} A new ${OWNER_WORDS[d.owner].place}</strong></button></div>
      ${hidden ? `<p class="muted small">${hidden} of your other propert${hidden === 1 ? 'y is' : 'ies are'} hidden because you're listing as ${OWNER_WORDS[d.owner].a}.</p>` : ''}
      ${d.propertyId === 'new' ? `<div class="form card pad">
        <label>${OWNER_WORDS[d.owner].nameLabel}<input id="np-title" value="${esc(d.newProp.title)}" placeholder="${OWNER_WORDS[d.owner].placeholder}"></label>
        <label>City<input id="np-city" value="${esc(d.newProp.city)}"></label>
        <label>Type<select id="np-type">${types.map(([v, l]) => `<option value="${v}" ${d.newProp.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>` : ''}`;
  } else if (d.step === 4) {
    body = `<h1 class="page-title">Details & prices</h1>
      <p class="muted">We filled in typical local prices. You keep ${FEES.k}; renters see one all-in price with our ${FEES.s} fee included.</p>
      ${d.picked.map((k) => itemCard(k, props, prop)).join('')}
      <a class="btn ghost small" href="#" data-goto="1">${icon.plus} Add something else</a>`;
  } else if (d.step === 5) {
    const listing = d.listMode === 'list';
    body = `<h1 class="page-title">Almost done</h1>
      <div class="segmented three" role="radiogroup" aria-label="How to publish">
        <label><input type="radio" name="mode" value="list" ${listing ? 'checked' : ''}><span>🌐 List everywhere now</span></label>
        <label><input type="radio" name="mode" value="manage" ${listing ? '' : 'checked'}><span>🗂 Just manage for now</span></label>
      </div>
      <p class="muted small">${listing ? 'We list it here and on every other site it fits, all at once. Confirm a few quick things for each so renters know what to expect.' : 'Nothing goes on the marketplace yet. You still get the calendar, sync and earnings tools, and can list any of them later.'}</p>
      ${d.picked.filter(rentable).map((k) => { const it = d.items[k]; const c = cat(k);
        return `<section class="item-card" data-item="${k}"><div class="item-head"><span class="tile-icon">${c.icon}</span><div><strong>${esc(it.title)}</strong><div class="muted small">${esc(c.label)}</div></div></div>
          ${listing && c.checklist.length ? `<div class="checklist">${c.checklist.map((x, i) => `<label class="check-line"><input type="checkbox" data-check="${i}" ${it.checklist.includes(x) ? 'checked' : ''}> ${esc(x)}</label>`).join('')}</div>` : ''}
          ${c.turnkey ? `<p class="muted small">That's all. ${esc(c.handled)}.</p>` : `<label class="form">How renters get in <span class="muted small">(shown only after they book)</span>
            <textarea data-f="access" rows="2" placeholder="Gate code, where to park, lockbox…">${esc(it.access)}</textarea></label>`}
        </section>`; }).join('')}`;
  } else if (d.step === 6) {
    body = `<h1 class="page-title">Review & publish</h1>
      <p class="muted">${d.picked.length} thing${d.picked.length === 1 ? '' : 's'} at <strong>${esc(prop?.title ?? d.newProp.title)}</strong>, listed by ${OWNER_WORDS[d.owner].a} · ${d.listMode === 'list' ? 'live on Everyspace' : 'managing only'}</p>
      <div class="review-list">${d.picked.map((k) => { const it = d.items[k]; const c = cat(k);
        const prices = c.terms.filter((t) => it.on[t] && Number(it.rates[t]) > 0).map((t) => `${money(it.rates[t])}/${term(t).unit}`).join(' · ');
        return `<div class="list-row"><span class="pkg-icon">${c.icon}</span><div><strong>${esc(it.title)}</strong>
          <div class="muted small">${esc(c.label)}${it.quantity > 1 ? ` · ${it.quantity} of them` : ''}${c.audience === 'business' ? ' · leased to companies' : ''}</div>
          <div class="small">${prices || (rentable(k) ? '' : 'Groups other spaces')}</div></div></div>`; }).join('')}</div>
      ${d.listMode === 'list' ? `<section class="where-box" id="where"><h2 class="section-title">Where it'll be listed</h2><div class="muted small">Finding every site it fits…</div></section>` : ''}
      <div id="pub-msg"></div>`;
  }

  const ok = validate(d);
  view.innerHTML = `${topbar('List your spaces', { right: `<span class="muted small">${pos + 1} of ${STEPS.length}</span>` })}
    <div class="wizard-breadcrumbs">${STEPS.map((n, i) => `<button class="crumb ${i === pos ? 'active' : i < pos ? 'done' : ''}" data-step-jump="${i}" ${i < pos ? '' : 'disabled'}>
      <span class="crumb-num">${i < pos ? '✓' : i + 1}</span><span class="crumb-text">${n}</span></button>`).join('')}</div>
    <div class="progress"><i style="width:${((pos + 1) / STEPS.length) * 100}%"></i></div>
    <div class="page narrow wizard">${body}</div>
    <div class="reserve-bar wizard-bar">
      <button class="btn ghost" id="prev" ${pos === 0 ? 'disabled' : ''}>Back</button>
      <span class="muted small" id="why">${ok ? (d.step === 1 ? `${d.picked.length} selected` : '') : esc(whyNot(d))}</span>
      <button class="btn" id="next" ${ok ? '' : 'disabled'}>${d.step === 6 ? `Publish ${d.picked.length > 1 ? `all ${d.picked.length}` : ''} 🎉` : 'Next'}</button>
    </div>`;
  bind(view, props);
}

function typeLabel(p) {
  const all = [...state.catalog.propertyTypes.home, ...state.catalog.propertyTypes.business];
  return all.find(([v]) => v === p.type)?.[1] ?? p.type;
}

function bind(view, props) {
  const d = draft;
  const redraw = () => draw(view, props);
  const sync = () => {
    const ok = validate(d);
    $('#next').disabled = !ok;
    $('#why').textContent = ok ? (d.step === 1 ? `${d.picked.length} selected` : '') : whyNot(d);
  };
  bindBack(view);

  for (const b of $$('[data-step-jump]', view)) b.onclick = () => { playSound('click'); d.step = +b.dataset.stepJump; redraw(); };
  for (const b of $$('[data-goto]', view)) b.onclick = (e) => { e.preventDefault(); d.step = +b.dataset.goto; redraw(); window.scrollTo(0, 0); };
  for (const b of $$('[data-owner]', view)) b.onclick = () => {
    playSound('click');
    if (d.owner !== b.dataset.owner) { d.owner = b.dataset.owner; d.picked = d.picked.filter((k) => cat(k).owners.includes(d.owner)); d.propertyId = ''; }
    redraw();
  };
  for (const b of $$('[data-cat]', view)) b.onclick = () => { playSound('click'); pick(b.dataset.cat, !d.picked.includes(b.dataset.cat)); redraw(); };
  for (const b of $$('[data-remove]', view)) b.onclick = () => { playSound('click'); pick(b.dataset.remove, false); if (!d.picked.length) d.step = 1; redraw(); };
  for (const b of $$('[data-prop]', view)) b.onclick = () => { playSound('click'); d.propertyId = b.dataset.prop; for (const k of d.picked) d.items[k].parentId = ''; redraw(); };
  for (const r of $$('[name="mode"]', view)) r.onchange = () => { playSound('toggle'); d.listMode = r.value; redraw(); };
  if (d.step === 6 && d.listMode === 'list') drawWhere(view, d);

  const bindInput = (sel, fn) => { const el = $(sel, view); if (el) el.oninput = () => { fn(el.value); sync(); }; };
  bindInput('#np-title', (v) => { d.newProp.title = v; });
  bindInput('#np-city', (v) => { d.newProp.city = v; });
  const npType = $('#np-type', view); if (npType) npType.onchange = () => { d.newProp.type = npType.value; };

  for (const card of $$('[data-item]', view)) {
    const it = d.items[card.dataset.item];
    const c = cat(card.dataset.item);
    for (const el of $$('[data-f]', card)) {
      const handler = () => { it[el.dataset.f] = el.value; if (el.dataset.f === 'policy') redraw(); else sync(); };
      el.oninput = handler; if (el.tagName === 'SELECT') el.onchange = handler;
    }
    for (const el of $$('[data-ev]', card)) el.oninput = () => { it.event[el.dataset.ev] = el.value; };
    for (const el of $$('[data-feat]', card)) el.onchange = () => {
      playSound('toggle');
      toggle(it.features, el.dataset.feat, el.checked);
      el.closest('.fchip').classList.toggle('on', el.checked);
      refreshSuggestion(card, card.dataset.item, it);
    };
    for (const el of $$('[data-size]', card)) el.oninput = debounceSize(() => { it.size[el.dataset.size] = el.value; refreshSuggestion(card, card.dataset.item, it); });
    bindUseSugg(card, card.dataset.item, it);
    if (d.step === 4 && !it.sugg && rentable(card.dataset.item)) refreshSuggestion(card, card.dataset.item, it);
    for (const el of $$('[data-rate]', card)) el.oninput = () => {
      it.touched = true;
      it.rates[el.dataset.rate] = el.value;
      $(`[data-pay="${el.dataset.rate}"]`, card).innerHTML = payLine(card.dataset.item, el.dataset.rate, it);
      sync();
    };
    for (const el of $$('[data-on]', card)) el.onchange = () => { it.on[el.dataset.on] = el.checked; redraw(); };
    for (const el of $$('[data-anchorcat]', card)) el.onchange = () => { toggle(it.anchorCats, el.dataset.anchorcat, el.checked); sync(); };
    for (const el of $$('[data-anchorid]', card)) el.onchange = () => { toggle(it.anchorIds, el.dataset.anchorid, el.checked); sync(); };
    for (const el of $$('[data-check]', card)) el.onchange = () => { toggle(it.checklist, c.checklist[+el.dataset.check], el.checked); sync(); };
    for (const el of $$('[data-req]', card)) el.onchange = () => { playSound('toggle'); it.req ??= []; toggle(it.req, +el.dataset.req, el.checked); redraw(); };
  }
  bindSteppers(view, (name, v) => {
    const [kind, k] = name.split(':');
    if (kind === 'qty') d.items[k].quantity = v;
    if (kind === 'max') d.items[k].maxPerAnchor = v;
  });

  $('#prev').onclick = () => { playSound('click'); d.step = Math.max(0, d.step - 1); redraw(); window.scrollTo(0, 0); };
  $('#next').onclick = async () => {
    playSound('click');
    if (d.step < 6) { d.step++; redraw(); window.scrollTo(0, 0); return; }
    $('#next').disabled = true;
    try {
      if (d.listMode === 'list' && d.agreeSites && $('#wh-profile', view)) await saveInlineProfile(view);
      const r = await publish(d);
      let everywhere = null;
      if (d.listMode === 'list') {
        const skip = {};
        for (const sp of r.spaces) if (d.skip[sp.category]?.length) skip[sp.id] = d.skip[sp.category];
        everywhere = await api('host/list-everywhere', { hostId: state.user, spaceIds: r.spaces.map((x) => x.id), skip, agree: d.agreeSites });
      }
      playSound('success');
      triggerConfetti();
      draft = null;
      if (everywhere) {
        const names = [...new Set(everywhere.live.map((x) => x.name))];
        const team = [...new Set(everywhere.posting.map((x) => x.name))];
        toast(`Live on Everyspace${names.length ? `, ${names.join(', ')}` : ''} 🎉${team.length ? ` Our team is posting to ${team.join(', ')}.` : ''}`);
        state.lastEverywhere = everywhere;
      } else toast(`Added ${r.spaces.length} to your listings`);
      go(d.listMode === 'list' ? '#/host/sites' : r.spaces.length === 1 && rentable(r.spaces[0].category) ? `#/host/space/${r.spaces[0].id}` : '#/host/listings');
    } catch (e) { $('#pub-msg').innerHTML = errorBox(e); $('#next').disabled = false; }
  };
}

// The "Where it'll be listed" box on the review step: every site each item fits, all on by default.
async function drawWhere(view, d) {
  const box = $('#where', view);
  if (!box) return;
  const items = d.picked.filter(rentable).map((k) => {
    const it = d.items[k]; const rates = {};
    for (const t of cat(k).terms) if (it.on[t] && Number(it.rates[t]) > 0) rates[t] = Number(it.rates[t]);
    return { key: k, category: k, features: it.features, rates, size: it.size, policy: it.policy };
  });
  const [prev, prof] = await Promise.all([api('host/sites-preview', { hostId: state.user, items }), api(`host/profile?hostId=${state.user}`)]);
  if (!box.isConnected) return;
  const needAccounts = new Set();
  const rows = prev.map((p) => {
    const it = d.items[p.key]; const c = cat(p.key);
    const skip = d.skip[p.key] ??= [];
    const chips = p.sites.map((x) => {
      const on = x.usable && !skip.includes(x.platform);
      if (on && !x.connected) needAccounts.add(x.name);
      return x.usable
        ? `<label class="where-chip ${on ? 'on' : ''}" title="${esc(x.reason)}"><input type="checkbox" data-where="${p.key}:${x.platform}" ${on ? 'checked' : ''}>${esc(x.name)}${x.connect === 'assist' ? ' <span class="wc-note">we post it</span>' : ''}</label>`
        : `<span class="where-chip off" title="Needs ${esc(x.needs)}">${esc(x.name)} <span class="wc-note">needs ${esc(x.needs)}</span></span>`;
    }).join('');
    return `<div class="where-row"><div class="where-head"><span class="tile-icon">${c.icon}</span><strong>${esc(it.title)}</strong></div>
      <div class="where-chips"><span class="where-chip on fixed">✓ Everyspace</span>${chips || (c.audience === 'business' ? '<span class="muted small">Shown to companies on Everyspace for Business</span>' : (it.policy ?? 'standalone') === 'addon' ? '<span class="muted small">Add-on: offered with its main listing</span>' : '')}</div></div>`;
  }).join('');
  const total = prev.reduce((n, p) => n + p.sites.filter((x) => x.usable && !(d.skip[p.key] ?? []).includes(x.platform)).length, 0);
  box.innerHTML = `<h2 class="section-title">Where it'll be listed</h2>
    <p class="muted small">Every site that fits, all at once${total ? ` (${total + d.picked.filter(rentable).length} listings in total)` : ''}. Untick any you don't want. Calendars, prices and messages stay in sync from here.</p>
    ${rows}
    ${needAccounts.size ? `<div class="where-accounts">
      <label class="check-line strong"><input type="checkbox" id="wh-agree" ${d.agreeSites ? 'checked' : ''}> Create my accounts on ${esc([...needAccounts].join(', '))} for me, using my host profile. I agree to each site's terms.</label>
      ${prof.complete ? `<div class="muted small">Using ${esc(prof.legalName)} · ${esc(prof.email)} · ${esc(prof.phone)}. Each site asks for payout details on its own secure page.</div>`
        : `<div class="form two-col" id="wh-profile">
          <label>Full name<input name="legalName" value="${esc(prof.legalName)}" autocomplete="name"></label>
          <label>Email<input name="email" type="email" value="${esc(prof.email)}" autocomplete="email"></label>
          <label>Phone<input name="phone" inputmode="tel" value="${esc(prof.phone)}" autocomplete="tel"></label>
          <label>City<input name="city" value="${esc(prof.city || d.newProp.city || '')}"></label></div>
          <div class="muted small">Filled in once, reused for every site.</div>`}
      <div class="muted small">Leave it unticked and we'll list on Everyspace and any site you've already connected; add the rest later from "Where you're listed".</div>
    </div>` : ''}
    <div class="muted small">Prices on other sites are set so you take home the same as here. Their fees are higher, so renters pay a little more there.</div>`;
  for (const el of $$('[data-where]', box)) el.onchange = () => {
    playSound('toggle');
    const [k, pl] = el.dataset.where.split(':');
    toggle(d.skip[k] ??= [], pl, !el.checked);
    drawWhere(view, d);
  };
  const ag = $('#wh-agree', box); if (ag) ag.onchange = () => { playSound('toggle'); d.agreeSites = ag.checked; };
}

async function saveInlineProfile(view) {
  const f = $('#wh-profile', view);
  const v = (n) => f.querySelector(`[name="${n}"]`).value;
  await api('host/profile', { hostId: state.user, legalName: v('legalName'), email: v('email'), phone: v('phone'), city: v('city') });
}

function reqDone(k) { const n = cat(k).requires?.length ?? 0; return !n || (draft.items[k].req ?? []).length >= n; }

function toggle(list, v, on) { const i = list.indexOf(v); if (on && i < 0) list.push(v); if (!on && i >= 0) list.splice(i, 1); }
function debounceSize(fn) { let t; return () => { clearTimeout(t); t = setTimeout(fn, 300); }; }

function itemProblem(k) {
  const it = draft.items[k]; const c = cat(k);
  if (!it.title.trim()) return `Name your ${c.label.toLowerCase()}`;
  if (!rentable(k)) return '';
  if (!c.terms.some((t) => it.on[t] && Number(it.rates[t]) > 0)) return `Set a price for ${it.title}`;
  if (it.policy !== 'standalone' && !it.anchorCats.length && !it.anchorIds.length) return `Choose who ${it.title} is for`;
  return '';
}

function whyNot(d) {
  switch (d.step) {
    case 0: return 'Choose one to continue';
    case 1: return 'Pick at least one thing';
    case 2: { const k = d.picked.filter(rentable).find((x) => !reqDone(x)); return k ? `Confirm what ${cat(k).label.toLowerCase()} needs, or remove it` : ''; }
    case 3: return d.propertyId === 'new' ? 'Add the name and city' : 'Choose where it is';
    case 4: return d.picked.map(itemProblem).find(Boolean) ?? '';
    case 5: { const k = d.picked.filter(rentable).find((x) => !cat(x).checklist.every((i) => d.items[x].checklist.includes(i))); return k ? `Confirm everything for ${d.items[k].title}` : ''; }
    default: return '';
  }
}

function validate(d) {
  switch (d.step) {
    case 0: return !!d.owner;
    case 1: return d.picked.length > 0;
    case 2: return d.picked.filter(rentable).every(reqDone);
    case 3: return d.propertyId === 'new' ? !!(d.newProp.title.trim() && d.newProp.city.trim()) : !!d.propertyId;
    case 4: return d.picked.length > 0 && d.picked.every((k) => !itemProblem(k));
    case 5: return d.listMode === 'manage' || d.picked.filter(rentable).every((k) => cat(k).checklist.every((i) => d.items[k].checklist.includes(i)));
    default: return true;
  }
}

function publish(d) {
  const items = d.picked.map((k) => {
    const it = d.items[k]; const c = cat(k);
    const container = !rentable(k);
    const rates = {};
    if (!container) for (const t of c.terms) if (it.on[t] && Number(it.rates[t]) > 0) rates[t] = Number(it.rates[t]);
    const body = { category: k, title: it.title.trim(), description: it.description.trim(), quantity: container ? 1 : it.quantity, rates, rentable: !container,
      listed: d.listMode === 'list', checklist: it.checklist, access: it.access.trim() || undefined, parentId: it.parentId || undefined,
      amenities: it.amenities.split(',').map((x) => x.trim()).filter(Boolean), policy: container ? 'standalone' : it.policy };
    const size = Object.fromEntries(Object.entries(it.size).filter(([, v]) => v !== '' && v != null).map(([kk, v]) => [kk, Number(v)]));
    if (it.sqft) size.sqft = Number(it.sqft);
    if (Object.keys(size).length) body.size = size;
    body.features = it.features;
    if (it.event.name && it.event.start && (it.event.daily || it.event.hourly)) {
      body.eventRates = [{ name: it.event.name, start: it.event.start, end: it.event.end || it.event.start,
        ...(it.event.daily ? { daily: Number(it.event.daily) } : {}), ...(it.event.hourly ? { hourly: Number(it.event.hourly) } : {}) }];
    }
    if (it.policy !== 'standalone' && !container) {
      body.addon = { anchorCategories: it.anchorCats, anchorIds: it.anchorIds, maxPerAnchor: it.maxPerAnchor };
      if (it.addonMonthly) body.addonRates = { monthly: Number(it.addonMonthly) };
    }
    return body;
  });

}

      <section class="block">

  bindBack(view);
  const refresh = () => renderManage(view, [id]);

  // Save helper. On a parity error, offers to lower the Everyspace price to match and retry.
  const save = async (changes, msgEl, okText) => {
    try { await api(`spaces/${s.id}/update`, { actorId: state.user, changes }); toast(okText); return true; }
    catch (e) {
      if (!msgEl) { toast(e.message); return false; }
      msgEl.innerHTML = errorBox(e) + (isParityError(e) ? '<button class="btn small" data-match-retry>Lower my Everyspace price to match and save</button>' : '');
      const retry = $('[data-match-retry]', msgEl);
      if (retry) retry.onclick = async () => { if (await save({ ...changes, matchParity: true }, msgEl, `${okText}. Everyspace price lowered to match.`)) refresh(); };
      return false;
    }
  };

  // Visibility
  const box = $('#checklist-box');
  for (const r of $$('[name="vis"]', view)) r.onchange = async () => {
    playSound('toggle');
    const v = r.value;
    if (v === 'live' && !s.listed) {
      const done = s.checklist ?? [];
      const missing = s.checklistItems.filter((x) => !done.includes(x));
      if (missing.length) { box.hidden = false; for (const cb of $$('[data-check]', box)) cb.checked = done.includes(cb.dataset.check); box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
      if (await save({ listed: true }, $('#vis-msg'), 'Live on Everyspace')) refresh();
      return;
    }
    box.hidden = true;
    const changes = v === 'manage_only' ? { listed: false } : { ...(s.listed ? {} : { listed: true }), paused: v === 'paused' };
    if (await save(changes, $('#vis-msg'), v === 'live' ? 'Live on Everyspace' : v === 'paused' ? 'Paused on Everyspace' : 'Managing only. Hidden from Everyspace search.')) refresh();
  };
  $('#publish').onclick = async () => {
    const checklist = $$('[data-check]', box).filter((x) => x.checked).map((x) => x.dataset.check);
    if (await save({ listed: true, checklist }, $('#vis-msg'), 'Live on Everyspace 🎉')) refresh();
  };

  if ($('#fix-parity')) $('#fix-parity').onclick = async () => {
    playSound('click');
    if (await save({ rates: { ...s.rates }, matchParity: true }, $('#price-msg'), 'Price lowered to match')) refresh();
  };

  for (const b of $$('[data-same]', view)) b.onclick = async () => {
    playSound('click');
    const r = s.takeHome[+b.dataset.same];
    if (await save({ rates: { ...s.rates, [r.term]: r.sameRate } }, $('#price-msg'), `${term(r.term).label} price set to ${money(r.sameRate)}`)) refresh();
  };

  if ($('#instant')) $('#instant').onchange = async (e) => {
    playSound('toggle');
    if (await save({ mode: e.target.checked ? 'instant' : 'request' }, null, e.target.checked ? 'Instant Book on' : 'You approve each request')) refresh();
  };

  for (const inp of $$('[data-rate]', view)) inp.oninput = () => {
    const v = Number(inp.value);
    const over = inp.dataset.ceil && v > Number(inp.dataset.ceil);
    inp.closest('.money-input').classList.toggle('over', !!over);
    $(`[data-payout="${inp.dataset.rate}"]`, view).innerHTML = v > 0 ? `Renter pays ${renterPays(v)} · <strong>you get ${payout(v)}</strong>${over ? ' · <span class="bad-text">above your price elsewhere</span>' : ''}` : 'Off';
  };

  $('#save-prices').onclick = async () => {
    playSound('click');
    const rates = Object.fromEntries($$('[data-rate]', view).map((i) => [i.dataset.rate, i.value]));
    if (await save({ rates }, $('#price-msg'), 'Prices saved')) refresh();
  };

  // Other sites
  for (const b of $$('[data-unlink]', view)) b.onclick = async () => {
    const e = externals[+b.dataset.unlink];
    if (!confirm(`Unlink ${chan(e.platform).name}? Bookings already synced from it stay on your calendar.`)) return;
    if (await save({ externalListings: externals.filter((_, i) => i !== +b.dataset.unlink) }, $('#ext-msg'), 'Unlinked')) refresh();

  for (const b of $$('[data-edit-ext]', view)) b.onclick = () => {

        <p class="muted small">Changed your price on ${esc(chan(e.platform).name)}? Update it here so comparisons stay accurate.</p>

      const rates = Object.fromEntries(Object.keys(e.rates).map((t) => [t, f[t].value]));

  for (const b of $$('[data-sync]', view)) b.onclick = async () => {

    try { const r = await api(`spaces/${s.id}/sync`, { actorId: state.user }); toast(`Up to date · ${r.reservations} synced booking${r.reservations === 1 ? '' : 's'}`); refresh(); }
    catch (e) { toast(e.message); }

  for (const b of $$('[data-ics]', view)) b.onclick = () => openImportIcs(s, externals[+b.dataset.ics], refresh);
  for (const b of $$('[data-feed]', view)) b.onclick = () => openFeedSheet(s, externals[+b.dataset.feed].platform, feedLink);
  $('#dl-ics').onclick = async () => { const r = await api(`spaces/${s.id}/ical`); download(r.filename, r.ics, 'text/calendar'); toast(`Downloaded ${r.events} event${r.events === 1 ? '' : 's'}`); };

    const l = d.listings.find((x) => x.spaceId === s.id);

    const rec = l.sites.find((x) => x.status === 'recommended');
    strip.innerHTML = `<div class="dist-row compact"><div class="dist-title"><strong>Rents best on</strong><span class="muted small">${rec ? `Start with ${esc(rec.name)}: ${esc(rec.reason[0].toLowerCase() + rec.reason.slice(1))}.` : 'Live everywhere we recommend.'} <a class="link-text" href="#/host/sites">All sites</a></span></div>
      <div class="site-chips">${l.sites.map((x) => siteChip(l, x)).join('')}</div></div>`;
    for (const b of $$('[data-site]', strip)) b.onclick = () => {
      const site = l.sites.find((x) => x.platform === b.dataset.site);

  // Features & suggested price

      $('#sugg-box').innerHTML = ts.length ? `<div class="sugg-table">

      const use = $('#use-sugg', view);

    drawSugg();

function openImportIcs(space, ext, done) {
  const body = openSheet(`<form class="form" id="ics-form">
      <p class="muted small">On ${esc(chan(ext.platform).name)}, find the calendar export (often “Export calendar” or “Sync calendars”). Re-importing updates bookings in place, and ones cancelled there are removed here.</p>
      <label>Calendar link (iCal / .ics)<input name="url" value="${esc(ext.icalUrl ?? '')}" placeholder="https://…/calendar.ics" inputmode="url"></label>
      <div class="or-divider"><span>or</span></div>
      <label>Upload the .ics file<input type="file" name="file" accept=".ics,text/calendar"></label>
      <label>Or paste its contents<textarea name="ics" rows="5" placeholder="BEGIN:VCALENDAR…"></textarea></label>
      <div id="ics-msg"></div>
      <button class="btn wide" type="submit">Import bookings</button>
    </form>`, { title: `Import ${chan(ext.platform).name} calendar` });
  const f = $('#ics-form', body);
  f.onsubmit = async (e) => {
    e.preventDefault();
    const msg = $('#ics-msg', body);
    let ics = f.ics.value.trim();
    const url = f.url.value.trim();
    if (!ics && f.file.files[0]) ics = await f.file.files[0].text();
    try {
      if (!ics && url) {
        // Save the link so it can be synced, then try to read it. Many sites block browsers from reading
        // their feeds directly; the hosted Everyspace server fetches them for you every 15 minutes.
        const next = (space.externalListings ?? []).map((x) => (x.url === ext.url ? { ...x, icalUrl: url } : x));
        await api(`spaces/${space.id}/update`, { actorId: state.user, changes: { externalListings: next } });
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error();
          ics = await r.text();
        } catch {
          msg.innerHTML = `<div class="notice">🔗 <div><strong>Link saved.</strong> ${esc(chan(ext.platform).name)} doesn't let browsers read its calendar directly, so the hosted Everyspace server will sync it automatically. To import right now, download the .ics from ${esc(chan(ext.platform).name)} and upload it above.</div></div>`;
          return;
        }
      }
      if (!ics) { msg.innerHTML = errorBox(new Error('Add a calendar link, upload a file, or paste the contents')); return; }
      const r = await api(`spaces/${space.id}/ical-import`, { actorId: state.user, platform: ext.platform, ics, url: url || undefined });
      closeSheet();
      toast(r.warning ?? `${r.added} added · ${r.updated} updated · ${r.removed} removed${r.conflicts.length ? ' · ⚠️ overlaps found' : ''}`);
      done();
    } catch (err) { msg.innerHTML = errorBox(err); }
  };
}

        const res = await api('host/import-many', { hostId: state.user, propertyId: imp.propertyId, newProperty: { ...imp.newProp, ownerType: imp.owner }, listings });

        toast(`Imported ${res.spaces.length} listing${res.spaces.length === 1 ? '' : 's'}${res.imported ? ` with ${res.imported} booking${res.imported === 1 ? '' : 's'} from their calendars` : ''}`);

      } catch (err) { $('#imp-msg').innerHTML = errorBox(err); btn.disabled = false; $('#imp-msg').scrollIntoView({ block: 'center', behavior: 'smooth' }); }

  };
  draw();
}

// ---- public/js/main.js ----
(() => {
// App shell: routing, top navigation bar, bottom navigation, sound effects, and lifecycle.
const { $, api, esc, state, icon, go, bindSaves, updateAppHeader, applyTheme } = __m['core'];
const { renderExplore, renderLongTerm } = __m['explore'];
const { renderSpace } = __m['space'];
const { renderBook } = __m['book'];
const { renderTrips, renderTrip, renderOffer } = __m['trips'];
const { renderInbox, renderChat } = __m['inbox'];
const { renderHostToday, renderHostCalendar, renderHostListings, renderHostEarnings, renderSites, renderExtChat } = __m['host'];
const { renderTasks, renderDocs, renderTeam } = __m['ops'];
const { renderImport, renderPromise, renderWelcome } = __m['hub'];
const { renderWizard } = __m['wizard'];
const { renderProfile, renderPlan, renderCatalog } = __m['profile'];
const { renderBizHome, renderPipeline } = __m['biz'];
const { renderEarn, renderSaved } = __m['earn'];
const { renderManage, renderFairPrice } = __m['manage'];

const ROUTES = [
  [/^\/?$/, renderWelcome, {}],
  [/^\/explore$/, renderExplore, { nav: true, mode: 'guest' }],
  [/^\/saved$/, renderSaved, { nav: true, mode: 'guest' }],
  [/^\/long-term$/, renderLongTerm, { nav: true, mode: 'guest' }],
  [/^\/space\/([\w-]+)$/, renderSpace, {}],
  [/^\/book\/(pkg)\/([\w-]+)$/, renderBook, {}],
  [/^\/book\/([\w-]+)$/, renderBook, {}],
  [/^\/trips$/, renderTrips, { nav: true, mode: 'guest' }],
  [/^\/trip\/([\w-]+)$/, renderTrip, {}],
  [/^\/offer\/([\w-]+)$/, renderOffer, {}],
  [/^\/inbox$/, renderInbox, { nav: true }],
  [/^\/chat\/([\w-]+)$/, renderChat, { chat: true }],
  [/^\/host$/, renderHostToday, { nav: true, mode: 'host' }],
  [/^\/host\/listings$/, renderHostListings, { nav: true, mode: 'host' }],
  [/^\/host\/calendar$/, renderHostCalendar, { nav: true, mode: 'host' }],
  [/^\/host\/import$/, renderImport, { mode: 'host' }],
  [/^\/host\/tasks$/, renderTasks, { mode: 'host' }],
  [/^\/host\/sites$/, renderSites, { mode: 'host' }],
  [/^\/xchat\/([\w-]+)$/, renderExtChat, { chat: true, mode: 'host' }],
  [/^\/host\/docs$/, renderDocs, { mode: 'host' }],
  [/^\/host\/team$/, renderTeam, { mode: 'host' }],
  [/^\/promise$/, renderPromise, {}],
  [/^\/host\/earnings$/, renderHostEarnings, { nav: true, mode: 'host' }],
  [/^\/host\/new$/, renderWizard, { mode: 'host' }],
  [/^\/host\/space\/([\w-]+)$/, renderManage, { mode: 'host' }],
  [/^\/fair-price$/, renderFairPrice, {}],
  [/^\/biz$/, renderBizHome, { nav: 'business', mode: 'business' }],
  [/^\/biz\/pipeline$/, renderPipeline, { nav: true, mode: 'business' }],
  [/^\/earn$/, renderEarn, {}],
  [/^\/profile$/, renderProfile, { nav: true }],
  [/^\/plan$/, renderPlan, {}],
  [/^\/catalog$/, renderCatalog, {}],
];

const NAV = {
  guest: [['#/explore', 'Explore', icon.explore], ['#/saved', 'Saved', icon.heart], ['#/trips', 'Trips', icon.trips], ['#/inbox', 'Inbox', icon.inbox], ['#/profile', 'Profile', icon.user]],
  host: [['#/host', 'Today', icon.today], ['#/host/calendar', 'Calendar', icon.calendar], ['#/host/listings', 'Listings', icon.listings], ['#/inbox', 'Inbox', icon.inbox], ['#/host/earnings', 'Money', icon.earnings], ['#/profile', 'Profile', icon.user]],
  business: [['#/biz', 'Sites', icon.briefcase], ['#/biz/pipeline', 'Pipeline', icon.pipeline], ['#/inbox', 'Inbox', icon.inbox], ['#/profile', 'Profile', icon.user]],
};

const home = () => (state.mode === 'host' ? '#/host' : state.mode === 'business' ? '#/biz' : '#/explore');

async function route() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  const found = ROUTES.find(([re]) => re.test(path));
  if (!found || found[2].redirect) { go(home()); return; }
  const [re, render, meta] = found;
  const isBiz = state.me.kind === 'business';

  if (isBiz && (meta.mode === 'guest' || meta.mode === 'host')) { go('#/biz'); return; }
  let nav = meta.nav;
  if (meta.mode === 'business' && !isBiz) {
    if (path !== '/biz') { go('#/biz'); return; }
    nav = false;
  } else if (meta.mode && meta.mode !== state.mode) {
    state.setMode(meta.mode);
  }
  if (isBiz && state.mode !== 'business') state.setMode('business');

  // Update top persistent header
  updateAppHeader();

  const view = $('#view');
  view.className = `view ${nav ? 'with-nav' : ''} ${meta.chat ? 'chat-view' : ''} enter`;
  document.body.dataset.mode = state.mode;
  drawNav(nav ? `#${path}` : null);

  try {
    await render(view, path.match(re).slice(1), new URLSearchParams(qs));
  } catch (e) {
    const expected = /not listed|not found|Only the/i.test(e.message);
    if (!expected) console.error(e);
    view.innerHTML = `<div class="page narrow"><div class="empty"><div class="empty-icon">${expected ? '🔎' : '⚠️'}</div>
      <strong>${expected ? esc(e.message) : 'Something went wrong'}</strong>${expected ? '' : `<span class="small">${esc(e.message)}</span>`}
      <a class="btn" href="#/">Return home</a></div></div>`;
  }
  window.scrollTo(0, 0);
  requestAnimationFrame(() => view.classList.remove('enter'));
}

function drawNav(active) {
  const nav = $('#nav');
  if (!active) { nav.hidden = true; return; }
  nav.hidden = false;
  nav.innerHTML = NAV[state.mode].map(([href, label, svg]) => `<a href="${href}" class="${href === active ? 'on' : ''}" ${href === active ? 'aria-current="page"' : ''}>${svg}<span>${label}</span></a>`).join('');
}

async function boot() {
  applyTheme();
  [state.catalog, state.users, state.channels, state.fit] = await Promise.all([api('catalog'), api('users'), api('channels'), api('fit')]);
  window.everyspaceCatalog = state.catalog;
  if (!state.users.some((u) => u.id === state.user)) state.setUser('u_maya');
  bindSaves();
  updateAppHeader();
  window.addEventListener('hashchange', route);
  await route();
  document.body.classList.add('ready');
}

window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.deferredInstall = e; });
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.everyspaceApi) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

boot();

__m['main'] = { route };
})();

})();
  </script>
