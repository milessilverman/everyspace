:root {
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-display: 'Outfit', 'Plus Jakarta Sans', sans-serif;

  --bg: #f8f9fa;
  --panel: #ffffff;
  --panel-2: #f1f3f5;
  --panel-3: #e9ecef;
  --ink: #111827;
  --ink-secondary: #374151;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-subtle: #f1f5f9;

  --accent: #0f766e;
  --accent-hover: #115e59;
  --accent-ink: #ffffff;
  --accent-soft: #f0fdfa;
  --accent-border: #ccfbf1;

  --accent-2: #ea580c;
  --accent-2-soft: #fff7ed;

  --biz: #0f172a;
  --biz-2: #1e293b;
  --biz-accent: #f59e0b;
  --biz-accent-soft: #fef3c7;

  --gold: #f59e0b;
  --gold-soft: #fffbeb;
  --ok: #059669;
  --ok-soft: #ecfdf5;
  --warn: #d97706;
  --warn-soft: #fffbeb;
  --bad: #dc2626;
  --bad-soft: #fef2f2;
  --event: #7c3aed;
  --event-soft: #f5f3ff;
  --star: #f59e0b;

  --radius-sm: 8px;
  --radius: 16px;
  --radius-lg: 22px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
  --shadow-glow: 0 0 24px rgba(15, 118, 110, 0.16);

  --nav-h: 68px;
  --header-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  font-family: var(--font-sans);
  font-feature-settings: "cv11", "ss01";
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f17;
    --panel: #131b26;
    --panel-2: #1b2636;
    --panel-3: #223044;
    --ink: #f9fafb;
    --ink-secondary: #e2e8f0;
    --muted: #94a3b8;
    --line: #243144;
    --line-subtle: #192332;

    --accent: #2dd4bf;
    --accent-hover: #14b8a6;
    --accent-ink: #042f2e;
    --accent-soft: rgba(45, 212, 191, 0.12);
    --accent-border: rgba(45, 212, 191, 0.25);

    --accent-2: #fb923c;
    --accent-2-soft: rgba(251, 146, 60, 0.14);

    --biz: #020617;
    --biz-2: #0f172a;
    --biz-accent: #f59e0b;
    --biz-accent-soft: rgba(245, 158, 11, 0.15);

    --gold: #fbbf24;
    --gold-soft: rgba(251, 191, 36, 0.15);
    --ok: #34d399;
    --ok-soft: rgba(52, 211, 153, 0.15);
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.15);
    --bad: #f87171;
    --bad-soft: rgba(248, 113, 113, 0.15);
    --event: #c084fc;
    --event-soft: rgba(192, 132, 252, 0.15);

    --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.6);
    --shadow-glow: 0 0 28px rgba(45, 212, 191, 0.24);
  }
}

:root[data-theme="dark"] {
  --bg: #0b0f17;
  --panel: #131b26;
  --panel-2: #1b2636;

  --biz-2: #0f172a;
  --biz-accent: #f59e0b;
  --biz-accent-soft: rgba(245, 158, 11, 0.15);

  --gold: #fbbf24;
  --gold-soft: rgba(251, 191, 36, 0.15);
  --ok: #34d399;
  --ok-soft: rgba(52, 211, 153, 0.15);

}

:root[data-theme="light"] {
  --bg: #f8f9fa;
  --panel: #ffffff;
  --panel-2: #f1f3f5;
  --panel-3: #e9ecef;
  --ink: #111827;
  --ink-secondary: #374151;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-subtle: #f1f5f9;

  --accent: #0f766e;
  --accent-hover: #115e59;
  --accent-ink: #ffffff;
  --accent-soft: #f0fdfa;
  --accent-border: #ccfbf1;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea { resize: vertical; }
svg { stroke-linecap: round; stroke-linejoin: round; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; letter-spacing: -0.02em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.fine { text-align: center; margin: 18px 0; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* ---------- app shell & header ---------- */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  padding: max(8px, var(--safe-t)) 16px 8px;
  transition: background .2s, border-color .2s;
}
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand-link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.02em;
}
.brand-glyph { width: 30px; height: 30px; flex: none; border-radius: 8px; box-shadow: var(--shadow-sm); }
.brand-text b { color: var(--accent); }
.biz-pill {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.05em;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--biz-accent);
  color: var(--biz);
  margin-left: 6px;
  vertical-align: 2px;
}

/* Mode Switcher in Header */
.mode-pills {
  display: inline-flex;
  background: var(--panel-2);
  border: 1px solid var(--line);
  padding: 3px;
  border-radius: var(--radius-full);
  gap: 2px;
}
.mode-pill {
  border: 0;
  background: transparent;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .18s ease;
}
.mode-pill:hover:not(.on):not(:disabled) { color: var(--ink); background: color-mix(in srgb, var(--panel) 50%, transparent); }
.mode-pill.on {
  background: var(--panel);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.mode-pill:disabled { opacity: 0.4; cursor: not-allowed; }

/* Header Controls: Persona, Theme, Sound */
.header-controls {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.persona-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-full);
  padding: 4px 10px 4px 4px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  transition: all .2s;
}
.persona-pill:hover { background: var(--panel); border-color: var(--accent); box-shadow: var(--shadow-sm); }
.persona-name { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.persona-chevron svg { fill: none; stroke: currentColor; stroke-width: 2; width: 14px; height: 14px; color: var(--muted); }
.header-tool {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
}
.header-tool:hover { border-color: var(--accent); background: var(--panel-2); }
@media (max-width: 640px) {
  .mode-label { display: none; }
  .help-tool { display: none; }
  .persona-name { display: none; }
  .app-header { padding-left: 12px; padding-right: 12px; }
  .header-inner { gap: 8px; }
  .header-controls { gap: 4px; }
}
@media (max-width: 480px) {
  .brand-text { display: none; }
  #sound-btn { display: none; }
}

/* Shell View */
.view { min-height: calc(100vh - var(--header-h)); padding-bottom: 96px; }
.view.with-nav { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 24px); }
.view.chat-view { padding-bottom: 120px; }
.page { max-width: 1280px; margin: 0 auto; padding: 16px 20px 24px; }
.page.narrow { max-width: 720px; }

/* Topbar inside views */
.topbar {
  position: sticky;
  top: var(--header-h);
  z-index: 10;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { margin: 0; font-size: 18px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; justify-content: flex-end; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  cursor: pointer;
  padding: 0;
  color: var(--ink);
  transition: background .15s, transform .12s;
}
.icon-btn:hover { background: var(--panel-2); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.icon-btn svg, .tabbar svg, .menu svg, .list-row > svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
.icon-btn.floating { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; z-index: 3; background: var(--panel); box-shadow: var(--shadow-md); }

/* Tabbar navigation */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  justify-content: center;
  gap: 6px;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar a {
  flex: 0 1 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  position: relative;
  transition: color .2s;
}
.tabbar a.on { color: var(--accent); }
.tabbar a.on::before {
  content: '';
  position: absolute;
  top: 6px;
  width: 48px;
  height: 32px;
  border-radius: var(--radius-full);
  background: var(--accent-soft);
  z-index: -1;
}

/* ---------- buttons, chips, badges ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 0;
  border-radius: 14px;
  padding: 12px 20px;
  background: var(--accent);
  color: var(--accent-ink);
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 4px 12px color-mix(in srgb, var(--accent) 25%, transparent);
  transition: transform .12s, box-shadow .2s, background .2s;
}
.btn:hover:not(:disabled) {
  background: var(--accent-hover);
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent);
  transform: translateY(-1px);
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.btn.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.btn.ghost:hover:not(:disabled) { background: var(--panel-2); border-color: var(--ink); color: var(--ink); }
.btn.link { background: transparent; color: var(--accent); box-shadow: none; padding: 6px 12px; }
.btn.small { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
.btn.wide { width: 100%; margin: 8px 0; }
.btn.danger-ghost { background: transparent; color: var(--bad); border: 1px solid var(--bad-soft); box-shadow: none; }

.chips { display: flex; gap: 8px; }
.chips.scroll { overflow-x: auto; scrollbar-width: none; padding: 4px 20px; margin: 0 -20px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--radius-full);
  padding: 8px 16px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  color: var(--ink);
  transition: all .18s;
}
.chip:hover { border-color: var(--ink); transform: translateY(-1px); }
.chip.small { padding: 6px 12px; font-size: 13px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .02em;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  background: var(--panel-2);
  color: var(--muted);
}
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.event { background: var(--event-soft); color: var(--event); }
.badge.biz { background: var(--biz); color: var(--biz-accent); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-full); background: var(--panel-2); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 11px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; padding: 0 6px; }
.stars { font-size: 13px; font-weight: 700; color: var(--star); white-space: nowrap; }
.stars.new { color: var(--muted); font-weight: 600; }
.avatar { display: inline-grid; place-items: center; flex: none; width: var(--size); height: var(--size); border-radius: 50%; color: #fff; font-weight: 800; font-size: calc(var(--size) * .42); }

/* ---------- explore view & filter bar ---------- */
.explore-head {
  padding: 16px 20px 8px;
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  gap: 14px;
}
.hero-title {
  font-size: clamp(28px, 5vw, 44px);
  line-height: 1.08;
  margin: 4px 0 0;
  font-weight: 800;
  letter-spacing: -.035em;
}
.hero-title span {
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.search-card {
  display: grid;
  gap: 10px;
  padding: 12px;
  border-radius: 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
}
.searchbar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel-2);
  border-radius: var(--radius-full);
  padding: 6px 14px;
}
.searchbar svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.searchbar input { border: 0; background: transparent; padding: 8px 4px; box-shadow: none; font-size: 15px; font-weight: 500; }
.search-kbd {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--muted);
}
.when-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.when {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--radius-full);
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.when:hover { border-color: var(--ink); }
.when.set { border-color: var(--ink); background: var(--panel-2); }
.when.clear { border-style: dashed; color: var(--bad); }

/* Layout Mode Switcher (Grid / Split / Map) */
.layout-switcher {
  display: inline-flex;
  background: var(--panel-2);
  border: 1px solid var(--line);
  padding: 2px;
  border-radius: var(--radius-full);
  gap: 2px;
  margin-left: auto;
}
.layout-btn {
  border: 0;
  background: transparent;
  padding: 6px 10px;
  border-radius: var(--radius-full);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  transition: all .15s;
}
.layout-btn.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-sm); }
.layout-btn svg { width: 16px; height: 16px; }

/* Category Navigation Bar */
.cat-bar {
  position: sticky;
  top: var(--header-h);
  z-index: 15;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 10px 20px 0;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  max-width: 1280px;
  margin: 0 auto;
}
.cat-bar::-webkit-scrollbar { display: none; }
.cat-bar button {
  flex: none;
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 6px 14px 12px;
  border: 0;
  background: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  border-bottom: 2.5px solid transparent;
  transition: all .2s;
}
.cat-bar button span { font-size: 22px; filter: grayscale(0.2); transition: transform .2s; }
.cat-bar button:hover span { transform: translateY(-2px); }
.cat-bar button.on { color: var(--ink); border-bottom-color: var(--accent); }
.cat-bar button.on span { filter: none; }

/* Quick Ideas */
.ideas { display: grid; grid-auto-flow: column; grid-auto-columns: max-content; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 14px 20px 2px; margin: 0 -20px; }
.ideas::-webkit-scrollbar { display: none; }
.idea { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 14px; border: 1px solid var(--line); cursor: pointer; font-weight: 650; font-size: 14px; color: var(--ink); transition: transform .15s, box-shadow .2s; }
.idea:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.idea span { font-size: 20px; }
.tone-a { background: #e0f2fe; border-color: #bae6fd; }
.tone-b { background: #ffedd5; border-color: #fed7aa; }
.tone-c { background: #fef3c7; border-color: #fde68a; }
.tone-d { background: #ccfbf1; border-color: #99f6e4; }
.tone-e { background: #dcfce7; border-color: #bbf7d0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .idea { background: var(--panel-2); border-color: var(--line); } }

/* Cards Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px 20px; }
.card { display: block; background: var(--panel); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.card.pad { padding: 16px; }
.space-card { border: 0; background: transparent; box-shadow: none; }
.space-card .thumb {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  aspect-ratio: 16 / 10;
  background: var(--panel-2);
  box-shadow: var(--shadow);
  transition: transform .25s ease, box-shadow .25s ease;
}
.space-card:hover .thumb {
  box-shadow: var(--shadow-lg);
  transform: translateY(-3px);
}
.space-card .thumb .art { width: 100%; height: 100%; display: block; transition: transform .5s cubic-bezier(0.2, 0.7, 0.2, 1); }
.space-card:hover .thumb .art { transform: scale(1.04); }
.fav-tag {
  position: absolute;
  left: 10px;
  top: 10px;
  background: var(--panel);
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
  padding: 4px 9px;
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-sm);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.save-btn {
  position: absolute;
  right: 10px;
  top: 10px;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  background: color-mix(in srgb, #000 28%, transparent);
  backdrop-filter: blur(8px);
  transition: transform .15s;
}
.save-btn svg { width: 20px; height: 20px; fill: rgba(0,0,0,0.2); stroke: #ffffff; stroke-width: 2; transition: fill .2s; }
.save-btn.on svg { fill: #ef4444; stroke: #ef4444; }
.save-btn:active { transform: scale(0.85); }
.save-btn.icon-btn { position: static; background: var(--panel); box-shadow: var(--shadow-sm); }
.save-btn.icon-btn svg { stroke: var(--ink); fill: none; }
.save-btn.icon-btn.on svg { fill: #ef4444; stroke: #ef4444; }

.space-card .card-body { padding: 10px 4px 0; display: grid; gap: 3px; }
.space-card .title { font-size: 16px; font-weight: 700; line-height: 1.3; }
.price { font-weight: 800; font-size: 16px; color: var(--ink); }
.price span { font-weight: 500; color: var(--muted); font-size: 13px; }
.all-in { font-size: 11px; font-weight: 600; color: var(--muted); }
.cmp-line { font-size: 12px; font-weight: 700; margin-top: 2px; }
.cmp-line.ok { color: var(--ok); }
.cmp-line.beat { color: var(--accent-2); }

/* Horizontal scrolling rows */
.hscroll {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(280px, 320px);
  gap: 16px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 4px 20px 10px;
  margin: 0 -20px;
  scroll-snap-type: x mandatory;
}
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { scroll-snap-align: start; }

/* Event and Bundle Cards */
.event-card { display: flex; gap: 14px; padding: 14px; align-items: center; border-radius: var(--radius); }
.event-date {
  display: grid;
  place-items: center;
  flex: none;
  width: 60px;
  height: 64px;
  border-radius: 14px;
  background: var(--event-soft);
  color: var(--event);
}
.event-date span { font-size: 12px; text-transform: uppercase; font-weight: 700; }
.event-date b { font-size: 20px; font-weight: 800; }
.event-text { color: var(--event); font-weight: 700; }

.pkg-card { box-shadow: var(--shadow-sm); border: 1px solid var(--line); border-radius: var(--radius); transition: transform .2s, box-shadow .2s; }
.pkg-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.pkg-card .pkg-art { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; height: 150px; gap: 2px; }
.pkg-card .pkg-art > div:first-child { grid-row: span 2; }
.pkg-card .pkg-art.n1 > div { grid-column: span 2; }

/* ---------- Split View Layout (Cards on Left, Sticky Map on Right) ---------- */
.split-view-container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  max-width: 1360px;
  margin: 0 auto;
  padding: 12px 20px;
}
@media (min-width: 960px) {
  .split-view-container {
    grid-template-columns: minmax(420px, 1.2fr) minmax(440px, 1fr);
    align-items: start;
  }
  .split-map-col {
    position: sticky;
    top: calc(var(--header-h) + 12px);
    height: calc(100vh - var(--header-h) - 36px);
  }
}
.split-map-col .map-wrap {
  height: 100%;
  margin: 0;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
}
.split-map-col .map { height: 100%; min-height: 480px; }

/* ---------- Interactive Map ---------- */
.map-wrap {
  position: relative;
  margin-top: 10px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--line);
  background: #e6eee0;
}
.map {
  display: block;
  width: 100%;
  height: min(72vh, 660px);
  cursor: grab;
  user-select: none;
}
.map:active { cursor: grabbing; }
.map .land { fill: #f2f5ec; }
.map .water { fill: #93c5fd; }
.map .park { fill: #bbf7d0; stroke: #86efac; stroke-width: 2; }
.map .fairgrounds { fill: #fef08a; stroke: #fde047; stroke-width: 2; }
.map .stadium { fill: #fed7aa; stroke: #fdba74; stroke-width: 2; }
.map .street { stroke: #ffffff; stroke-width: 6; stroke-linecap: round; }
.map .street.major { stroke: #fef08a; stroke-width: 10; }
.map .freeway { stroke: #fb923c; stroke-width: 12; opacity: .85; }
.map-label {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  fill: #475569;
  letter-spacing: .04em;
  text-transform: uppercase;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .map { filter: brightness(0.72) contrast(1.15) saturate(0.85); }
}

/* Map Price Pins */
.pin { cursor: pointer; outline: none; transition: transform .2s; }
.pin:hover, .pin.highlighted, .pin.on { transform: scale(1.18); z-index: 10; }
.pin rect {
  fill: var(--panel);
  stroke: var(--line);
  stroke-width: 1.5;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.22));
  transition: fill .2s, stroke .2s;
}
.pin path { fill: var(--panel); }
.pin text {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 800;
  text-anchor: middle;
  fill: var(--ink);
}
.pin.on rect, .pin.highlighted rect, .pin.on path, .pin.highlighted path {
  fill: var(--accent);
  stroke: #ffffff;
}
.pin.on text, .pin.highlighted text { fill: var(--accent-ink); }
.pin-ripple {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  animation: pinPulse 1.8s infinite;
}
@keyframes pinPulse {
  0% { r: 16px; opacity: 0.9; }
  100% { r: 36px; opacity: 0; }
}

/* Map Zoom Controls */
.map-controls {
  position: absolute;
  right: 14px;
  top: 14px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.map-tool-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  color: var(--ink);
  transition: all .15s;
}
.map-tool-btn:hover { background: var(--panel-2); transform: scale(1.05); }

/* Floating Map Card Preview */
.map-preview-popup {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 16px;
  z-index: 6;
  max-width: 440px;
  margin: 0 auto;
  background: var(--panel);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  display: flex;
  gap: 12px;
  padding: 10px;
  animation: popIn .2s ease-out;
}
@keyframes popIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.map-preview-thumb { width: 100px; height: 75px; border-radius: 12px; overflow: hidden; flex: none; }

/* ---------- Space Detail View ---------- */
.gallery-mosaic {
  max-width: 1280px;
  margin: 0 auto;
  position: relative;
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  border-radius: var(--radius-lg);
  overflow: hidden;
}
@media (min-width: 768px) {
  .gallery-mosaic {
    grid-template-columns: 2fr 1fr;
    height: 420px;
  }
  .g-main { height: 100%; }
  .g-main .art { height: 100%; border-radius: 20px 0 0 20px; }
  .g-side {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    height: 100%;
  }
  .g-side .art { height: 100%; }
  .g-side .art:first-child { border-radius: 0 20px 0 0; }
  .g-side .art:last-child { border-radius: 0 0 20px 0; }
}
.view-photos-btn {
  position: absolute;
  right: 16px;
  bottom: 16px;
  z-index: 3;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .15s;
}
.view-photos-btn:hover { transform: scale(1.04); }

.detail-layout { display: block; margin-top: 16px; }
.detail-side { display: none; }
@media (min-width: 960px) {
  .detail-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 48px;
    align-items: start;
  }
  .detail-side {
    display: block;
    position: sticky;
    top: calc(var(--header-h) + 16px);
  }
  .book-card {
    background: var(--panel);
    border-radius: var(--radius-lg);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-lg);
    padding: 24px;
    display: grid;
    gap: 16px;
  }
  .detail-bar { display: none; }
}

.page-title { font-size: clamp(26px, 4vw, 36px); font-weight: 800; margin: 8px 0; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }

/* Host Trust Card */
.host-trust-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--panel-2);
  border: 1px solid var(--line);
  margin: 18px 0;
}
.host-trust-info { flex: 1; min-width: 0; }
.host-trust-info strong { display: block; font-size: 16px; }
.host-stats-pill {
  display: inline-flex;
  gap: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 3px;
}

/* Categorized Amenities */
.amenities-group { margin: 16px 0; }
.amenity-category-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; margin-bottom: 8px; }
.amenities-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.amenity-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-size: 14px;
  font-weight: 600;
}
.amenity-chip svg { width: 18px; height: 18px; color: var(--accent); flex: none; }

/* Review Category Breakdown */
.ratings-breakdown {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px 24px;
  margin: 16px 0 24px;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--panel-2);
  border: 1px solid var(--line);
}
.rating-bar-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; }
.rating-progress-wrap { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.rating-progress-fill { height: 100%; border-radius: 3px; background: var(--star); }

/* Neighborhood Walkability */
.neighborhood-card {
  padding: 16px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--line);
  display: grid;
  gap: 12px;
  margin: 16px 0;
}
.walk-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.walk-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }

/* Sticky Reserve Bar */
.reserve-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 25;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 20px calc(12px + var(--safe-b));
  background: var(--panel);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
}

/* ---------- Checkout View ---------- */
.summary-card {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow-sm);
  margin: 8px 0 16px;
}
.block { padding: 20px 0; border-bottom: 1px solid var(--line); }
.block h2 { font-size: 18px; margin: 0 0 14px; display: flex; gap: 8px; align-items: center; }

/* 1-Click Apple / Google Pay */
.pay-btn-apple {
  width: 100%;
  background: #000000;
  color: #ffffff;
  border-radius: 14px;
  padding: 14px;
  font-size: 17px;
  font-weight: 700;
  border: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: var(--shadow-md);
  margin-bottom: 12px;
  transition: transform .15s;
}
.pay-btn-apple:hover { transform: scale(1.01); background: #1a1a1a; }
.pay-btn-apple svg { width: 22px; height: 22px; fill: currentColor; }

/* Card Form Preview */
.card-preview-box {
  background: linear-gradient(135deg, #1e293b, #0f172a);
  color: #f8fafc;
  padding: 18px 20px;
  border-radius: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-md);
  display: grid;
  gap: 16px;
}
.card-chip { width: 34px; height: 24px; border-radius: 4px; background: #fbbf24; }
.card-number-display { font-family: monospace; font-size: 18px; letter-spacing: 2px; }

/* Boarding Pass / Reservation Slip */
.boarding-pass {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-md);
  margin: 16px 0;
  display: grid;
  gap: 14px;
}
.qr-container { display: grid; place-items: center; padding: 12px; background: #ffffff; border-radius: 14px; border: 1px solid #e2e8f0; width: fit-content; margin: 0 auto; }

/* ---------- Trips View & Digital Key ---------- */
.digital-key-card {
  background: linear-gradient(135deg, var(--accent-soft), var(--panel));
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin: 16px 0;
  box-shadow: var(--shadow-sm);
}
.code-display {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 8px 16px;
  border-radius: 12px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  margin: 8px 0;
}
.copy-code-btn {
  border: 0;
  background: var(--panel-2);
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Stepper Component */
.stepper { display: inline-flex; align-items: center; gap: 6px; flex: none; }
.stepper button {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  font-size: 18px;
  font-weight: 700;
  display: grid;
  place-items: center;
  transition: all .15s;
}
.stepper button:hover:not(:disabled) { border-color: var(--ink); background: var(--panel-2); }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper output { min-width: 36px; text-align: center; font-weight: 700; font-size: 15px; color: var(--ink); }

/* ---------- Chat View ---------- */
.chat { display: flex; flex-direction: column; gap: 10px; padding: 16px; max-width: 720px; margin: 0 auto; }
.bubble-row { display: flex; gap: 10px; align-items: flex-end; max-width: 82%; }
.bubble-row.mine { align-self: flex-end; }
.bubble {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 10px 14px;
  border-radius: 18px 18px 18px 4px;
  font-size: 15px;
  box-shadow: var(--shadow-sm);
}
.mine .bubble {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  border-radius: 18px 18px 4px 18px;
}
.typing-indicator {
  display: inline-flex;
  gap: 4px;
  padding: 6px 10px;
  background: var(--panel-2);
  border-radius: var(--radius-full);
}
.typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.4s infinite; }
.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

/* ---------- Lightbox Modal ---------- */
#lightbox { position: fixed; inset: 0; z-index: 60; }
.lightbox-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
.lightbox-dialog {
  position: absolute;
  inset: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  max-width: 960px;
  max-height: 85vh;
  margin: auto;
  background: var(--panel);
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  padding: 16px;
  overflow: hidden;
}
.lightbox-top { display: flex; justify-content: space-between; align-items: center; }
.lightbox-counter { font-size: 14px; font-weight: 700; color: var(--muted); }
.lightbox-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: 1; min-height: 0; }
.lightbox-art-wrap { flex: 1; height: 100%; max-height: 480px; display: grid; place-items: center; border-radius: 14px; overflow: hidden; }
.lightbox-art-wrap .art { width: 100%; height: 100%; border-radius: 14px; }
.lightbox-caption { text-align: center; font-size: 15px; font-weight: 700; margin: 10px 0 6px; }
.lightbox-thumbs { display: flex; justify-content: center; gap: 8px; overflow-x: auto; padding: 4px 0; }
.lb-thumb { width: 64px; height: 44px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; padding: 0; background: none; }
.lb-thumb.on { border-color: var(--accent); }
.lb-thumb-art .art { width: 100%; height: 100%; }

/* Bottom Sheet */
#sheet { position: fixed; inset: 0; z-index: 50; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); opacity: 0; transition: opacity .2s; }
.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 88vh;
  overflow-y: auto;
  background: var(--panel);
  border-radius: 24px 24px 0 0;
  padding: 12px 20px calc(24px + var(--safe-b));
  transform: translateY(100%);
  transition: transform .22s cubic-bezier(0.2, 0.9, 0.2, 1);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
}
@media (min-width: 640px) {
  .sheet {
    left: 50%;
    right: auto;
    width: 560px;
    bottom: 50%;
    border-radius: 24px;
    transform: translate(-50%, 50%) scale(0.95);
    opacity: 0;
    transition: all .2s cubic-bezier(0.2, 0.9, 0.2, 1);
  }
}
#sheet.open .sheet-backdrop { opacity: 1; }
#sheet.open .sheet { transform: translateY(0); }
@media (min-width: 640px) { #sheet.open .sheet { transform: translate(-50%, 50%) scale(1); opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.sheet-head h2 { margin: 0; font-size: 20px; }

/* Persona Sheet Grid */
.persona-sheet-content { display: grid; gap: 10px; }
.people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.person-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: var(--panel);
  cursor: pointer;
  text-align: left;
  transition: all .15s;
}
.person-card:hover { border-color: var(--accent); background: var(--panel-2); transform: translateY(-1px); }
.person-card.on { border-color: var(--accent); background: var(--accent-soft); }
.person-info { flex: 1; min-width: 0; display: grid; }
.person-info strong { font-size: 14px; }

/* Toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
  z-index: 70;
  transform: translate(-50%, 20px);
  opacity: 0;
  background: var(--ink);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  transition: all .22s cubic-bezier(0.2, 0.8, 0.2, 1);
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Shortcuts Modal List */
.shortcuts-list { display: grid; gap: 8px; }
.shortcut-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--panel-2);
  font-weight: 600;
}
.shortcut-row kbd {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px 8px;
  font-family: monospace;
  font-weight: 800;
  box-shadow: var(--shadow-sm);
}

/* Pipeline Kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: 16px; overflow-x: auto; padding-bottom: 12px; }
.lane { background: var(--panel-2); border-radius: 18px; padding: 14px; display: grid; gap: 12px; align-content: start; min-height: 220px; border: 1px solid var(--line); }
.lane h2 { font-size: 15px; margin: 0; display: flex; justify-content: space-between; }
.lane-card { border-radius: 14px; box-shadow: var(--shadow-sm); transition: transform .15s; }
.lane-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

/* Price quote breakdown lines */
.quote { display: grid; gap: 10px; }
.qline { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.qline.total { border-top: 1px solid var(--line); padding-top: 12px; font-size: 17px; font-weight: 800; }
.qline.ok { color: var(--ok); font-weight: 650; }
.qline.beat { color: var(--accent-2); font-weight: 700; }
.our-cut { font-size: 13px; color: var(--muted); padding: 10px 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }

/* Compare table */
.compare { display: grid; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); margin-bottom: 14px; box-shadow: var(--shadow-sm); }
.compare-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.compare-row.ours { background: var(--accent-soft); }
.compare-row.lower { background: var(--accent-2-soft); }
.compare-verdict { padding: 12px 16px; font-size: 14px; font-weight: 700; }
.compare-verdict.ok { color: var(--ok); }
.compare-verdict.beat { color: var(--accent-2); }

/* Guarantee card */
.guarantee {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 16px;
  padding: 16px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--biz), var(--biz-2));
  color: #f8fafc;
  box-shadow: var(--shadow-md);
}
.guarantee span.icon { font-size: 28px; }
.guarantee strong { font-size: 15px; }
.guarantee span.desc { font-size: 13px; opacity: .85; display: block; margin-top: 2px; }

/* Calendar */
.cal-months { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-grid .dow { font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 0; }
.day {
  position: relative;
  aspect-ratio: 1;
  border: 0;
  background: transparent;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  max-height: 42px;
  transition: all .15s;
}
.day:hover:not(:disabled) { background: var(--panel-2); outline: 2px solid var(--ink); }
.day.range { background: var(--accent-soft); border-radius: 0; }
.day.sel { background: var(--ink); color: var(--bg); font-weight: 800; }
.day.partial::after, .day:not(.past):not(.full):not(.partial)::after {
  content: ''; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ok);
}
.day.partial::after { background: var(--warn); }
.day.past { color: var(--muted); opacity: .35; }
.day.full { color: var(--muted); text-decoration: line-through; }
.cal-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
.cal-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.cal-legend .free { background: var(--ok); }
.cal-legend .partial { background: var(--warn); }
.cal-legend .full { background: var(--line); }


/* ---------- restored component styles ---------- */

.brand b { font-weight: 800; }
.icon-btn svg, .tabbar svg, .menu svg, .list-row > svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.stack { display: grid; gap: 8px; margin-top: 16px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.brand-row { display: flex; justify-content: space-between; align-items: center; }
.explore-body { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

.host-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 14px 0; }

.list-row.link > svg { color: var(--muted); }

.facts { display: grid; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }

.option svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; vertical-align: -3px; }

.error { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }

.trip-card { display: grid; grid-template-columns: 120px 1fr; margin-bottom: 12px; }

.timeline { display: flex; margin: 16px 0 6px; }
.timeline > div { flex: 1; display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--muted); position: relative; }
.timeline > div::before { content: ''; position: absolute; top: 6px; left: -50%; right: 50%; height: 2px; background: var(--line); }
.timeline > div:first-child::before { display: none; }
.timeline i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); position: relative; z-index: 1; }
.timeline .done i, .timeline .done::before { background: var(--accent); }
.access { background: var(--ok-soft); border-radius: var(--radius); padding: 16px; border: 0; margin: 12px 0; }
.access p { margin: 4px 0 10px; }
.muted-block { color: var(--muted); padding: 14px; border-radius: 12px; background: var(--panel-2); display: flex; gap: 8px; align-items: center; font-size: 14px; }

.star-input { display: flex; gap: 6px; margin-bottom: 10px; }
.star-input button { font-size: 32px; border: 0; background: none; color: var(--line); cursor: pointer; padding: 0; }
.threads { display: grid; }
.thread { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.thread-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.snippet { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.chat-top { grid-template-columns: 44px 1fr 8px; }
.chat-who { display: flex; gap: 10px; align-items: center; min-width: 0; }

}
.chat-booking > div { flex: 1; }
.chat-booking .art.mini { width: 44px; height: 44px; }
.action-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 16px 0; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; }

@media (min-width: 712px) {

}
.bubble.system { align-self: center; background: transparent; border: 0; color: var(--muted); font-size: 12px; text-align: center; max-width: 90%; }
.composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; gap: 8px; padding: 10px 12px calc(10px + var(--safe-b)); background: var(--panel); border-top: 1px solid var(--line); }
.composer input { border-radius: 999px; }
.send { background: var(--accent); color: var(--accent-ink); flex: none; }
.send:hover { background: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.stats span { font-size: 12px; color: var(--muted); }
.stats strong { font-size: 18px; }
.stats small { font-size: 12px; font-weight: 400; color: var(--muted); }
.request { display: grid; gap: 6px; margin-bottom: 10px; }
.request p { margin: 0; }
.property { margin-bottom: 26px; }
.property h2 { margin: 0; font-size: 18px; }
.listing-row, .container-row { padding-left: calc(var(--d) * 22px); }
.container-row { padding-top: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.pkgs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.earn-hero { display: grid; gap: 2px; padding: 18px; border-radius: var(--radius); background: var(--accent-soft); }
.earn-hero span { color: var(--muted); font-size: 13px; }
.earn-hero strong { font-size: 34px; letter-spacing: -.02em; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 200px; margin-top: 18px; padding: 0 2px; }
.bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 11px; color: var(--muted); gap: 4px; min-width: 0; }
.bar i { width: 100%; max-width: 34px; background: var(--accent); border-radius: 6px 6px 2px 2px; opacity: .85; }

}

.price-list { display: grid; gap: 8px; margin-bottom: 16px; }

.check.big { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.checklist { display: grid; gap: 8px; margin-bottom: 18px; }
.preview { max-width: 320px; }
.profile-head { display: flex; gap: 16px; align-items: center; margin: 12px 0 18px; }
.profile-head h1 { margin: 0; font-size: 24px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.person { display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); cursor: pointer; }

.person.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

.menu > * { display: flex; align-items: center; gap: 12px; padding: 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; font-size: 15px; }

.catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.catalog-grid ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }

/* ---------- who's renting it out ---------- */
.owner-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); font-size: 11px; font-weight: 700; background: var(--panel-2); color: var(--ink-secondary); white-space: nowrap; }
.owner-chip.business { background: var(--biz-accent-soft); color: color-mix(in srgb, var(--biz-accent) 70%, var(--ink)); }
.who-section { margin: 8px 0 4px; }
.cat-card .who-does { margin-top: 8px; grid-template-columns: 1fr; }
.cat-card { display: grid; gap: 6px; align-content: start; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.cat-card .owner-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.earn-owner { margin: 10px 0 4px; }

.plan code { overflow-wrap: anywhere; }
.plan pre code { overflow-wrap: normal; }

/* ---------- features & suggested price ---------- */
.feature-box { display: grid; gap: 10px; padding: 12px; border-radius: 12px; background: var(--panel-2); }
.feature-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { position: relative; cursor: pointer; }
.fchip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.fchip span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--radius-full); border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 600; color: var(--ink); transition: background .15s, border-color .15s; }
.fchip span em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--muted); }
.fchip.on span { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.fchip.on span::before { content: '✓'; color: var(--accent); font-weight: 800; }
.fchip.on span em { color: var(--accent); }
.fchip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.size-input { display: flex !important; align-items: center; gap: 10px; font-size: 13px; color: var(--ink); font-weight: 600; }
.size-input input { width: 110px; }
.sugg { display: grid; gap: 4px; justify-items: start; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px dashed var(--accent-border); }
.sugg-table { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 10px 0 4px; }
.sugg-table > div { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent-border); }
.sugg-table > div > span:first-child { font-size: 12px; font-weight: 700; color: var(--muted); }
.sugg-table strong { font-size: 20px; font-family: var(--font-display); }
.inline-select { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; font-size: 14px; font-weight: 600; }
.inline-select select { width: auto; }

/* ---------- sharing & overlap ---------- */
.rules { display: grid; gap: 8px; margin-bottom: 12px; }
.rule { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.rule > span { font-size: 22px; flex: none; }
.rule > div { flex: 1; min-width: 0; }
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.preset { display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); }
.preset p { margin: 0; }
.preset .btn { justify-self: start; }
.preset-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.preset-row select { flex: 1 1 140px; width: auto; }
.preset-row input[type="time"] { width: 140px; flex: 1 1 120px; }

/* ---------- private offers ---------- */
.offer-row .res-meta { flex-wrap: wrap; justify-content: flex-end; }
.offer-from { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.offer-note { margin: 14px 0 4px; padding: 12px 16px; border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; background: var(--accent-soft); font-size: 15px; }
.offer-price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.offer-price strong { font-family: var(--font-display); font-size: 30px; }
.offer-price strong span { font-size: 15px; color: var(--muted); font-weight: 600; }
.offer-list { margin-bottom: 10px; }

/* ---------- renter plans ---------- */
.plan-banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-top: 18px; border-radius: var(--radius); background: var(--accent-soft); border: 1px solid var(--accent-border); }
.plan-banner > div { flex: 1; min-width: 0; display: grid; gap: 2px; }
.plan-emoji { font-size: 28px; }
.great-for { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 0; }
.chip.static { cursor: default; }
.chip.static:hover { transform: none; border-color: var(--line); }

/* ---------- long-term ---------- */
.lt-tab { border-left: 1px solid var(--line) !important; margin-left: 6px; padding-left: 18px !important; color: var(--accent) !important; font-weight: 700 !important; }
.lt-menu { position: absolute; z-index: 45; width: 290px; display: grid; padding: 6px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
.lt-menu a { padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--ink); }
.lt-menu a:hover, .lt-menu a:focus-visible { background: var(--panel-2); }
.lt-menu .lt-all { display: grid; gap: 2px; background: var(--accent-soft); margin-bottom: 4px; }
.lt-menu .lt-all strong { color: var(--accent); }
.lt-head .page-title { margin-bottom: 4px; }
.lt-types { margin: 12px -20px 4px; }
.lt-filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; align-items: end; margin: 10px 0 8px; }
.lt-filters > label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
.lt-filters > label.check-line { display: flex !important; align-self: center; }
.lt-filters .money-input input { width: 100%; }
.lt-card .price { font-size: 17px; }

/* ---------- requirements step ---------- */
.req-card.ready { border-color: var(--ok); }
.req-title { margin-top: -2px; }
.req-list { display: grid; gap: 6px; }
.req { display: flex !important; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; color: var(--ink); }
.req input { width: 20px; height: 20px; margin-top: 1px; flex: none; accent-color: var(--ok); }
.req > span { display: grid; gap: 2px; font-size: 14px; }
.req.on { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }

/* ---------- earnings quiz ---------- */
.quiz-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 18px; }
.quiz-option { display: grid; gap: 4px; text-align: left; padding: 18px; border-radius: var(--radius-lg); border: 2px solid var(--line); background: var(--panel); cursor: pointer; color: var(--ink); transition: transform .15s, border-color .15s, box-shadow .2s; }
.quiz-option:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.quiz-option.on { border-color: var(--accent); background: var(--accent-soft); }
.quiz-option strong { font-size: 16px; font-family: var(--font-display); }
.quiz-icon { font-size: 34px; }
.quiz-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.quiz-row .field { flex: 1 1 220px; }
.freq { margin: 0; }
.quiz-total strong { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.quiz-total small { font-size: 18px; opacity: .8; font-weight: 600; }
.quiz-actions { display: grid; gap: 8px; margin: 18px 0 40px; }
.quiz .earn-row > strong { white-space: nowrap; }

/* ---------- home ---------- */
.welcome-hero { padding: 40px 0 28px; background: radial-gradient(120% 90% at 0% 0%, var(--accent-soft), transparent 60%), radial-gradient(90% 80% at 100% 0%, var(--accent-2-soft), transparent 55%); border-bottom: 1px solid var(--line); }
.welcome-hero h1 { font-size: clamp(32px, 6vw, 52px); line-height: 1.05; margin: 10px 0 14px; letter-spacing: -.03em; }
.eyebrow { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 5px 10px; border-radius: var(--radius-full); }
.welcome-ctas { justify-content: flex-start; margin: 18px 0 14px; gap: 8px; }
.works-with { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
a.promise-card, a.owner-card { color: var(--ink); transition: transform .15s, box-shadow .2s; }
a.promise-card:hover, a.owner-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.marketplace-pitch { margin: 28px 0 12px; display: grid; gap: 4px; }
.marketplace-pitch p { margin: 0; }
.renter-link { margin-bottom: 40px; padding: 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); }
.owner-chip.other { background: var(--event-soft); color: var(--event); }

.welcome .owner-pick { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

.export-card { grid-template-columns: minmax(0, 1fr); }
.code-row { min-width: 0; }
@media (max-width: 520px) { .offer-row { flex-wrap: wrap; } .offer-row .res-meta { width: 100%; justify-content: flex-start; } }

.list-row > .res-meta, .list-row > .arrival-meta { flex: none; }
@media (max-width: 520px) { .list-row.res-row > .res-meta, .list-row.offer-row > .res-meta { flex: 1 0 100%; justify-content: flex-start; } }

/* ---------- tasks & turnovers ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.task-list { display: grid; gap: 8px; }
.task-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.task-row.tight { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.task-row.overdue { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.task-row.done { opacity: .6; }
.task-row.done .task-main strong { text-decoration: line-through; }
.task-check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; color: var(--accent-ink); transition: background .15s, border-color .15s; }
.task-check:hover { border-color: var(--accent); }
.task-row.done .task-check { background: var(--ok); border-color: var(--ok); }
.task-check svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3; }
.task-main { min-width: 0; display: grid; gap: 2px; }
.task-who select { width: auto; max-width: 190px; padding: 7px 10px; font-size: 13px; }
@media (max-width: 560px) { .task-row { grid-template-columns: auto 1fr; } .task-who { grid-column: 2; } .task-who select { max-width: 100%; width: 100%; } }

/* ---------- insights & tools ---------- */
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.insight { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-sm); color: var(--ink); transition: transform .15s, box-shadow .2s; }
.insight:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.insight > div { display: grid; gap: 4px; min-width: 0; }
.insight-icon { font-size: 24px; flex: none; }
.insight.docs { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.insight.event { border-color: color-mix(in srgb, var(--event) 35%, var(--line)); }
.insight.opportunity, .insight.listhere { background: var(--accent-soft); border-color: var(--accent-border); }
.tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 20px; }
.tool { display: grid; gap: 3px; padding: 14px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); color: var(--ink); transition: transform .15s, box-shadow .2s; }
.tool:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.tool > span:first-child { font-size: 22px; }

/* ---------- money ---------- */
.profit-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
.profit-cards .stat-card.good .stat-val { color: var(--ok); }
.profit-cards .stat-card.bad .stat-val { color: var(--bad); }
.earn-table td .muted.small { white-space: normal; }

/* ---------- permits ---------- */
.doc-row.expired .pkg-icon { background: var(--bad-soft); }
.doc-row.soon .pkg-icon { background: var(--warn-soft); }
@media (max-width: 520px) { .doc-row { flex-wrap: wrap; } .list-row.doc-row > .res-meta { flex: 1 0 100%; justify-content: flex-start; } }

/* ---------- templates ---------- */
.tpl { display: grid; gap: 8px; margin-bottom: 10px; }
.tpl input { font-weight: 700; }
.tpl-pick { display: grid; gap: 8px; }
.tpl-chip { background: var(--accent-soft) !important; border-color: var(--accent-border) !important; font-weight: 700; }

@media (max-width: 520px) { .list-row:has(> .res-meta) { flex-wrap: wrap; } .list-row > .res-meta { flex: 1 0 100%; justify-content: flex-start; padding-left: 0; } }

/* ---------- where you're listed ---------- */
.sites-hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: center; padding: 22px; border-radius: var(--radius-lg);
  background: radial-gradient(120% 120% at 0% 0%, var(--accent-soft), transparent 60%), var(--panel); border: 1px solid var(--line); }
.sites-hero .page-title { margin: 8px 0; }
.sites-hero .lead { margin: 0; }
.sites-steps { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 15px; }
.sites-steps li::marker { color: var(--accent); font-weight: 800; }
@media (max-width: 760px) { .sites-hero { grid-template-columns: 1fr; } }
.dist-list { display: grid; gap: 8px; }
.dist-row { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(0, 2fr); gap: 12px; align-items: center; padding: 14px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); }
.dist-row.compact { margin-bottom: 12px; background: var(--panel-2); }
.dist-title { display: grid; gap: 2px; min-width: 0; }
@media (max-width: 680px) { .dist-row { grid-template-columns: 1fr; } }
.site-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.site-chip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 11px; border-radius: var(--radius-full); border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; white-space: nowrap; }
.site-chip.live { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.site-chip.pending { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.site-chip.add { border-style: dashed; color: var(--accent); }
.site-chip.add.top { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.site-chip.add:hover { background: var(--accent-soft); }
.site-chip.off { color: var(--muted); cursor: default; opacity: .75; }
.autopilot { display: grid; gap: 8px; }
.ap-row { display: flex !important; align-items: center; gap: 14px; padding: 14px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); cursor: pointer; color: var(--ink) !important; }
.ap-row > span:nth-child(2) { flex: 1; display: grid; gap: 2px; font-size: 14px; }
.ap-icon { font-size: 22px; }
.account-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.account { display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); }
.account.on { border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.account .btn { justify-self: start; }
.connect-hero { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 10px 0; font-size: 18px; }
.connect-list { margin: 0; padding-left: 18px; }
.kit-field { display: grid; gap: 6px; }
.kit-text { padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); font-size: 14px; white-space: pre-wrap; }

/* ---------- one inbox ---------- */
.inbox-note { margin: 0 0 6px; }
.thread.unread strong { color: var(--ink); }
.unread-dot { color: var(--accent); }
.chat-booking.ext { gap: 10px; }
.chat-booking.ext .small { flex: 1; }

/* ---------- spread the word ---------- */
.best-on { margin-top: 3px; color: var(--ink-secondary); }
.one-account { display: grid; gap: 4px; margin: 14px 0 0; background: var(--accent-soft); border: 1px solid var(--accent-border); }
.live-everywhere { display: grid; gap: 10px; margin-top: 26px; }
.live-everywhere p { margin: 0; }
.le-title { font-size: 20px; font-family: var(--font-display); }
.le-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.le-grid > div { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); }
.live-everywhere .btn { justify-self: start; }
.spread-cta { margin: 18px 0 0; }
.check-line.spread { margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--accent-soft); }

.mine .bubble .muted { color: color-mix(in srgb, var(--accent-ink) 78%, transparent); }

/* ---------- accounts & setup ---------- */
.setup-card { display: grid; gap: 1px; margin: 18px 0 6px; border-radius: var(--radius-lg); overflow: hidden; background: var(--line); border: 1px solid var(--line); }
.setup-step { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--panel); }
.setup-step > div { flex: 1; display: grid; gap: 3px; min-width: 0; }
.setup-num { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--panel-2); font-weight: 800; flex: none; }
.setup-step.done .setup-num { background: var(--ok); color: #fff; }
.progress-bar { height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; max-width: 260px; }
.progress-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
@media (max-width: 520px) { .setup-step { flex-wrap: wrap; } .setup-step .btn { margin-left: 44px; } }
.consent { display: grid; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.consent ul { margin: 0; padding-left: 18px; }
.profile-peek { display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent-border); }
.profile-peek .btn { justify-self: start; padding: 0; }
.acct-btns { justify-content: flex-start; }
.acct-pick { display: grid; }
.activity { display: grid; gap: 6px; }
.act-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; }
.act-row > span { font-size: 18px; }
.act-row > div { display: grid; gap: 2px; }

/* ---------- small screens ---------- */
@media (max-width: 640px) {
  .chips.scroll, .ideas, .hscroll { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
  .page { padding: 12px 16px 24px; }
  .listings-head .btn-row { width: 100%; }
  .listings-head .btn-row .btn { flex: 1; }
  .cal-toolbar { align-items: stretch; }
  .tabbar a { font-size: 10px; }
  .host-metrics strong { font-size: 15px; }
}
  
/* Landing page */
.landing-hero h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.08; letter-spacing: -0.02em; }
.btn.big { padding: 14px 22px; font-size: 16px; }
.hero-note { margin-top: 10px; }
.anyone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.anyone-card { display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none; transition: transform .15s, box-shadow .15s; }
.anyone-card:hover { transform: translateY(-2px); box-shadow: var(--shadow, 0 6px 20px rgba(0,0,0,.08)); }
.anyone-emoji { font-size: 30px; }
.anyone-card strong { font-size: 16px; }
.anyone-a { font-weight: 600; color: var(--accent-2); }
.notice.literally { margin: 14px 0 6px; }
.notice.literally > div { display: flex; flex-direction: column; gap: 4px; }
.both-ways { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 8px 0; }
.bw-card { padding: 16px; border-radius: 16px; background: var(--accent-2-soft); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.bw-card > span { font-size: 26px; }
.bw-card p { margin: 0; }
.bw-eg { font-size: 13px; padding: 8px 10px; border-radius: 10px; background: var(--card); }
.steps-list { padding-left: 20px; display: grid; gap: 8px; }
.cta-band { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 24px 0 16px; }
.cta-band p { margin: 0 0 6px; }

/* Where it'll be listed (wizard) */
.where-box { margin-top: 18px; }
.where-row { padding: 12px 0; border-top: 1px solid var(--line); }
.where-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.where-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.where-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; cursor: pointer; background: var(--card); user-select: none; }
.where-chip input { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); }
.where-chip.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.where-chip.fixed { cursor: default; }
.where-chip.off { opacity: .55; cursor: default; }

// Time helpers. All times are UTC; intervals are half-open [start, end).

const HOUR = 3_600_000;
const DAY = 24 * HOUR;

  const ms = typeof value === 'number' ? value : Date.parse(value);
  if (Number.isNaN(ms)) throw new Error(`Invalid date: ${value}`);
  return ms;
}

  return toMs(aStart) < toMs(bEnd) && toMs(bStart) < toMs(aEnd);
}

function addMonths(ms, n) {
  const d = new Date(ms);
  const day = d.getUTCDate();
  const target = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1,
    d.getUTCHours(), d.getUTCMinutes()));
  const lastDay = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0)).getUTCDate();
  target.setUTCDate(Math.min(day, lastDay));
  return target.getTime();

// Whole months from start to end, plus leftover days.
function monthsBetween(start, end) {
  const s = toMs(start), e = toMs(end);
  let months = 0;
  while (addMonths(s, months + 1) <= e) months++;
  const extraDays = Math.round((e - addMonths(s, months)) / DAY);
  return { months, extraDays };
}

// Each UTC calendar day (as YYYY-MM-DD) that a daily booking covers.
function eachDay(start, end) {
  const days = [];
  for (let t = toMs(start); t < toMs(end); t += DAY) days.push(new Date(t).toISOString().slice(0, 10));
  return days;
}

// How long a booking is, in the units its term is priced in.
function duration(term, start, end) {
  const s = toMs(start), e = toMs(end);
  if (e <= s) throw new Error('End must be after start');
  switch (term) {
    case 'hourly':
      return { hours: Math.ceil((e - s) / HOUR) };
    case 'daily':
      return { days: Math.ceil((e - s) / DAY) };
    case 'weekly': {
      const days = Math.ceil((e - s) / DAY);
      return { weeks: Math.floor(days / 7), extraDays: days % 7 };
    }
    case 'monthly':
    case 'lease':
      return monthsBetween(s, e);
    case 'infrastructure': {
      const { months } = monthsBetween(s, e);

// Bring in a calendar feed from another site. Re-importing the same feed updates it in place:
// new events are added, changed ones updated, and ones no longer in the feed (cancelled there) removed.
function importIcs(db, spaceId, actorId, { platform, ics, url }, { now = new Date().toISOString(), newId }) {

  if (!CHANNELS[platform] || platform === 'everyspace') throw new BookingError('Choose which site this calendar comes from');
  const events = parseIcs(ics);
  db.externalBookings ??= [];
  const horizon = Date.parse(now) - 30 * DAY;
  const existing = db.externalBookings.filter((x) => x.spaceId === spaceId && x.platform === platform && x.source === 'ical');
  const seen = new Set();
  let added = 0, updated = 0, skipped = 0;
  for (const e of events) {
    if (e.cancelled || toMs(iso(e.end)) < horizon) { skipped++; continue; }
    seen.add(e.uid);
    const prev = existing.find((x) => x.uid === e.uid);
    if (prev) {
      if (prev.start !== e.start || prev.end !== e.end || prev.summary !== e.summary) { Object.assign(prev, { start: e.start, end: e.end, summary: e.summary, kind: e.kind }); updated++; }
    } else {
      db.externalBookings.push({ id: newId('xb'), spaceId, hostId: actorId, platform, source: 'ical', uid: e.uid, start: e.start, end: e.end,
        summary: e.summary, kind: e.kind, qty: s.quantity ?? 1, payout: null, guest: '', status: 'confirmed', createdAt: now });
      added++;
    }
  }
  // Missing from the feed = cancelled there. Past stays are kept as history.
  // Safety: a feed that suddenly has no events at all (site outage, wrong link, empty export) never wipes
  // future bookings. We keep them and flag it, since a real calendar rarely empties out in one go.
  const futureKnown = existing.filter((x) => toMs(iso(x.end)) > Date.parse(now));
  const suspicious = events.length === 0 && futureKnown.length > 0;
  const gone = suspicious ? [] : existing.filter((x) => !seen.has(x.uid) && toMs(iso(x.end)) > Date.parse(now));
  db.externalBookings = db.externalBookings.filter((x) => !gone.includes(x));
  // Remember the feed on the linked listing so it can be re-synced.
  const link = (s.externalListings ?? []).find((e) => e.platform === platform);
  if (link) { link.lastSync = now; if (url) link.icalUrl = url; }
  return { added, updated, removed: gone.length, skipped, total: events.length, conflicts: doubleBookings(db, s),
    ...(suspicious ? { warning: `That calendar came back empty, so we kept your ${futureKnown.length} upcoming booking${futureKnown.length === 1 ? '' : 's'} from it. Check the link if they were really cancelled.` } : {}) };
}

// Demo "sync now": demo feeds live in the seed, so a sync just confirms they're current.

  const listings = spaces.map((s) => {
    const channels = [...new Set((s.externalListings ?? []).map((e) => e.platform))];

      status: s.listed === false ? 'manage_only' : s.paused ? 'paused' : 'live',
      channels, lastSync, feeds: (s.externalListings ?? []).filter((e) => e.icalUrl).length,

  const arrivals = [];
  for (const s of spaces) {
    for (const b of busyFor(db, s.id)) {
      if (b.kind === 'block') continue;
      const st = toMs(iso(b.start));

  for (const x of ext) {
    if (x.kind === 'block' || x.payout == null) continue;
    const k = monthKey(x.start);
    byMonth[k] ??= {};
    byMonth[k][x.platform] = money((byMonth[k][x.platform] ?? 0) + x.payout);
    const row = byPlatform[x.platform] ??= { platform: x.platform, name: CHANNELS[x.platform]?.name ?? x.platform, payout: 0, bookings: 0, fees: 0, feeKnown: true };
    row.payout = money(row.payout + x.payout);

    arrivals: arrivals.slice(0, 12),

    conflicts: listings.flatMap((l) => l.conflicts),

      external: ext.filter((x) => x.kind !== 'block' && toMs(iso(x.end)) > nowMs).length,
    },

// Rows for the multi-listing calendar: each of the host's spaces with everything on it in [from, from + days).
