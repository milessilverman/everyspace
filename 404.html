<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  a { color: inherit; }
  li { margin: 6px 0; }
</style>
</head>
<body>
<main>
  <h1>That page isn't here</h1>
  <p>The address may be mistyped, or the page has moved.</p>
  <ul>
    <li><a id="home" href="./">Start with your address</a></li>
    <li><a id="host" href="./host/">Manage your spaces</a></li>
  </ul>
</main>
<script>
// On a GitHub Pages project site, and at www.milessilverman.com/everyspace/ (which shows the same pages), the app lives
// under the first path segment; elsewhere it is at the root.
(function () {
  var seg = location.pathname.split('/')[1];
  var base = seg && (/\.github\.io$/.test(location.hostname) || seg === 'everyspace') ? '/' + seg + '/' : '/';
  document.getElementById('home').href = base;
  document.getElementById('host').href = base + 'host/';
})();
</script>
</body>
</html>
