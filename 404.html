<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
  /* The error page is self-contained at both root and nested URLs. */
  :root {
    --bg: #f6f8f9;
    --surface: #fff;
    --ink: #0f1720;
    --ink-2: #3a4652;
    --line: #e2e8ec;
    --accent: #0f766e;
    --accent-soft: #e6f6f3;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1016;
      --surface: #121a23;
      --ink: #eef3f6;
      --ink-2: #c3ced7;
      --line: #243241;
      --accent: #2dd4bf;
      --accent-soft: rgba(45, 212, 191, .12);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  header, main { width: calc(100% - clamp(40px, 7vw, 80px)); max-width: 68rem; margin-inline: auto; }
  header { display: flex; align-items: center; gap: .625rem; padding-block: 1.375rem .9375rem; font-size: 1.25rem; font-weight: 750; letter-spacing: -.04em; }
  .mark { display: grid; place-items: center; width: 1.875rem; height: 1.875rem; border-radius: .4375rem; background: var(--accent-soft); color: var(--accent); }
  .mark svg { width: 1.375rem; height: 1.375rem; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  main { padding-block: clamp(1.5rem, 5vw, 4rem) 3rem; }
  .message { max-width: 40rem; padding: clamp(1.125rem, 4vw, 2rem); border: 1px solid var(--line); border-radius: .875rem; background: var(--surface); }
  h1 { margin: 0; font-size: clamp(2rem, 4.2vw, 3.125rem); line-height: 1.08; letter-spacing: -.045em; }
  p { margin: .75rem 0 0; color: var(--ink-2); }
  ul { margin: 1.25rem 0 0; padding-inline-start: 1.125rem; }
  li + li { margin-top: .5rem; }
  li::marker { color: var(--accent); }
  a { color: var(--accent); font-weight: 650; text-underline-offset: .2em; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 11h7v9m0-9 4-3 5 4"/></svg></span>
  Everyspace
</header>
<main>
  <div class="message">
    <h1>That page isn't here</h1>
    <p>The address may be mistyped, or the page has moved.</p>
    <ul>
      <li><a id="home" href="./">Start with your address</a></li>
      <li><a id="host" href="./host/">Manage your spaces</a></li>
    </ul>
  </div>
</main>
<script>
// On a GitHub Pages project site, and at www.milessilverman.com/everyspace/ (which shows the same pages), the app lives
// under the first path segment; elsewhere it is at the root.
(function () {
  var seg = location.pathname.split('/')[1];
  var base = seg && (/\.github\.io$/.test(location.hostname) || seg === 'everyspace') ? '/' + seg + '/' : '/';
  document.getElementById('home').href = base;
  document.getElementById('host').href = base + 'host/';
})();
</script>
</body>
</html>
