<title>Everyspace Host Console</title>

<style>
:root {
  --bg: #f6f8f9; --surface: #ffffff; --surface-2: #f1f5f6; --ink: #0f1720; --ink-2: #3a4652; --muted: #66727e;
  --line: #e2e8ec; --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e6f6f3; --accent-line: #b9e6df;
  --ok: #15803d; --ok-soft: #e8f6ec; --warn: #b45309; --warn-soft: #fdf3e3; --bad: #c62828; --bad-soft: #fdecec;
  --shadow: 0 1px 2px rgba(15, 23, 32, .06), 0 4px 16px rgba(15, 23, 32, .05);
  --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --display: 'Outfit', 'Plus Jakarta Sans', sans-serif;
  --s-airbnb: #e0475e; --s-vrbo: #2a5bd7; --s-booking_com: #0b3d91; --s-expedia: #c9a400; --s-swimply: #0ea5e9;
  --s-peerspace: #7c3aed; --s-neighbor: #16a34a; --s-direct: #0f766e; --s-everyspace: #0f766e; --s-other: #64748b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1016; --surface: #121a23; --surface-2: #18222d; --ink: #eef3f6; --ink-2: #c3ced7; --muted: #8a98a6;
    --line: #243241; --accent: #2dd4bf; --accent-ink: #062b28; --accent-soft: rgba(45, 212, 191, .12); --accent-line: rgba(45, 212, 191, .3);
    --ok: #4ade80; --ok-soft: rgba(74, 222, 128, .12); --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .12); --bad: #f87171; --bad-soft: rgba(248, 113, 113, .13);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1016; --surface: #121a23; --surface-2: #18222d; --ink: #eef3f6; --ink-2: #c3ced7; --muted: #8a98a6;
  --line: #243241; --accent: #2dd4bf; --accent-ink: #062b28; --accent-soft: rgba(45, 212, 191, .12); --accent-line: rgba(45, 212, 191, .3);
  --ok: #4ade80; --ok-soft: rgba(74, 222, 128, .12); --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .12); --bad: #f87171; --bad-soft: rgba(248, 113, 113, .13);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.01em; margin: 0; line-height: 1.2; }
h1 { font-size: 26px; } h2 { font-size: 19px; } h3 { font-size: 16px; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
.logo { font-family: var(--display); font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.logo i { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #22d3ee); display: inline-block; }
.logo span { color: var(--muted); font-weight: 500; font-size: 14px; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 8px 12px; border-radius: 9px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 14px; white-space: nowrap; position: relative; }
.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.tabs .dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.who { display: flex; align-items: center; gap: 8px; }
@media (max-width: 760px) {
  .top .wrap { height: auto; flex-wrap: wrap; padding-top: 10px; padding-bottom: 6px; gap: 8px; }
  .tabs { order: 3; width: 100%; margin-left: 0; }
  .who { margin-left: auto; }
  .who .name { display: none; }
}

main { padding: 22px 0 60px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 26px 0 12px; flex-wrap: wrap; }
.section-title:first-child { margin-top: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink); min-height: 38px; }
.btn:hover { border-color: var(--accent-line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-left: 8px; padding-right: 8px; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .55; cursor: progress; }

label.f { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); }
label.f > input, label.f > select { display: block; width: 100%; margin-top: 5px; }
input[type=text], input[type=email], input[type=password], input[type=url], input[type=date], input[type=time], input[type=number], select {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-height: 40px; width: 100%;
}
input:focus, select:focus, .btn:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.accent { background: var(--accent-soft); color: var(--accent); }
.site { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.site::before { content: ''; width: 9px; height: 9px; border-radius: 3px; background: var(--sc, var(--s-other)); }

.callout { border-radius: 12px; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface-2); }
.callout.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.callout.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.callout.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.callout .big { font-family: var(--display); font-size: 18px; font-weight: 700; margin-bottom: 4px; }

.list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.list > .item { padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.list > .item + .item { border-top: 1px solid var(--line); }
.item .grow { flex: 1 1 220px; min-width: 0; }

.steps { counter-reset: s; display: grid; gap: 12px; }
.step { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); }
.step h4 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.step h4::before { counter-increment: s; content: counter(s); width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
.copy { display: flex; gap: 8px; }
.copy input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

/* calendar strip */
.cal { display: grid; grid-template-columns: 150px 1fr; gap: 6px 10px; align-items: center; }
.cal .days { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; }
.cal .d { height: 26px; border-radius: 4px; background: var(--surface-2); position: relative; }
.cal .d.b { background: var(--sc); }
.cal .d.p { background: linear-gradient(to top, var(--sc) 45%, var(--surface-2) 45%); }
.cal .d.k { background: repeating-linear-gradient(135deg, var(--line), var(--line) 3px, var(--surface-2) 3px, var(--surface-2) 6px); }
.cal .d.h { outline: 2px dashed var(--warn); outline-offset: -2px; }
.cal .d.x { outline: 2px solid var(--bad); outline-offset: -2px; }
.cal .d.t::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.cal .hdr { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.25; }
.cal .hdr b { color: var(--ink-2); font-weight: 700; }
.cal .label { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 760px) { .cal { grid-template-columns: 1fr; } .cal .days .hdr:nth-child(odd) { visibility: hidden; } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* auth */
.auth { max-width: 420px; margin: 8vh auto; }
.auth .card { padding: 26px; }
.hero-note { display: grid; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
.hero-note li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); }
.hero-note li::before { content: '✓'; color: var(--accent); font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); z-index: 50; max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); color: #fff; }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); }
details.more > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13px; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
.kpi { font-family: var(--display); font-size: 28px; font-weight: 700; }
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10, 15, 20, .45); }
dialog .dh { padding: 18px 20px 0; } dialog .db { padding: 16px 20px; } dialog .df { padding: 0 20px 18px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
</style>
</head>

const ago = (iso) => {

let toastTimer;

const SESSION_ENDED = 'Your session ended. Please sign in again.';
const OFFLINE = "Couldn't reach Everyspace. Check your connection and try again.";
async function callFn(name, body) {
  const { data: { session } } = await sb.auth.getSession();
  let res;
  try {
    res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: `Bearer ${session?.access_token ?? ANON_KEY}` }, body: JSON.stringify(body),
    });
  } catch { return { status: 0, error: OFFLINE }; }
  const data = await res.json().catch(() => ({}));
  const out = { status: res.status, ...data };
  // The service answered with something that is not one of our messages (a gateway 401/404/5xx): say so plainly, never pass its text on.
  if (!res.ok && !(typeof data.error === 'string' && data.error) && !data.step) {
    out.error = res.status === 401 ? SESSION_ENDED : res.status === 404 ? "This part of Everyspace isn't switched on yet, so it can't be used right now. Nothing was changed." : 'Everyspace had a problem. Try again in a minute.';
  }
  if (res.status === 401) out.expired = true;
  return out;
}
const isAuthError = (e) => e?.code === 'PGRST301' || e?.status === 401 || /jwt (is )?expired|invalid jwt|not authenticated/i.test(e?.message ?? '');
const fail = (error) => Object.assign(new Error(/failed to fetch|networkerror|load failed/i.test(error.message ?? '') ? OFFLINE : prettyError(error.message)), { code: error.code, status: error.status });
const must = ({ data, error }) => { if (error) throw fail(error); return data; };

const RESERVATION_LIMIT = 1000;
const notify = (text, ok = false) => { S.notice = text ? { text, ok } : null; };
function showAuth() { $('#app').innerHTML = authView(); const m = $('#authMsg'); if (m && S.notice) { m.style.color = S.notice.ok ? 'var(--ok)' : 'var(--bad)'; m.textContent = S.notice.text; } }
const resetData = () => Object.assign(S, { profile: null, tab: 'today', properties: [], spaces: [], listings: [], imports: [], feeds: [], reservations: [], holds: [], alerts: [], conflicts: [], ledger: [], verdict: null, openSpace: null, ready: false, loadError: null, cut: {} });
const tzOf = (spaceId) => validTz(S.properties.find((p) => p.id === S.spaces.find((s) => s.id === spaceId)?.property_id)?.timezone ?? 'America/Los_Angeles');
const spaceTitle = (id) => S.spaces.find((s) => s.id === id)?.title ?? 'Space';
function descendants(spaceId) { const out = new Set(); let grew = true; while (grew) { grew = false; for (const s of S.spaces) if ((s.parent_space_id === spaceId || out.has(s.parent_space_id)) && !out.has(s.id)) { out.add(s.id); grew = true; } } return out; }
const related = (spaceId) => { const f = new Set([spaceId, ...descendants(spaceId)]); for (let p = S.spaces.find((s) => s.id === spaceId)?.parent_space_id, n = 0; p && n < 20; n++) { f.add(p); p = S.spaces.find((s) => s.id === p)?.parent_space_id; } return f; };
const liveListing = (l) => ['pending', 'live'].includes(l.status);
const doorsFor = (spaceId) => S.listings.filter((l) => l.booking_mode === 'instant' && liveListing(l) && related(spaceId).has(l.space_id));

async function loadAll() {
  const since = new Date(Date.now() - 86400000).toISOString();
  const [profile, properties, spaces, listings, imports, feeds, reservations, holds, alerts, conflicts, ledger] = await Promise.all([
    sb.from('profiles').select('id, full_name').eq('id', S.user.id).maybeSingle(),
    sb.from('properties').select('id, title, address, city, timezone, created_at').order('created_at'),
    sb.from('spaces').select('id, property_id, parent_space_id, category, title, quantity, created_at').order('created_at'),
    sb.from('channel_listings').select('id, space_id, channel, status, booking_mode, url, created_at').order('created_at'),
    sb.from('calendar_imports').select('id, space_id, channel, url, last_synced_at, last_status, last_error, event_count'),
    sb.from('calendar_feeds').select('id, space_id, for_channel, token, last_fetched_at'),
    sb.from('reservations').select('id, space_id, channel, kind, status, starts_at, ends_at, all_day, guest_name, summary, payout_cents').eq('status', 'confirmed').gte('ends_at', since).order('starts_at').limit(RESERVATION_LIMIT),
    sb.from('booking_holds').select('id, space_id, channel, guest_name, starts_at, ends_at, all_day, status, released_reason, expires_at, verified_at, created_at').order('created_at', { ascending: false }).limit(60),
    sb.from('booking_alerts').select('id, space_id, kind, channel, message, created_at, reservation:reservations(channel, starts_at, ends_at, all_day, guest_name)').is('resolved_at', null).order('created_at', { ascending: false }),
    sb.from('conflicts').select('id, space_id, detected_at, a:reservations!conflicts_a_reservation_id_fkey(channel, starts_at, ends_at, all_day), b:reservations!conflicts_b_reservation_id_fkey(channel, starts_at, ends_at, all_day)').is('resolved_at', null),
    sb.from('earnings_ledger').select('id, period, gross_cents, attributed, share_pct, fee_cents, reservation:reservations(channel, space_id, starts_at, ends_at)').order('period', { ascending: false }),
  ]);
  for (const r of [properties, spaces, listings, imports, feeds, reservations, holds, alerts, conflicts, ledger]) if (r.error) throw fail(r.error);
  Object.assign(S, { cut: { reservations: (reservations.data ?? []).length >= RESERVATION_LIMIT, ledger: (ledger.data ?? []).length >= RESERVATION_LIMIT }, profile: profile.data, properties: properties.data, spaces: spaces.data, listings: listings.data, imports: imports.data, feeds: feeds.data,
    reservations: reservations.data, holds: holds.data, alerts: alerts.data, conflicts: conflicts.data, ledger: ledger.data });
}
async function refresh(quiet = true) {
  try { await loadAll(); S.ready = true; S.loadError = null; render(); }
  catch (e) {
    console.warn('load failed', e);
    if (isAuthError(e)) return endSession();
    if (!S.ready) { S.loadError = e.message || 'Something went wrong.'; render(); } // first load: show the problem and a way to retry, never a blank page
    else if (!quiet) toast(e.message, true);
  }
}

function setupGaps() { // what's still needed for the no-double-booking promise, per space
  const gaps = [];
  if (!S.properties.length) gaps.push({ msg: 'Add your first place to get started.', go: 'places' });
  for (const sp of S.spaces) {
    const ls = S.listings.filter((l) => l.space_id === sp.id && liveListing(l));
    if (!ls.length) { gaps.push({ msg: `“${sp.title}”: add the sites it's listed on.`, go: 'places', space: sp.id }); continue; }
    for (const l of ls) {
      const imp = S.imports.find((i) => i.space_id === sp.id && i.channel === l.channel);
      const feed = S.feeds.find((f) => f.space_id === sp.id && f.for_channel === l.channel);
      if (!imp) gaps.push({ msg: `“${sp.title}” on ${siteName(l.channel)}: add ${siteName(l.channel)}'s calendar link (step 1).`, go: 'places', space: sp.id });
      else if (imp.last_status === 'error') gaps.push({ msg: `“${sp.title}” on ${siteName(l.channel)}: couldn't read the calendar. ${syncWords(imp.last_error)}`, go: 'places', space: sp.id, bad: true });
      if (feed && !feed.last_fetched_at) gaps.push({ msg: `“${sp.title}” on ${siteName(l.channel)}: paste the Everyspace link into ${siteName(l.channel)} (step 2). It hasn't read it yet.`, go: 'places', space: sp.id });
      if (l.booking_mode === 'instant' && !VERIFIABLE.has(l.channel)) gaps.push({ msg: `“${sp.title}”: ${siteName(l.channel)} takes instant bookings, but its calendar can't be checked by link. Switch it to request-to-book, or make Airbnb or Vrbo the instant site.`, go: 'places', space: sp.id, bad: true });
    }
  }
  return gaps;
}

function verdictCard(v) {

function calendarView() {
  const N = window.innerWidth < 760 ? 14 : 28;
  if (!S.spaces.length) return `<div class="section-title"><h1>Calendar</h1></div><div class="card flat empty">Add a place and its spaces first.<div style="margin-top:12px"><button class="btn primary" data-tab="places">Go to Places & sites</button></div></div>`;
  const now = Date.now();
  const byProp = S.properties.map((p) => {
    const tz = validTz(p.timezone); const today = localDay(now, tz);
    const days = Array.from({ length: N }, (_, i) => addDays(today, i));
    const mon = (d) => new Date(`${d}T12:00:00Z`).toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' });
    const hdr = days.map((d, i) => { const n = new Date(`${d}T12:00:00Z`).getUTCDate(); return `<div class="hdr">${i === 0 || n === 1 ? `<b>${mon(d)}</b><br>` : '<br>'}${n}</div>`; }).join('');
    const rows = S.spaces.filter((s) => s.property_id === p.id).map((s) => {
      const fam = related(s.id);
      const cells = days.map((d) => {
        const a = zoned(d, '00:00', tz), b = zoned(addDays(d, 1), '00:00', tz);
        const hits = S.reservations.filter((r) => fam.has(r.space_id) && Date.parse(r.starts_at) < b && Date.parse(r.ends_at) > a);
        const book = hits.filter((r) => r.kind === 'booking'); const block = hits.find((r) => r.kind !== 'booking');
        const held = S.holds.some((h) => fam.has(h.space_id) && ['holding', 'safe'].includes(h.status) && Date.parse(h.expires_at) > now && Date.parse(h.starts_at) < b && Date.parse(h.ends_at) > a);
        const full = book.filter((r) => !isHourly(r)); const part = book.length > full.length;
        // A space with several identical units (quantity > 1) is only double booked when more bookings overlap than there are units.
        const qty = s.quantity > 1 ? s.quantity : 1;
        const stacked = book.reduce((m, r) => Math.max(m, book.filter((q) => Date.parse(q.starts_at) <= Date.parse(r.starts_at) && Date.parse(q.ends_at) > Date.parse(r.starts_at)).length), 0);
        const clash = qty > 1 ? stacked > qty : book.length > 1 && (!part || book.some((r, i) => book.some((q, j) => j > i && Date.parse(r.starts_at) < Date.parse(q.ends_at) && Date.parse(q.starts_at) < Date.parse(r.ends_at))));
        const cls = ['d', full.length ? 'b' : part ? 'p' : block ? 'k' : '', held ? 'h' : '', clash ? 'x' : '', d === today ? 't' : ''].join(' ');
        const label = `${d}: ${book.length ? book.map((r) => siteName(r.channel) + (isHourly(r) ? ` ${timeRange(r.starts_at, r.ends_at, tz)}` : '')).join(' + ') : block ? 'closed' : 'open'}${part && !full.length ? ' (partly booked)' : ''}${held ? ', request held' : ''}`;
        return `<div class="${cls}" style="${book[0] ? siteVar((full[0] ?? book[0]).channel) : ''}" title="${esc(label)}" aria-label="${esc(label)}"></div>`;
      }).join('');
      return `<div class="label">${esc(s.title)}</div><div class="days" style="--n:${N}">${cells}</div>`;
    }).join('');
    return `<div class="card" style="margin-bottom:14px"><h2 style="margin-bottom:12px">${esc(p.title)}</h2><div class="cal"><div></div><div class="days" style="--n:${N}">${hdr}</div>${rows}</div></div>`;
  }).join('');
  const used = [...new Set(S.reservations.filter((r) => r.kind === 'booking').map((r) => r.channel))];
  const list = S.reservations.filter((r) => Date.parse(r.ends_at) > now).slice(0, 40);
  return `<div class="section-title"><div><h1>Calendar</h1><p class="muted small" style="margin:4px 0 0">Next ${N} days across every site. A booking on the whole home also shows on the rooms inside it.</p><p class="tiny muted" style="margin:4px 0 0" data-note="links">Calendar links share availability only. Other sites re-read them every few hours, not instantly.</p></div><button class="btn" data-act="syncall">Sync now</button></div>
    <div class="stack" style="margin-bottom:14px">${syncBanners()}</div>
    ${cutNote('the calendar')}
    ${byProp}
    <div class="legend">${used.map((c) => `<span><i style="background:var(--s-${c in { airbnb: 1, vrbo: 1, booking_com: 1, expedia: 1, swimply: 1, peerspace: 1, neighbor: 1, direct: 1, everyspace: 1 } ? c : 'other'})"></i>${siteName(c)}</span>`).join('')}
      <span><i style="background:repeating-linear-gradient(135deg,var(--line),var(--line) 3px,var(--surface-2) 3px,var(--surface-2) 6px)"></i>Closed</span>
      <span><i style="background:linear-gradient(to top,var(--accent) 45%,var(--surface-2) 45%)"></i>Partly booked (by the hour)</span>
      <span><i style="outline:2px dashed var(--warn);outline-offset:-2px;background:var(--surface-2)"></i>Request held</span>
      <span><i style="outline:2px solid var(--bad);outline-offset:-2px;background:var(--surface-2)"></i>Double booked</span></div>
    <div class="section-title"><h2>Upcoming</h2></div>
    ${list.length ? `<div class="list">${list.map((r) => `<div class="item"><span class="site" style="${siteVar(r.channel)}">${siteName(r.channel)}</span><div class="grow"><div style="font-weight:600">${esc(when(r.starts_at, r.ends_at, r.all_day, tzOf(r.space_id)))}</div><div class="small muted">${esc(spaceTitle(r.space_id))}${r.guest_name ? ` · ${esc(r.guest_name)}` : ''}</div></div><span class="chip ${r.kind === 'booking' ? 'accent' : ''}">${r.kind === 'booking' ? 'Booking' : 'Closed'}</span></div>`).join('')}</div>` : '<div class="card flat empty">Nothing booked yet.</div>'}`;
}

function siteRow(s, l, openSpace) {

  const reading = feed?.last_fetched_at ? `<span class="chip ok">${siteName(l.channel)} reads Everyspace</span>` : '<span class="chip warn">Paste Everyspace link</span>';
  const key = `${s.id}:${l.channel}`;
  return `<div class="item" style="display:block">
    <div class="row between"><div class="row"><span class="site" style="${siteVar(l.channel)}">${siteName(l.channel)}</span>${status}${reading}</div>
      <div class="seg" role="group" aria-label="How ${esc(siteName(l.channel))} takes bookings">

        <div class="step"><h4>${siteName(l.channel)} → Everyspace</h4><div class="small muted" style="margin-bottom:8px">${esc(h.out)}</div>
          <form class="copy" data-form="import" data-space="${s.id}" data-channel="${l.channel}"><input type="url" name="url" placeholder="https://… (${esc(siteName(l.channel))} calendar link)" value="${esc(imp?.url ?? '')}" required aria-label="${esc(siteName(l.channel))} calendar link"><button class="btn sm primary" type="submit">${imp ? 'Save & sync' : 'Connect'}</button></form>
          ${imp?.last_status === 'error' ? `<div class="small" style="color:var(--bad);margin-top:6px">${esc(syncWords(imp.last_error))}</div>` : imp?.last_synced_at ? `<div class="tiny muted" style="margin-top:6px">Read ${imp.event_count ?? 0} dates · ${ago(imp.last_synced_at)}</div>` : ''}</div>
        <div class="step"><h4>Everyspace → ${siteName(l.channel)}</h4><div class="small muted" style="margin-bottom:8px">${esc(h.in)} This link shows everything booked on your other sites as “Not available”, never guest names or prices.</div>
          ${feed ? `<div class="copy"><input type="text" readonly value="${esc(feedUrl(feed.token))}" aria-label="Everyspace calendar link for ${esc(siteName(l.channel))}"><button class="btn sm" data-act="copy" data-text="${esc(feedUrl(feed.token))}">Copy</button></div>
            <div class="tiny muted" style="margin-top:6px">${feed.last_fetched_at ? `${siteName(l.channel)} last read it ${ago(feed.last_fetched_at)}` : `Waiting for ${siteName(l.channel)} to read it. Sites check every few hours.`}</div>` : `<button class="btn sm" data-act="makefeed" data-space="${s.id}" data-channel="${l.channel}">Create link</button>`}</div>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn sm ghost danger" data-act="delsite" data-id="${l.id}">Remove ${siteName(l.channel)} from “${esc(s.title)}”</button></div>
    </details>
  </div>`;
}

function earningsView() {

  for (const r of S.ledger) { const m = months.get(r.period) ?? { gross: 0, attributed: 0, fee: 0, rows: [] }; m.gross += r.gross_cents; if (r.attributed) m.attributed += r.gross_cents; m.fee += r.fee_cents; m.rows.push(r); months.set(r.period, m); }
  const fmtMonth = (p) => new Date(`${p}T12:00:00Z`).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  return `<div class="section-title"><div><h1>Earnings</h1><p class="muted small" style="margin:4px 0 0">Finished stays are added once a day.</p></div></div>
    <div class="callout"><div class="big">How Everyspace gets paid</div>
      <div class="small">Only on money Everyspace brings you: spaces or sites it added for you, and bookings through Everyspace. Never on Airbnb bookings you already had. Each month it's 10% until the fee reaches $30, then 3% on the rest. For example, $1,000 of extra bookings in a month comes to $51. No monthly fee.</div></div>
    ${months.size ? [...months].map(([p, m]) => `<div class="section-title"><h2>${fmtMonth(p)}</h2><span class="small muted">Everyspace fee ${money(m.fee)}</span></div>
      <div class="grid2"><div class="card flat"><div class="small muted">Total from finished stays</div><div class="kpi">${money(m.gross)}</div></div>
        <div class="card flat"><div class="small muted">Extra, brought in by Everyspace</div><div class="kpi">${money(m.attributed)}</div></div>
        <div class="card flat"><div class="small muted">You keep</div><div class="kpi">${money(m.gross - m.fee)}</div></div></div>
      <div class="list" style="margin-top:12px">${m.rows.map((r) => `<div class="item"><span class="site" style="${siteVar(r.reservation?.channel)}">${siteName(r.reservation?.channel)}</span><div class="grow small">${esc(spaceTitle(r.reservation?.space_id))} · ${esc(r.reservation ? when(r.reservation.starts_at, r.reservation.ends_at, true, tzOf(r.reservation.space_id)) : '')}</div><span class="small">${money(r.gross_cents)}</span>${r.attributed ? `<span class="chip accent">fee ${money(r.fee_cents)}</span>` : '<span class="chip">no fee</span>'}</div>`).join('')}</div>`).join('')
      : '<div class="card flat empty" style="margin-top:14px">No finished stays with a known payout yet. Calendar links carry dates, not prices, so a stay only appears here once its payout is known.</div>'}${S.cut.ledger ? '<div class="callout warn small" data-cut="ledger" style="margin-top:14px">Only the most recent 1,000 earnings rows are loaded, so older months may be incomplete.</div>' : ''}`;
}

// ------------------------------------------------------------------ actions
async function busy(btn, fn) { if (btn) btn.disabled = true; try { return await fn(); } catch (e) { if (isAuthError(e)) await endSession(); else toast(e.message ? prettyError(e.message) : 'Something went wrong.', true); } finally { if (btn) btn.disabled = false; } }
async function syncSpace(spaceId) {
  const r = await callFn('calendar-sync', spaceId ? { space_id: spaceId } : {});
  if (r.expired) { await endSession(); return; }
  if (r.error) throw new Error(syncWords(r.error));
  const bad = (r.results ?? []).filter((x) => !x.ok);
  await loadAll(); render();
  if (bad.length) toast(`Couldn't read ${bad.length} calendar${bad.length > 1 ? 's' : ''}. ${syncWords(bad[0].error)}`, true);
  else toast(r.synced ? `Synced ${r.synced} calendar${r.synced > 1 ? 's' : ''}.` : 'No calendar links to sync yet.');
}
async function check(holdId) {
  const v = await callFn('booking-guard', { action: 'check', hold_id: holdId });
  if (v.expired) { await endSession(); return; }
  if (v.error && !v.step) throw new Error(v.error);
  const h = S.holds.find((x) => x.id === holdId);
  S.verdict = { ...v, channel: h?.channel }; S.tab = 'requests';
  await loadAll(); render(); $('#verdict')?.focus();
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab], [data-act]');
  if (!t) return;
  if (t.dataset.tab && !t.dataset.act) {
    e.preventDefault(); S.tab = t.dataset.tab; if (t.dataset.space) S.openSpace = t.dataset.space; render();
    if (t.dataset.space) $(`#space-${t.dataset.space}`)?.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
    return;
  }
  const a = t.dataset.act;
  if (a === 'authmode') { e.preventDefault(); S.authMode = t.dataset.mode || (S.authMode === 'signup' ? 'signin' : 'signup'); notify(null); render(); }
  else if (a === 'signout') {
    e.preventDefault(); S.signingOut = true;
    try { const { error } = await sb.auth.signOut(); if (error) await sb.auth.signOut({ scope: 'local' }); } catch { await sb.auth.signOut({ scope: 'local' }).catch(() => {}); }
    S.signingOut = false;
  }
  else if (a === 'retry') { S.loadError = null; render(); await refresh(false); }
  else if (a === 'close') { closeDialog(); }
  else if (a === 'newreq') { newRequestDialog(); }
  else if (a === 'reqtype') {
    const d = dlg(); d.dataset.kind = t.dataset.v;
    d.querySelectorAll('[data-act="reqtype"]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
    d.querySelectorAll('[data-kind]').forEach((f) => { f.hidden = f.dataset.kind !== t.dataset.v; f.querySelectorAll('input').forEach((i) => { i.required = !f.hidden; }); });
  }
  else if (a === 'dismiss') { await busy(t, async () => { must(await sb.rpc('dismiss_alert', { p_alert: t.dataset.id })); await loadAll(); render(); }); }
  else if (a === 'syncall') { await busy(t, () => syncSpace(null)); }
  else if (a === 'check') { await busy(t, () => check(t.dataset.id)); }
  else if (a === 'release') {
    if (!confirm('Mark this request as declined? The held dates are freed for other requests.')) return;
    await busy(t, async () => { const r = await callFn('booking-guard', { action: 'release', hold_id: t.dataset.id }); if (r.expired) { await endSession(); return; } if (r.error) throw new Error(r.error); S.verdict = null; await loadAll(); render(); toast('Request released.'); });
  }
  else if (a === 'addplace') { openDialog(`<div class="dh"><h2>Add a place</h2></div><div class="db">${placeForm()}</div><div class="df"><button class="btn" data-act="close">Cancel</button></div>`); }
  else if (a === 'addspace') { addSpaceDialog(t.dataset.id); }
  else if (a === 'addsite') { addSiteDialog(t.dataset.id); }
  else if (a === 'mode') {
    await busy(t, async () => { must(await sb.from('channel_listings').update({ booking_mode: t.dataset.mode }).eq('id', t.dataset.id)); await loadAll(); render();
      toast(t.dataset.mode === 'instant' ? 'Saved. Make sure Instant Book is on for this site, and off on the others.' : 'Saved. Make sure Instant Book is off on this site.'); });
  }
  else if (a === 'copy') { try { await navigator.clipboard.writeText(t.dataset.text); toast('Link copied.'); } catch { t.previousElementSibling?.select(); toast('Select the link and copy it.'); } }
  else if (a === 'makefeed') { await busy(t, async () => { must(await sb.from('calendar_feeds').insert({ space_id: t.dataset.space, for_channel: t.dataset.channel })); await loadAll(); render(); }); }
  else if (a === 'delsite' || a === 'delspace' || a === 'delplace') {
    const what = { delsite: 'this site from the space', delspace: 'this space, its sites and its bookings', delplace: 'this place and everything in it' }[a];
    if (!confirm(`Remove ${what}? This can't be undone.`)) return;
    const table = { delsite: 'channel_listings', delspace: 'spaces', delplace: 'properties' }[a];
    await busy(t, async () => {
      if (a === 'delsite') { const l = S.listings.find((x) => x.id === t.dataset.id); if (l) { must(await sb.from('calendar_imports').delete().eq('space_id', l.space_id).eq('channel', l.channel)); must(await sb.from('calendar_feeds').delete().eq('space_id', l.space_id).eq('for_channel', l.channel)); } }
      must(await sb.from(table).delete().eq('id', t.dataset.id)); await loadAll(); render(); toast('Removed.');
    });
  }
});

document.addEventListener('change', (e) => {
  if (e.target.matches('[data-act="reqspace"]')) { const sel = dlg().querySelector('select[name="channel"]'); sel.innerHTML = dlg()._siteOpts(e.target.value); }
});

document.addEventListener('submit', async (e) => {
  const f = e.target; const kind = f.dataset.form;
  if (f.id === 'authForm' || f.id === 'resetForm' || f.id === 'newPwForm') {
    e.preventDefault(); const fd = new FormData(f); const msg = $('#authMsg'); const btn = f.querySelector('button[type=submit]');
    if (btn.disabled) return; // already sending
    const say = (text, ok = false) => { msg.style.color = ok ? 'var(--ok)' : 'var(--bad)'; msg.textContent = text; };
    const val = (n) => String(fd.get(n) ?? '');
    const email = val('email').trim(); const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    // Check what the host typed before asking the server anything, so each mistake gets a plain sentence.
    if (f.id !== 'newPwForm' && !emailOk) return say(email ? 'That email address doesn\'t look right.' : 'Enter your email.');
    if (f.id === 'authForm' && S.authMode === 'signup' && !val('name').trim()) return say('Enter your name.');
    if (f.id === 'authForm' && !val('password')) return say('Enter your password.');
    if ((f.id === 'newPwForm' || (f.id === 'authForm' && S.authMode === 'signup')) && val('password').length < 8) return say('Use at least 8 characters for your password.');
    if (f.id === 'newPwForm' && val('password') !== val('password2')) return say("The two passwords don't match.");
    btn.disabled = true; msg.textContent = ''; notify(null);
    const authText = (err) => /confirm/i.test(err.message) ? 'Please confirm your email first (check your inbox), then sign in.'
      : /failed to fetch|networkerror|load failed|retryable/i.test(err.message) || err.name === 'AuthRetryableFetchError' ? OFFLINE
      : /invalid login/i.test(err.message) ? 'That email and password don\'t match. Check them and try again, or use “Forgot your password?”.'
      : /rate limit|too many|only request this once/i.test(err.message) ? 'Too many tries. Wait a minute and try again.' : err.message;
    try {
      if (f.id === 'authForm') {
        if (S.authMode === 'signup') {
          const { data, error } = await sb.auth.signUp({ email, password: val('password'), options: { data: { full_name: val('name').trim() }, emailRedirectTo: pageUrl() } });
          if (error) throw error;
          if (!data.session) { S.authMode = 'signin'; notify('Check your email to confirm your account, then sign in here.', true); showAuth(); }
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password: val('password') });
          if (error) throw error;
        }
      } else if (f.id === 'resetForm') {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: pageUrl() });
        if (error) throw error;
        say('If that email has an account, a reset link is on its way. Open it on this device.', true);
      } else {
        const { error } = await sb.auth.updateUser({ password: val('password') });
        if (error) throw error;
        S.authMode = 'signin'; S.recovering = false; toast('Password saved.'); S.ready ? render() : await refresh(false);
      }
    } catch (err) { const m = $('#authMsg'); if (m) { m.style.color = 'var(--bad)'; m.textContent = authText(err); } }
    finally { btn.disabled = false; }
    return;
  }
  if (!kind) return;
  e.preventDefault();
  const fd = new FormData(f); const btn = f.querySelector('button[type=submit]');
  await busy(btn, async () => {
    if (kind === 'place') {
      must(await sb.from('properties').insert({ host_id: S.user.id, title: fd.get('title').trim(), address: fd.get('address')?.trim() || null, city: fd.get('city')?.trim() || null }));
      closeDialog(); await loadAll(); render(); toast('Place added. Now add what you rent there.');
    } else if (kind === 'space') {
      const row = must(await sb.from('spaces').insert({ property_id: f.dataset.property, title: fd.get('title').trim(), category: fd.get('category'), parent_space_id: fd.get('parent') || null, quantity: Number(fd.get('quantity') || 1) }).select('id').single());
      closeDialog(); S.openSpace = row.id; await loadAll(); render(); toast('Space added. Now add the sites it\'s listed on.');
    } else if (kind === 'site') {
      const channel = fd.get('channel'); const space_id = f.dataset.space;
      const { error } = await sb.from('channel_listings').insert({ space_id, channel, status: 'live', booking_mode: fd.get('mode') });
      if (error) { $('#siteMsg').textContent = prettyError(error.message); return; }
      const feed = await sb.from('calendar_feeds').insert({ space_id, for_channel: channel });
      closeDialog(); S.openSpace = space_id; await loadAll(); render();
      if (feed.error) toast(`${siteName(channel)} added, but its Everyspace link couldn't be created. Tap “Create link” below.`, true);
      else toast(`${siteName(channel)} added. Connect its calendar below.`);
    } else if (kind === 'import') {
      const url = String(fd.get('url')).trim().replace(/^webcal:\/\//i, 'https://'); // sites often hand out webcal:// links; they are https underneath
      let ok = /^https:\/\//i.test(url); try { ok = ok && !!new URL(url).hostname.includes('.'); } catch { ok = false; }
      if (!ok) throw new Error('That doesn\'t look like a calendar link. It should start with https:// and be copied from the site\'s calendar settings.');
      must(await sb.from('calendar_imports').upsert({ space_id: f.dataset.space, channel: f.dataset.channel, url }, { onConflict: 'space_id,channel' }));
      try { await syncSpace(f.dataset.space); }
      catch (err) { if (isAuthError(err)) throw err; await loadAll(); render(); throw new Error(`Link saved, but it couldn't be read yet. ${err.message}`); }
    } else if (kind === 'hold') {
      const space_id = fd.get('space_id'); const tz = tzOf(space_id); const nights = dlg().dataset.kind !== 'hours';
      const body = nights
        ? { action: 'hold', space_id, channel: fd.get('channel'), start: fd.get('start'), end: fd.get('end'), all_day: true, guest: fd.get('guest') || undefined }
        : { action: 'hold', space_id, channel: fd.get('channel'), start: new Date(zoned(fd.get('day'), fd.get('from'), tz)).toISOString(), end: new Date(zoned(fd.get('day'), fd.get('to'), tz)).toISOString(), all_day: false, guest: fd.get('guest') || undefined };
      if (nights && body.end <= body.start) { $('#holdMsg').textContent = 'Check-out has to be after check-in.'; return; }
      if (!nights && body.end <= body.start) { $('#holdMsg').textContent = 'The end time has to be after the start.'; return; }
      const v = await callFn('booking-guard', body);
      if (v.error && !v.step) { $('#holdMsg').textContent = prettyError(v.error); return; }
      S.verdict = { ...v, channel: body.channel }; closeDialog(); S.tab = 'requests'; await loadAll(); render(); $('#verdict')?.focus();
    }
  });
});

// ------------------------------------------------------------------ start
function start() {
  // A link from an email can come back with an error in the address (expired or already used): say so instead of a bare sign-in form.
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get('error_code') || hp.get('error')) notify(/expired|invalid/i.test(`${hp.get('error_code')} ${hp.get('error_description')}`) ? 'That email link has expired or was already used. Request a new one below.' : "That email link couldn't be used. Try again.");
  if (hp.get('error_code') === 'otp_expired') S.authMode = 'reset';
  sb.auth.onAuthStateChange((event, session) => {
    const was = S.user?.id; S.user = session?.user ?? null;
    if (event === 'PASSWORD_RECOVERY') { S.recovering = true; S.authMode = 'newpw'; }
    if (!S.user) {
      if (was && !S.signingOut) notify(SESSION_ENDED); // signed out by the server (expired or revoked), not by the host
      S.recovering = false; resetData(); render(); return;
    }
    if (S.recovering) { render(); return; }
    if (S.user.id !== was) { notify(null); S.ready = false; render(); refresh(false); }
  });
  setInterval(() => {
    if (!S.user || S.recovering || document.hidden || dlg().open) return;
    // Don't redraw under someone who is typing: it would wipe what they've entered.
    if ([...document.querySelectorAll('#app input:not([type=radio]):not([type=checkbox])')].some((i) => i === document.activeElement || (i.type !== 'hidden' && i.value !== i.defaultValue))) return;
    refresh();
  }, 60000);
}
if (sb) start();
else $('#app').innerHTML = '<div class="wrap"><div class="auth"><div class="card"><h1 style="font-size:22px">Couldn\'t load</h1><p class="muted small" role="alert">Part of this page could not be downloaded, so sign-in is unavailable. Check your connection and reload the page.</p></div></div></div>';
// onAuthStateChange fires INITIAL_SESSION on load, which renders the sign-in screen or loads the host's data.
</script>
</body>
